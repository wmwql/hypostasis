<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypostasis · 表象与结构</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050510;
    --panel-bg: rgba(12, 12, 30, 0.94);
    --border: rgba(255, 255, 255, 0.08);
    --text: rgba(255, 255, 255, 0.88);
    --text-dim: rgba(255, 255, 255, 0.45);
    --text-faint: rgba(255, 255, 255, 0.22);
    --hover: rgba(255, 255, 255, 0.08);
    --active: rgba(100, 150, 220, 0.18);
  }

  body {
    background: var(--bg);
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
    height: 100vh; height: 100dvh;
    user-select: none; -webkit-user-select: none;
  }

  /* ═══ TOP BAR ═══ */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 46px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }

  #logo {
    color: var(--text);
    font-size: 1rem; letter-spacing: 0.12em;
    display: flex; align-items: center; gap: 8px;
  }
  #logo-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(140, 200, 255, 0.7);
    box-shadow: 0 0 8px rgba(140, 200, 255, 0.4);
  }
  #current-label {
    color: var(--text-dim);
    font-size: 0.62rem; letter-spacing: 0.08em;
    margin-left: 4px;
    transition: color 0.4s;
  }
  #current-label.sim { color: rgba(130, 180, 240, 0.55); }
  #current-label.fantasy { color: rgba(220, 180, 130, 0.55); }

  #top-actions { display: flex; align-items: center; gap: 6px; }

  .top-btn {
    width: 32px; height: 32px; border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
  }
  .top-btn:hover {
    background: var(--hover);
    color: var(--text);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .top-btn.active {
    background: var(--active);
    color: #fff;
    border-color: rgba(100, 150, 220, 0.3);
    box-shadow: 0 0 12px rgba(100, 150, 220, 0.1);
  }
  #btn-menu { font-family: 'Georgia', serif; font-size: 1.1rem; line-height: 1; }

  /* ═══ SIDEBAR ═══ */
  #sidebar {
    position: fixed; top: 46px; left: 0; bottom: 0; z-index: 99;
    width: 220px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s 0.3s;
    display: flex; flex-direction: column;
    padding: 12px 0;
    overflow-y: auto;
    pointer-events: none; visibility: hidden;
  }
  #sidebar.open {
    transform: translateX(0);
    pointer-events: all; visibility: visible;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s 0s;
  }

  .menu-section {
    padding: 8px 16px 4px;
    color: var(--text-faint);
    font-size: 0.52rem; letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; margin: 0 8px;
    border-radius: 8px; cursor: pointer;
    transition: all 0.2s;
    color: var(--text-dim);
    font-size: 0.72rem; letter-spacing: 0.06em;
    border: 1px solid transparent;
  }
  .menu-item:hover {
    background: var(--hover);
    color: var(--text);
    border-color: rgba(255, 255, 255, 0.06);
  }
  .menu-item.active {
    background: var(--active); color: #fff;
    border-color: rgba(100, 150, 220, 0.25);
    box-shadow: 0 0 14px rgba(100, 150, 220, 0.06);
  }
  .menu-item .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .menu-item .dot.sim { background: rgba(140, 200, 255, 0.6); }
  .menu-item .dot.fantasy { background: rgba(255, 200, 120, 0.6); }
  .menu-item .label { flex: 1; }
  .menu-item .key-hint {
    font-family: 'Courier New', monospace;
    font-size: 0.5rem; color: rgba(255, 255, 255, 0.18);
  }

  /* ═══ IFRAME ═══ */
  #frame-container {
    position: fixed; top: 46px; left: 0; right: 0; bottom: 0; z-index: 1;
  }

  iframe.project-frame {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  iframe.project-frame.active { opacity: 1; pointer-events: all; }

  /* ═══ FS HINT ═══ */
  #fs-hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 110; pointer-events: none;
    color: rgba(255, 255, 255, 0.2);
    font-size: 0.55rem; letter-spacing: 0.08em;
    opacity: 0; transition: opacity 1.5s;
  }
  #fs-hint.show { opacity: 1; }

  /* ═══ RESPONSIVE ═══ */
  @media (max-width: 768px) {
    #topbar { height: 42px; padding: 0 10px; }
    #frame-container { top: 42px; }
    #sidebar { top: 42px; width: 100%; }
  }
  @media (max-width: 600px) {
    #logo { font-size: 0.85rem; }
    #current-label { display: none; }
    .top-btn { width: 28px; height: 28px; font-size: 0.75rem; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div style="display:flex;align-items:center;gap:6px;">
    <button class="top-btn" id="btn-menu" title="菜单 (M)">&#9776;</button>
    <span id="logo"><span id="logo-dot"></span>Hypostasis</span>
    <span id="current-label">万象引力 · 星体模拟器</span>
  </div>
  <div id="top-actions">
    <button class="top-btn" id="btn-prev" title="上一个 (&#8592;)">&#9666;</button>
    <button class="top-btn" id="btn-next" title="下一个 (&#8594;)">&#9656;</button>
    <button class="top-btn" id="btn-fullscreen" title="全屏 (F)">&#9964;</button>
  </div>
</div>

<nav id="sidebar">
  <div class="menu-section">模拟类 · 物理驱动</div>
  <div class="menu-item active" data-index="0" data-cat="sim">
    <span class="dot sim"></span><span class="label">万象引力 · 星体模拟器</span><span class="key-hint">1</span>
  </div>
  <div class="menu-item" data-index="1" data-cat="sim">
    <span class="dot sim"></span><span class="label">维度阶梯 · 高维投影</span><span class="key-hint">2</span>
  </div>
  <div class="menu-item" data-index="2" data-cat="sim">
    <span class="dot sim"></span><span class="label">大洋之息 · 海洋生态模拟器</span><span class="key-hint">3</span>
  </div>
  <div class="menu-section">幻想类 · 涌现生成</div>
  <div class="menu-item" data-index="3" data-cat="fantasy">
    <span class="dot fantasy"></span><span class="label">The Dreaming Machine</span><span class="key-hint">4</span>
  </div>
  <div class="menu-item" data-index="4" data-cat="fantasy">
    <span class="dot fantasy"></span><span class="label">The Latent Garden</span><span class="key-hint">5</span>
  </div>
  <div class="menu-item" data-index="5" data-cat="fantasy">
    <span class="dot fantasy"></span><span class="label">小确幸 · Small Joys</span><span class="key-hint">6</span>
  </div>
  <div class="menu-item" data-index="6" data-cat="fantasy">
    <span class="dot fantasy"></span><span class="label">意识流形 · Consciousness Manifold</span><span class="key-hint">7</span>
  </div>
</nav>

<div id="frame-container">
  <iframe class="project-frame active" src="celestial-mechanics.html"></iframe>
  <iframe class="project-frame"></iframe>
  <iframe class="project-frame"></iframe>
  <iframe class="project-frame"></iframe>
  <iframe class="project-frame"></iframe>
  <iframe class="project-frame"></iframe>
  <iframe class="project-frame"></iframe>
</div>

<div id="fs-hint">按 Esc 退出全屏</div>

<script>
(function() {
  var projects = [
    { name: '万象引力 · 星体模拟器', cat: 'sim', src: 'celestial-mechanics.html' },
    { name: '维度阶梯 · 高维投影', cat: 'sim', src: 'dimensional-ladder.html' },
    { name: '大洋之息 · 海洋生态模拟器', cat: 'sim', src: 'ocean-thermodynamics.html' },
    { name: 'The Dreaming Machine', cat: 'fantasy', src: 'dreaming-machine.html' },
    { name: 'The Latent Garden', cat: 'fantasy', src: 'latent-garden.html' },
    { name: '小确幸 · Small Joys', cat: 'fantasy', src: 'small-joys.html' },
    { name: '意识流形 · Consciousness Manifold', cat: 'fantasy', src: 'consciousness-manifold.html' },
  ];

  var currentIndex = 0;
  var frames = document.querySelectorAll('.project-frame');
  var menuItems = document.querySelectorAll('.menu-item');
  var sidebar = document.getElementById('sidebar');
  var btnMenu = document.getElementById('btn-menu');
  var currentLabel = document.getElementById('current-label');
  var fsHint = document.getElementById('fs-hint');
  var sidebarOpen = false;

  function switchTo(index) {
    if (index === currentIndex && frames[index].classList.contains('active')) return;
    frames[currentIndex].classList.remove('active');
    frames[currentIndex].removeAttribute('src');
    frames[index].src = projects[index].src;
    frames[index].classList.add('active');
    menuItems[currentIndex].classList.remove('active');
    menuItems[index].classList.add('active');
    currentIndex = index;
    currentLabel.textContent = projects[index].name;
    currentLabel.className = projects[index].cat === 'sim' ? 'sim' : 'fantasy';
  }

  menuItems.forEach(function(item) {
    item.addEventListener('click', function() {
      switchTo(parseInt(item.dataset.index));
      closeSidebar();
    });
  });

  function openSidebar() {
    sidebarOpen = true;
    sidebar.classList.add('open');
    btnMenu.classList.add('active');
  }
  function closeSidebar() {
    sidebarOpen = false;
    sidebar.classList.remove('open');
    btnMenu.classList.remove('active');
  }

  btnMenu.addEventListener('click', function() {
    sidebarOpen ? closeSidebar() : openSidebar();
  });

  document.addEventListener('click', function(e) {
    if (sidebarOpen && !sidebar.contains(e.target) && e.target !== btnMenu) {
      closeSidebar();
    }
  });

  document.getElementById('btn-prev').addEventListener('click', function() {
    switchTo((currentIndex - 1 + projects.length) % projects.length);
  });
  document.getElementById('btn-next').addEventListener('click', function() {
    switchTo((currentIndex + 1) % projects.length);
  });

  document.getElementById('btn-fullscreen').addEventListener('click', function() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().then(function() {
        fsHint.classList.add('show');
        setTimeout(function() { fsHint.classList.remove('show'); }, 3000);
      }).catch(function() {});
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', function() {
    var btn = document.getElementById('btn-fullscreen');
    if (document.fullscreenElement) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
      fsHint.classList.remove('show');
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key.toLowerCase()) {
      case 'm': sidebarOpen ? closeSidebar() : openSidebar(); break;
      case 'escape':
        if (sidebarOpen) { closeSidebar(); e.preventDefault(); }
        break;
      case 'f':
        if (!e.ctrlKey && !e.metaKey) {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen().catch(function() {});
          e.preventDefault();
        }
        break;
      case '1': switchTo(0); closeSidebar(); break;
      case '2': switchTo(1); closeSidebar(); break;
      case '3': switchTo(2); closeSidebar(); break;
      case '4': switchTo(3); closeSidebar(); break;
      case '5': switchTo(4); closeSidebar(); break;
      case '6': switchTo(5); closeSidebar(); break;
      case '7': switchTo(6); closeSidebar(); break;
    }
  });

  console.log('%c◈ Hypostasis %c表象与结构',
    'font-size:1.4em;color:#aaccff', 'color:#aaa;');
  console.log('%c所见非所得。M键菜单 · F键全屏 · 1-4切换 · ←→前后',
    'color:#666;');
})();
</script>
</body>
</html>
