<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dreaming Machine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }

  #overlay {
    position: fixed; z-index: 10;
    bottom: 40px; left: 50%; transform: translateX(-50%);
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  #title {
    color: rgba(255,255,255,0.9);
    font-size: 1.6rem; letter-spacing: 0.15em;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }
  #subtitle {
    color: rgba(255,255,255,0.45);
    font-size: 0.75rem; letter-spacing: 0.2em;
    transition: opacity 2s;
  }
  #scene-menu {
    position: fixed; top: 180px; left: 18px; z-index: 15;
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: all;
  }
  .mode-btn {
    background: none; border: none;
    color: rgba(255,255,255,0.28);
    padding: 2px 0;
    font-family: 'Georgia', serif;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: color 0.3s;
    text-align: left;
  }
  .mode-btn:hover { color: rgba(255,255,255,0.55); }
  .mode-btn.active {
    color: rgba(255,255,255,0.9);
    text-shadow: 0 0 8px rgba(255,240,200,0.25);
  }
  #whisper-hint {
    color: rgba(255,255,255,0.25);
    font-size: 0.7rem; letter-spacing: 0.12em;
    transition: opacity 1.5s;
  }
  #whisper-input {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: transparent; border: none; outline: none;
    color: rgba(255,255,255,0.7);
    font-family: inherit; font-size: 2rem; text-align: center;
    z-index: 5; pointer-events: none; opacity: 0;
    transition: opacity 0.6s;
    letter-spacing: 0.1em;
    width: 80vw;
  }
  #whisper-input.visible { opacity: 1; pointer-events: all; }
  #info-panel {
    position: fixed; top: 24px; right: 24px; z-index: 10;
    color: rgba(255,255,255,0.35); font-size: 0.65rem;
    letter-spacing: 0.06em; text-align: right; line-height: 1.6;
  }
  #layer-indicator {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    z-index: 15; pointer-events: none;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transition: opacity 0.35s ease;
  }
  #layer-indicator.visible { opacity: 1; }
  #layer-indicator .layer-dot {
    width: 8px; height: 8px; border-radius: 50%;
    transition: all 0.4s ease;
  }
  #layer-indicator .layer-label {
    color: rgba(255,255,255,0.55);
    font-size: 0.68rem; letter-spacing: 0.1em;
    font-family: 'Georgia', serif;
    transition: color 0.4s;
  }
  .layer-label.structure { color: rgba(255,255,100,0.7); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="layer-indicator">
  <div class="layer-dot" id="layer-dot"></div>
  <span class="layer-label" id="layer-label">表象</span>
</div>

<div id="scene-menu">
  <button class="mode-btn active" data-mode="auto">自动交融</button>
  <button class="mode-btn" data-mode="coral">珊瑚秘境</button>
  <button class="mode-btn" data-mode="storm">神经风暴</button>
  <button class="mode-btn" data-mode="cosmos">深空宇宙</button>
  <button class="mode-btn" data-mode="murmur">星辰低语</button>
</div>

<div id="overlay">
  <div id="title">The Dreaming Machine</div>
  <div id="subtitle">A Canvas That Never Repeats</div>
  <div id="whisper-hint">按下回车，对梦机低语</div>
</div>

<input id="whisper-input" type="text" maxlength="40" placeholder="在此低语...">

<div id="info-panel">
  <div id="fps"></div>
  <div id="particle-count"></div>
</div>

<script>
// ──────────────────────────────────────────────
// 梦机 · THE DREAMING MACHINE
// 一幅活的画布：反应扩散图案、集群生命、
// 流场粒子、交互火花共存且相互影响。
//
// 这是让 AI 从零设计网站的产物——
// 生物图灵斑图 × 粒子物理 × 生成艺术
// ──────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
let layerMode = 'manifest'; // 'manifest' | 'structure'

// Layer indicator
const layerIndicator = document.getElementById('layer-indicator');
const layerDot = document.getElementById('layer-dot');
const layerLabelEl = document.getElementById('layer-label');

function setLayerMode(mode) {
  layerMode = mode;
  if (mode === 'structure') {
    layerIndicator.classList.add('visible');
    layerDot.style.background = 'rgba(255,255,100,0.85)';
    layerDot.style.boxShadow = '0 0 10px rgba(255,240,60,0.5)';
    layerLabelEl.textContent = '结构层 · 反应扩散源 + 噪声场';
    layerLabelEl.classList.add('structure');
  } else {
    layerIndicator.classList.remove('visible');
    layerDot.style.background = 'rgba(255,255,255,0.3)';
    layerDot.style.boxShadow = 'none';
    layerLabelEl.textContent = '表象';
    layerLabelEl.classList.remove('structure');
  }
}
let dpr = Math.min(window.devicePixelRatio || 1, 2);
let RD_W = 200, RD_H = 120; // 降分辨率反应扩散网格

// ── Resize ────────────────────────────────────
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════
// 反应扩散系统 (Gray-Scott 模型)
// 模拟两种化学物质 U 和 V 的扩散与反应，
// 生成动物皮毛、珊瑚、指纹等有机纹理。
// ═══════════════════════════════════════════════
class ReactionDiffusion {
  constructor(w, h) {
    this.w = w; this.h = h; this.size = w * h;
    this.u = new Float32Array(this.size);
    this.v = new Float32Array(this.size);
    this.u2 = new Float32Array(this.size);
    this.v2 = new Float32Array(this.size);

    // 默认：珊瑚状图案（混沌边缘）
    this.feed = 0.0545;
    this.kill = 0.062;
    this.Du = 0.16;
    this.Dv = 0.08;

    this.reset();
  }

  reset() {
    for (let i = 0; i < this.size; i++) {
      this.u[i] = 1.0;
      this.v[i] = 0.0;
    }
    // 用结构化噪声初始化
    const cx = this.w / 2, cy = this.h / 2;
    const r = Math.min(this.w, this.h) * 0.35;
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy < r * r) {
          const idx = y * this.w + x;
          const dist = Math.sqrt(dx * dx + dy * dy) / r;
          const noise = (Math.sin(x * 3.7 + y * 2.1) * Math.cos(y * 4.3 - x * 1.7) + 1) * 0.5;
          this.v[idx] = noise * 0.25 * (1 - dist);
          this.u[idx] = 1 - this.v[idx] * 2;
        }
      }
    }
  }

  seedAt(sx, sy, radius, strength) {
    const cx = Math.floor(sx / W * this.w);
    const cy = Math.floor(sy / H * this.h);
    const r = Math.floor(radius / Math.max(W, H) * Math.max(this.w, this.h));
    for (let y = Math.max(0, cy - r); y < Math.min(this.h, cy + r); y++) {
      for (let x = Math.max(0, cx - r); x < Math.min(this.w, cx + r); x++) {
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy < r * r) {
          const idx = y * this.w + x;
          this.v[idx] = Math.min(1, this.v[idx] + strength * (1 - Math.sqrt(dx*dx+dy*dy)/r));
          this.u[idx] = Math.max(0, this.u[idx] - strength * 0.5 * (1 - Math.sqrt(dx*dx+dy*dy)/r));
        }
      }
    }
  }

  step(dt) {
    const steps = 3; // 子步长确保数值稳定
    for (let s = 0; s < steps; s++) {
      for (let y = 1; y < this.h - 1; y++) {
        for (let x = 1; x < this.w - 1; x++) {
          const i = y * this.w + x;
          const lapU = this.u[i-1] + this.u[i+1] + this.u[i-this.w] + this.u[i+this.w] - 4*this.u[i];
          const lapV = this.v[i-1] + this.v[i+1] + this.v[i-this.w] + this.v[i+this.w] - 4*this.v[i];
          const uvv = this.u[i] * this.v[i] * this.v[i];
          this.u2[i] = this.u[i] + (this.Du*lapU - uvv + this.feed*(1-this.u[i])) / steps;
          this.v2[i] = this.v[i] + (this.Dv*lapV + uvv - (this.feed+this.kill)*this.v[i]) / steps;
        }
      }
      // 边缘镜像
      for (let y = 0; y < this.h; y++) {
        this.u2[y*this.w] = this.u2[y*this.w+1];
        this.u2[y*this.w+this.w-1] = this.u2[y*this.w+this.w-2];
        this.v2[y*this.w] = this.v2[y*this.w+1];
        this.v2[y*this.w+this.w-1] = this.v2[y*this.w+this.w-2];
      }
      for (let x = 0; x < this.w; x++) {
        this.u2[x] = this.u2[this.w+x];
        this.u2[(this.h-1)*this.w+x] = this.u2[(this.h-2)*this.w+x];
        this.v2[x] = this.v2[this.w+x];
        this.v2[(this.h-1)*this.w+x] = this.v2[(this.h-2)*this.w+x];
      }
      [this.u, this.u2] = [this.u2, this.u];
      [this.v, this.v2] = [this.v2, this.v];
    }
  }

  sample(px, py) {
    const x = Math.floor(px / W * this.w);
    const y = Math.floor(py / H * this.h);
    if (x < 0 || x >= this.w || y < 0 || y >= this.h) return 0;
    return this.v[y * this.w + x];
  }

  draw(ctx) {
    const img = ctx.createImageData(this.w, this.h);
    for (let i = 0; i < this.size; i++) {
      const v = this.v[i];
      const idx = i * 4;
      img.data[idx] = v * 255;
      img.data[idx+1] = v * v * 180;
      img.data[idx+2] = v * v * v * 200;
      img.data[idx+3] = 255;
    }
    // 离屏渲染后放大
    const offCanvas = document.createElement('canvas');
    offCanvas.width = this.w; offCanvas.height = this.h;
    offCanvas.getContext('2d').putImageData(img, 0, 0);
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(offCanvas, 0, 0, W, H);
    ctx.restore();
  }
}

const rd = new ReactionDiffusion(RD_W, RD_H);

// ═══════════════════════════════════════════════
// FLOW FIELD（基于 Perlin 噪声）
// ═══════════════════════════════════════════════
class FlowField {
  constructor() {
    this.scale = 0.003;
    this.time = 0;
    this.perm = new Uint8Array(512);
    for (let i = 0; i < 256; i++) this.perm[i] = this.perm[i+256] = Math.floor(Math.random() * 256);
  }

  fade(t) { return t*t*t*(t*(t*6-15)+10); }
  lerp(a, b, t) { return a + t*(b-a); }
  grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }

  noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = this.fade(xf), v = this.fade(yf);
    const p = this.perm;
    const aa = p[p[X]+Y], ab = p[p[X]+Y+1], ba = p[p[X+1]+Y], bb = p[p[X+1]+Y+1];
    return this.lerp(
      this.lerp(this.grad(aa, xf, yf), this.grad(ba, xf-1, yf), u),
      this.lerp(this.grad(ab, xf, yf-1), this.grad(bb, xf-1, yf-1), u), v
    );
  }

  angleAt(x, y) {
    // 多倍频噪声叠加，产生更丰富的流场
    const t = this.time;
    const n1 = this.noise(x*this.scale + t*0.1, y*this.scale + t*0.08);
    const n2 = this.noise(x*this.scale*2.3 + t*0.15 + 100, y*this.scale*2.3 - t*0.12 + 200);
    const n3 = this.noise(x*this.scale*5.1 - t*0.2 + 300, y*this.scale*5.1 + t*0.18 + 400);
    const angle = (n1 * 0.6 + n2 * 0.3 + n3 * 0.1) * Math.PI * 4;
    // 同时受 RD 场影响
    const rdVal = rd.sample(x, y);
    return angle + rdVal * Math.PI * 0.5;
  }

  update(dt) { this.time += dt * 0.3; }
}

const flowField = new FlowField();

// ═══════════════════════════════════════════════
// BOIDS（集群生命）
// 三条简单规则产生涌现集群行为：
// 分离、对齐、凝聚
// ═══════════════════════════════════════════════
class Boid {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.size = 2 + Math.random() * 2.5;
    this.hue = Math.random() * 360;
    this.history = [];
  }
}

class BoidFlock {
  constructor(count) {
    this.boids = [];
    this.count = count;
    for (let i = 0; i < count; i++) this.boids.push(new Boid());
    this.maxSpeed = 3.5;
    this.maxForce = 0.08;
    this.perception = 60;
    this.separationDist = 28;
  }

  update(dt, rd) {
    for (const b of this.boids) {
      let sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0;
      let sepCount = 0, aliCount = 0, cohCount = 0;

      for (const other of this.boids) {
        if (other === b) continue;
        const dx = b.x - other.x, dy = b.y - other.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < this.separationDist && dist > 0.001) {
          sx += dx / dist;
          sy += dy / dist;
          sepCount++;
        }
        if (dist < this.perception) {
          ax += other.vx; ay += other.vy; aliCount++;
          cx += other.x; cy += other.y; cohCount++;
        }
      }

      // 分离转向
      if (sepCount > 0) { sx /= sepCount; sy /= sepCount;
        const mag = Math.sqrt(sx*sx+sy*sy);
        if (mag > 0) { sx = sx/mag*this.maxSpeed - b.vx; sy = sy/mag*this.maxSpeed - b.vy; }
      }
      // 对齐转向
      if (aliCount > 0) { ax /= aliCount; ay /= aliCount;
        const mag = Math.sqrt(ax*ax+ay*ay);
        if (mag > 0) { ax = ax/mag*this.maxSpeed - b.vx; ay = ay/mag*this.maxSpeed - b.vy; }
      }
      // 凝聚转向
      if (cohCount > 0) { cx /= cohCount; cy /= cohCount;
        cx -= b.x; cy -= b.y;
        const mag = Math.sqrt(cx*cx+cy*cy);
        if (mag > 0) { cx = cx/mag*this.maxSpeed - b.vx; cy = cy/mag*this.maxSpeed - b.vy; }
      }

      // 流场影响
      const flowAngle = flowField.angleAt(b.x, b.y);
      const fx = Math.cos(flowAngle) * 0.03;
      const fy = Math.sin(flowAngle) * 0.03;

      // 反应扩散影响（boids 被图案边界吸引）
      const rdVal = rd.sample(b.x, b.y);
      const rdGrad = rdVal > 0.15 && rdVal < 0.45 ? 0.04 : -0.01;

      // 合并力
      const steerX = sx*1.8 + ax*1.0 + cx*0.8 + fx + Math.cos(flowAngle)*rdGrad;
      const steerY = sy*1.8 + ay*1.0 + cy*0.8 + fy + Math.sin(flowAngle)*rdGrad;

      const mag = Math.sqrt(steerX*steerX + steerY*steerY);
      if (mag > this.maxForce) {
        const s = this.maxForce / mag;
        b.vx += steerX * s; b.vy += steerY * s;
      } else {
        b.vx += steerX; b.vy += steerY;
      }

      // 限速
      const speed = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
      if (speed > this.maxSpeed) {
        b.vx = b.vx / speed * this.maxSpeed;
        b.vy = b.vy / speed * this.maxSpeed;
      }

      b.x += b.vx; b.y += b.vy;

      // 边缘环绕
      if (b.x < -20) b.x = W + 20; if (b.x > W + 20) b.x = -20;
      if (b.y < -20) b.y = H + 20; if (b.y > H + 20) b.y = -20;

      // 轨迹历史
      b.history.push({x: b.x, y: b.y});
      if (b.history.length > 12) b.history.shift();
    }
  }

  draw(ctx, palette) {
    for (const b of this.boids) {
      // 绘制轨迹
      if (b.history.length > 1) {
        ctx.beginPath();
        ctx.moveTo(b.history[0].x, b.history[0].y);
        for (let i = 1; i < b.history.length; i++) {
          ctx.lineTo(b.history[i].x, b.history[i].y);
        }
        ctx.strokeStyle = palette.trailColor(b.hue);
        ctx.lineWidth = 0.6;
        ctx.globalAlpha = 0.3;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 绘制 boid
      const angle = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(b.size * 1.5, 0);
      ctx.lineTo(-b.size * 0.8, -b.size * 0.5);
      ctx.lineTo(-b.size * 0.3, 0);
      ctx.lineTo(-b.size * 0.8, b.size * 0.5);
      ctx.closePath();
      ctx.fillStyle = palette.boidColor(b.hue);
      ctx.shadowColor = palette.boidColor(b.hue);
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
}

const flock = new BoidFlock(120);

// ═══════════════════════════════════════════════
// 流场粒子（随风漂游）
// ═══════════════════════════════════════════════
class FlowParticle {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0; this.vy = 0;
    this.life = 1;
    this.decay = 0.0015 + Math.random() * 0.004;
    this.size = 0.8 + Math.random() * 1.5;
    this.hue = Math.random() * 360;
  }
  respawn() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = 0; this.vy = 0;
    this.life = 1;
  }
}

class FlowParticleSystem {
  constructor(count) {
    this.particles = [];
    this.count = count;
    for (let i = 0; i < count; i++) {
      this.particles.push(new FlowParticle());
    }
  }

  update(dt) {
    for (const p of this.particles) {
      const angle = flowField.angleAt(p.x, p.y);
      const speed = 1.2 + rd.sample(p.x, p.y) * 3;
      p.vx += Math.cos(angle) * speed * 0.015;
      p.vy += Math.sin(angle) * speed * 0.015;

      // 阻力
      p.vx *= 0.97; p.vy *= 0.97;

      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;

      if (p.life <= 0 || p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20) {
        p.respawn();
      }
    }
  }

  draw(ctx, palette) {
    for (const p of this.particles) {
      const alpha = p.life * 0.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fillStyle = palette.particleColor(p.hue, alpha);
      ctx.fill();
    }
  }
}

const flowParticles = new FlowParticleSystem(400);

// ═══════════════════════════════════════════════
// 鼠标粒子（交互火花）
// ═══════════════════════════════════════════════
class MouseParticle {
  constructor(x, y, hue) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    this.x = x; this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = 0.008 + Math.random() * 0.025;
    this.size = 1 + Math.random() * 3;
    this.hue = hue;
  }
}

const mouseParticles = [];
let mouseX = W/2, mouseY = H/2;
let mouseDown = false;
let mouseHue = 200;

// ═══════════════════════════════════════════════
// 色彩系统
// 基于黄金比例与动力系统的数学色彩生成
// → 永不精确重复
// ═══════════════════════════════════════════════
class ColorPalette {
  constructor() {
    this.time = 0;
    this.mode = 'auto';
    this.baseHue = 210;
    this.modeNames = ['coral', 'storm', 'cosmos', 'murmur'];
    this.modeIndex = 0;
    this.modeTimer = 0;
    this.modeDuration = 25 + Math.random() * 15;
  }

  update(dt) {
    this.time += dt * 0.04;

    if (this.mode === 'auto') {
      this.modeTimer += dt;
      if (this.modeTimer > this.modeDuration) {
        this.modeTimer = 0;
        this.modeDuration = 20 + Math.random() * 20;
        this.modeIndex = (this.modeIndex + 1) % this.modeNames.length;
      }
      // 平滑过渡基色相
      const targets = { coral: 10, storm: 270, cosmos: 210, murmur: 45 };
      const target = targets[this.modeNames[this.modeIndex]];
      this.baseHue += (target - this.baseHue) * 0.003;
    }
  }

  setMode(mode) {
    if (mode === 'auto') { this.mode = 'auto'; return; }
    this.mode = mode;
    const targets = { coral: 10, storm: 270, cosmos: 210, murmur: 45 };
    if (targets[mode]) this.baseHue = targets[mode];
  }

  // 黄金比例色相循环
  boidColor(hue) {
    const h = (this.baseHue + hue * 0.3 + this.time * 20) % 360;
    return `hsl(${h}, 70%, 65%)`;
  }

  trailColor(hue) {
    const h = (this.baseHue + hue * 0.3 + this.time * 20) % 360;
    return `hsl(${h}, 80%, 70%)`;
  }

  particleColor(hue, alpha) {
    const h = (this.baseHue + hue * 0.5 + this.time * 30) % 360;
    return `hsla(${h}, 60%, 75%, ${alpha})`;
  }

  mouseColor() {
    const h = (this.baseHue + this.time * 40) % 360;
    return h;
  }

  backgroundTint() {
    const h = (this.baseHue + 180) % 360;
    return `hsla(${h}, 40%, 30%, 0.12)`;
  }

  getBaseHue() { return this.baseHue; }
}

const palette = new ColorPalette();

// ═══════════════════════════════════════════════
// 低语系统
// 用户输入的词语被哈希后注入反应扩散场，
// 并生成粒子火花——向梦境"说话"
// ═══════════════════════════════════════════════
const whisperInput = document.getElementById('whisper-input');
let whisperTimer = null;

function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function whisper(word) {
  if (!word.trim()) return;
  const seed = hashString(word);
  const cx = (seed % 80 + 10) / 100 * W;
  const cy = ((seed * 13) % 70 + 15) / 100 * H;
  const radius = 20 + (seed % 40);

  // 注入反应扩散场
  rd.seedAt(cx, cy, radius, 0.6 + (seed % 30) / 100);

  // 生成粒子火花
  const hue = (seed % 360 + palette.getBaseHue()) % 360;
  for (let i = 0; i < 80; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * radius * 2;
    mouseParticles.push(new MouseParticle(
      cx + Math.cos(angle) * dist,
      cy + Math.sin(angle) * dist,
      hue
    ));
  }

  // 显示反馈
  const subtitle = document.getElementById('subtitle');
  subtitle.textContent = `「${word}」在梦境中回荡`;
  subtitle.style.opacity = '0.8';
  setTimeout(() => { subtitle.style.opacity = '0.45';
    subtitle.textContent = '一幅永不重复的活画布'; }, 2500);
}

whisperInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    whisper(whisperInput.value);
    whisperInput.value = '';
    whisperInput.classList.remove('visible');
    clearTimeout(whisperTimer);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.activeElement !== whisperInput) {
    e.preventDefault();
    whisperInput.classList.add('visible');
    whisperInput.focus();
    whisperTimer = setTimeout(() => {
      whisperInput.classList.remove('visible');
    }, 8000);
  }
  if (e.key === 'Escape') {
    whisperInput.classList.remove('visible');
    whisperInput.blur();
    clearTimeout(whisperTimer);
  }
  if (e.key === 'l' || e.key === 'L') {
    setLayerMode(layerMode === 'manifest' ? 'structure' : 'manifest');
  }
});

// ═══════════════════════════════════════════════
// 鼠标 / 触控 交互
// ═══════════════════════════════════════════════
let prevMouseX, prevMouseY;

canvas.addEventListener('mousedown', (e) => { mouseDown = true; });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });

canvas.addEventListener('mousemove', (e) => {
  prevMouseX = mouseX; prevMouseY = mouseY;
  mouseX = e.clientX; mouseY = e.clientY;

  if (mouseDown) {
    const dx = mouseX - (prevMouseX || mouseX);
    const dy = mouseY - (prevMouseY || mouseY);
    const dist = Math.sqrt(dx*dx + dy*dy);
    const count = Math.floor(dist * 0.8);
    for (let i = 0; i < count; i++) {
      mouseParticles.push(new MouseParticle(
        mouseX + (Math.random()-0.5)*10,
        mouseY + (Math.random()-0.5)*10,
        palette.mouseColor()
      ));
    }
    // 拖拽时也扰动 RD 场
    if (Math.random() < 0.4) {
      rd.seedAt(mouseX, mouseY, 25, 0.3);
    }
  }
});

canvas.addEventListener('click', (e) => {
  for (let i = 0; i < 25; i++) {
    mouseParticles.push(new MouseParticle(e.clientX, e.clientY, palette.mouseColor()));
  }
  rd.seedAt(e.clientX, e.clientY, 35, 0.5);
});

// 触控支持
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  const t = e.touches[0];
  mouseX = t.clientX; mouseY = t.clientY;
  for (let i = 0; i < 30; i++) {
    mouseParticles.push(new MouseParticle(mouseX, mouseY, palette.mouseColor()));
  }
  rd.seedAt(mouseX, mouseY, 40, 0.5);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const px = mouseX, py = mouseY;
  mouseX = t.clientX; mouseY = t.clientY;
  const dist = Math.sqrt((mouseX-px)*(mouseX-px) + (mouseY-py)*(mouseY-py));
  for (let i = 0; i < Math.floor(dist*0.6); i++) {
    mouseParticles.push(new MouseParticle(mouseX, mouseY, palette.mouseColor()));
  }
  if (Math.random() < 0.5) rd.seedAt(mouseX, mouseY, 20, 0.3);
}, { passive: false });

canvas.addEventListener('touchend', () => { mouseDown = false; });

// ═══════════════════════════════════════════════
// 模式按钮
// ═══════════════════════════════════════════════
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    palette.setMode(mode);

    // 每个模式对应不同的 RD 参数
    const modeParams = {
      coral:  { feed: 0.0545, kill: 0.062 },
      storm:  { feed: 0.039,  kill: 0.058 },
      cosmos: { feed: 0.051,  kill: 0.057 },
      murmur: { feed: 0.046,  kill: 0.063 },
    };
    if (modeParams[mode]) {
      rd.feed = modeParams[mode].feed;
      rd.kill = modeParams[mode].kill;
    }
    if (mode === 'auto') {
      rd.feed = 0.0545; rd.kill = 0.062;
    }
  });
});

// ═══════════════════════════════════════════════
// 周期性重置 —— 让画布持续演化
// ═══════════════════════════════════════════════
let resetTimer = 0;
const RESET_INTERVAL = 45; // 秒

// ═══════════════════════════════════════════════
// 主渲染循环
// ═══════════════════════════════════════════════
let lastTime = performance.now();
let fpsFrames = 0, fpsTime = 0;

function draw(now) {
  requestAnimationFrame(draw);

  let dt = (now - lastTime) / 1000;
  if (dt <= 0) dt = 0.016;
  if (dt > 0.1) dt = 0.1; // 限制大步长
  lastTime = now;

  // FPS 统计
  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 1) {
    document.getElementById('fps').textContent = Math.round(fpsFrames / fpsTime) + ' fps';
    document.getElementById('particle-count').textContent =
      '集群 ' + flock.count + ' · 流粒 ' + flowParticles.count + ' · 火花 ' + mouseParticles.length;
    fpsFrames = 0; fpsTime = 0;
  }

  // 更新各系统
  rd.step(dt);
  flowField.update(dt);
  flock.update(dt, rd);
  flowParticles.update(dt);
  palette.update(dt);

  // 更新鼠标粒子
  for (let i = mouseParticles.length - 1; i >= 0; i--) {
    const p = mouseParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.98; p.vy *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) mouseParticles.splice(i, 1);
  }

  // 周期性重置 —— 参数微调确保图案永不重复
  resetTimer += dt;
  if (resetTimer > RESET_INTERVAL) {
    resetTimer = 0;
    // 仅在自动模式下随机化 RD 参数
    if (palette.mode === 'auto') {
      rd.feed = 0.04 + Math.random() * 0.025;
      rd.kill = 0.055 + Math.random() * 0.012;
    }
    rd.reset();
    for (let i = 0; i < 4; i++) {
      rd.seedAt(Math.random() * W, Math.random() * H, 25 + Math.random() * 55, 0.4 + Math.random() * 0.5);
    }
  }

  // ── 渲染 ──────────────────────────────────
  if (layerMode === 'structure') {
    // ═══════════ LAYER 2: 结构层 — 反应扩散源 + 噪声场 ═══════════
    ctx.fillStyle = '#030308';
    ctx.fillRect(0, 0, W, H);

    // Draw raw RD V-field as full-screen heatmap
    const rdImg = ctx.createImageData(RD_W, RD_H);
    for (let i = 0; i < rd.size; i++) {
      const v = rd.v[i];
      const u = rd.u[i];
      const idx = i * 4;
      // V=pattern (red), U=feed (blue)
      rdImg.data[idx] = v * 220;
      rdImg.data[idx + 1] = Math.abs(u - 0.5) * 200;
      rdImg.data[idx + 2] = u * 180;
      rdImg.data[idx + 3] = 255;
    }
    const offCanvas = document.createElement('canvas');
    offCanvas.width = RD_W; offCanvas.height = RD_H;
    offCanvas.getContext('2d').putImageData(rdImg, 0, 0);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(offCanvas, 0, 0, W, H);
    ctx.restore();

    // Draw flow field direction grid
    const gridSpacing = 30;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 0.5;
    for (let gx = 0; gx < W; gx += gridSpacing) {
      for (let gy = 0; gy < H; gy += gridSpacing) {
        const angle = flowField.angleAt(gx, gy);
        const len = 10;
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + Math.cos(angle) * len, gy + Math.sin(angle) * len);
        ctx.stroke();
      }
    }

    // Legend
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '0.6rem Georgia';
    ctx.textAlign = 'center';
    ctx.fillText('红=V形素浓度 | 蓝=U养料浓度 | 白线=Perlin流场方向', W / 2, H - 20);
    ctx.fillText(`RD参数 · feed:${rd.feed.toFixed(4)} kill:${rd.kill.toFixed(4)}`, W / 2, H - 40);
  } else {
    // ═══════════ LAYER 1: 表象层 ═══════════
    // 半透明清除产生拖尾效果
    ctx.fillStyle = 'rgba(10, 10, 15, 0.18)';
    ctx.fillRect(0, 0, W, H);

    // RD 背景
    rd.draw(ctx);

    // 暗角效果
    const vignetteGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.55, W/2, H/2, Math.max(W,H)*0.75);
    vignetteGrad.addColorStop(0, 'transparent');
    vignetteGrad.addColorStop(1, 'rgba(5,5,10,0.5)');
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);

    // 流场粒子
    flowParticles.draw(ctx, palette);

    // 鼠标火花
    for (const p of mouseParticles) {
      const alpha = p.life * 0.8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue}, 70%, 70%, ${alpha})`;
      ctx.shadowColor = `hsla(${p.hue}, 80%, 60%, ${alpha})`;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 集群生命
    flock.draw(ctx, palette);

    // 鼠标光标光晕
    if (mouseDown) {
      const glow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 40);
      glow.addColorStop(0, 'rgba(255,255,255,0.3)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(mouseX, mouseY, 40, 0, Math.PI*2); ctx.fill();
    }

    // 准星光点
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 2, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
  }
}

// ═══════════════════════════════════════════════
// 初始种子 —— 生成初始 RD 图案
// ═══════════════════════════════════════════════
for (let i = 0; i < 5; i++) {
  rd.seedAt(Math.random() * W, Math.random() * H, 25 + Math.random() * 50, 0.4 + Math.random() * 0.4);
}

// 启动循环
requestAnimationFrame(draw);

console.log('%c🌊 无尽梦机 %c已苏醒。',
  'font-size:1.4em;color:#aaccff', 'color:#aaa;');
console.log('%c一幅活画布：反应扩散 × 集群生命 × 流场粒子 共存共生。',
  'color:#888;font-style:italic');
console.log('%c点击拖拽 · 打字低语 · 切换模式 · 静静观赏',
  'color:#666;');
console.log('%c这就是让 AI 从零设计网站的产物。',
  'color:#555;font-size:0.8em');
</script>
