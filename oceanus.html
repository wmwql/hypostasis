<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>大洋之息 · 海洋生态模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;overflow:hidden;font-family:'Georgia','Times New Roman',serif;user-select:none;-webkit-user-select:none;cursor:crosshair}
canvas{display:block;position:fixed;top:0;left:0;z-index:1;touch-action:none}
#so{position:fixed;top:0;left:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .35s}
#so.on{opacity:1}

#ui{position:fixed;z-index:10;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
#title{color:rgba(255,255,255,0.88);font-size:1.3rem;letter-spacing:.15em;text-shadow:0 0 40px rgba(100,180,255,0.3)}
#bn{color:rgba(255,255,255,0.4);font-size:.68rem;letter-spacing:.1em;font-style:italic;transition:all 1.2s}
#modes{position:fixed;top:180px;left:18px;z-index:15;display:flex;flex-direction:column;gap:3px;pointer-events:all}
.mb{background:none;border:none;color:rgba(255,255,255,0.2);padding:2px 0;font-family:'Georgia',serif;font-size:.68rem;letter-spacing:.08em;cursor:pointer;transition:color .3s;text-align:left}
.mb:hover{color:rgba(255,255,255,0.55)}
.mb.on{color:rgba(255,255,255,0.9);text-shadow:0 0 8px rgba(100,180,255,0.25)}
#hint{color:rgba(255,255,255,0.18);font-size:.55rem;letter-spacing:.08em;transition:opacity 2s}

#info{position:fixed;z-index:10;top:20px;right:20px;color:rgba(255,255,255,0.3);font-size:.56rem;letter-spacing:.06em;text-align:right;line-height:1.8;font-family:'Courier New',monospace;pointer-events:none}
#toggles{position:fixed;z-index:10;top:130px;right:20px;display:flex;flex-direction:column;gap:4px;pointer-events:all}
.tg{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);padding:4px 10px;border-radius:6px;font-family:inherit;font-size:.55rem;cursor:pointer;transition:all .3s;letter-spacing:.05em}
.tg:hover{border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.75)}
.tg.on{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.8);border-color:rgba(255,255,255,0.3)}

#li{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .35s}
#li.on{opacity:1}
#li .ld{width:8px;height:8px;border-radius:50%;transition:all .4s}
#li .ll{color:rgba(255,255,255,0.55);font-size:.68rem;letter-spacing:.1em;font-family:'Georgia',serif}

#ht{position:fixed;top:20px;left:24px;z-index:20;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.45);font-size:.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .35s;pointer-events:all;line-height:1}
#ht:hover,#ht.op{background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(255,255,255,0.4);box-shadow:0 0 18px rgba(180,200,255,0.1)}
#hp{position:fixed;top:54px;left:24px;z-index:19;background:rgba(12,12,30,0.92);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:175px;max-width:calc(100vw - 48px);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .3s;pointer-events:none;backdrop-filter:blur(12px)}
#hp.on{opacity:1;visibility:visible;transform:translateY(0);pointer-events:all}
#hp .htitle{color:rgba(255,255,255,0.75);font-size:.75rem;letter-spacing:.12em;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.08)}
.hs{display:flex;flex-direction:column;gap:3px}
.hl{color:rgba(255,255,255,0.35);font-size:.52rem;letter-spacing:.08em;text-transform:uppercase}
.hr{color:rgba(255,255,255,0.5);font-size:.6rem;letter-spacing:.05em;display:flex;align-items:center;gap:5px}
kbd{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:3px;padding:1px 5px;font-family:'Courier New',monospace;font-size:.58rem;color:rgba(255,255,255,0.65)}

#insp{position:fixed;z-index:20;background:rgba(10,15,30,0.92);border:1px solid rgba(100,180,255,0.2);border-radius:10px;padding:12px 16px;color:rgba(255,255,255,0.8);font-size:.62rem;line-height:1.7;letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity .3s;font-family:'Courier New',monospace}
#insp.on{opacity:1}
#insp .sn{font-family:'Georgia',serif;font-size:.8rem;color:rgba(255,255,255,0.95);margin-bottom:3px}
#insp .st{color:rgba(255,255,255,0.5)}
#insp .st b{color:rgba(255,255,255,0.8)}

#tools{position:fixed;z-index:10;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;pointer-events:all}
.tb{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(15,15,35,0.85);color:rgba(255,255,255,0.5);font-size:1rem;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;position:relative}
.tb:hover{background:rgba(35,35,70,0.9);border-color:rgba(255,255,255,0.25);color:#fff}
.tb.on{background:rgba(50,90,180,0.35);border-color:rgba(100,150,255,0.45);color:#fff;box-shadow:0 0 14px rgba(100,150,255,0.15)}
.tb .tip{position:absolute;left:44px;background:rgba(0,0,0,0.85);color:rgba(255,255,255,0.75);padding:3px 10px;border-radius:4px;font-size:.58rem;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.tb:hover .tip{opacity:1}

#slist{position:fixed;z-index:10;left:60px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:3px;background:rgba(12,12,30,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:6px;max-height:60vh;overflow-y:auto;pointer-events:all}
#slist.on{display:flex}
#slist button{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.5);padding:4px 10px;border-radius:4px;font-family:inherit;font-size:.55rem;cursor:pointer;text-align:left;white-space:nowrap;transition:all .2s}
#slist button:hover{background:rgba(255,255,255,0.1);color:#fff}

@media(max-width:768px){#title{font-size:1rem}.mb{font-size:.58rem}#info{top:10px;right:6px;font-size:.48rem}#ui{bottom:18px}#modes{top:160px;left:6px;gap:2px}#ht{top:10px;left:6px;width:26px;height:26px}#hp{top:40px;left:6px}#tools{left:4px;gap:3px}.tb{width:32px;height:32px;font-size:.85rem}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<canvas id="so"></canvas>

<div id="li"><div class="ld" id="ldot"></div><span class="ll" id="llbl">表象</span></div>

<div id="ht" title="帮助">?</div>
<div id="hp">
  <div class="htitle">操作</div>
  <div class="hs"><div class="hl">鼠标</div>
    <div class="hr"><kbd>左键</kbd> 点击生物查看 / 投放</div>
    <div class="hr"><kbd>右键拖拽</kbd> 平移</div>
    <div class="hr"><kbd>滚轮</kbd> 上下平移</div>
    <div class="hr"><kbd>Ctrl+滚轮</kbd> 缩放</div>
    <div class="hr"><kbd>Hover</kbd> 悬浮查看名称</div>
  </div>
  <div class="hs"><div class="hl">键盘</div>
    <div class="hr"><kbd>1-6</kbd> 切换生境</div>
    <div class="hr"><kbd>Space</kbd> 暂停</div>
    <div class="hr"><kbd>R</kbd> 重置</div>
    <div class="hr"><kbd>F</kbd> 流线</div>
    <div class="hr"><kbd>L</kbd> 结构层</div>
  </div>
  <div class="hs"><div class="hl">投放</div>
    <div class="hr"><kbd>Q</kbd> 沙子 <kbd>W</kbd> 营养盐 <kbd>E</kbd> 光子</div>
    <div class="hr"><kbd>A</kbd> 生物列表</div>
  </div>
</div>

<div id="tools">
  <button class="tb on" data-t="inspect">🔍<span class="tip">查看</span></button>
  <button class="tb" data-t="sand">🏖️<span class="tip">沙子 Q</span></button>
  <button class="tb" data-t="nutrient">🌿<span class="tip">营养盐 W</span></button>
  <button class="tb" data-t="photon">☀️<span class="tip">光子 E</span></button>
  <button class="tb" data-t="spawn">🐟<span class="tip">投放生物 A</span></button>
</div>
<div id="slist"></div>

<div id="modes">
  <button class="mb" data-b="coral">珊瑚礁</button>
  <button class="mb on" data-b="open-ocean">开阔大洋</button>
  <button class="mb" data-b="deep-sea">深海</button>
  <button class="mb" data-b="kelp-forest">海藻林</button>
  <button class="mb" data-b="hydrothermal">热液喷口</button>
  <button class="mb" data-b="polar">极地海洋</button>
</div>

<div id="ui">
  <div id="title">大洋之息 · 海洋生态模拟器</div>
  <div id="bn">开阔大洋</div>
  <div id="hint">🔍 点击查看 · 右键平移 · 滚轮/Ctrl+滚轮 · 1-6生境 · ?帮助</div>
</div>
<div id="info"></div>
<div id="toggles">
  <button class="tg" id="tgf">流线 F</button>
  <button class="tg" id="tgg">网格 G</button>
</div>
<div id="insp"></div>

<script>
// ═══════════════════════════════════════════════
//  OCEANUS · 大洋之息 (Canvas 2D)
// ═══════════════════════════════════════════════
const WW=1600,WH=900; // world size (one screen)
const PI=Math.PI,TAU=2*PI;
const clamp=(v,l,h)=>v<l?l:v>h?h:v,lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)};
const angleTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);

function hash2(x,y){let h=(x*374761393+y*668265263+1274126177)|0;h=((h>>16)^h)*0x45d9f3b;h=((h>>16)^h)*0x45d9f3b;return((h>>16)^h)/2147483648}
function noise2D(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),sx),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),sx),sy)}

// ── Config ──
const CFG={maxOrg:300,minPop:4,energyEff:0.2,digestEff:0.8,cellSz:60,envSz:40,dayLen:90,upwellInt:30,spawnInt:2,metBase:0.005,starveTh:0.08,reproFrac:0.6,detSink:8,nutRegen:0.05,maxDt:0.1};

// ── Spatial Grid ──
class SpatialGrid{constructor(w,h,cs){this.cs=cs;this.cols=Math.ceil(w/cs);this.rows=Math.ceil(h/cs);this.cells=new Array(this.cols*this.rows);for(let i=0;i<this.cells.length;i++)this.cells[i]=new Set()}
clear(){for(const c of this.cells)c.clear()}
idx(x,y){const col=Math.max(0,Math.min(this.cols-1,Math.floor(x/this.cs))),row=Math.max(0,Math.min(this.rows-1,Math.floor(y/this.cs)));return Math.max(0,Math.min(this.cells.length-1,row*this.cols+col))}
insert(o){const i=this.idx(o.x,o.y);if(i<this.cells.length&&this.cells[i])this.cells[i].add(o)}
nearby(x,y,r){const out=[];if(!this.cells.length)return out;const mnC=Math.max(0,Math.floor((x-r)/this.cs)),mxC=Math.min(this.cols-1,Math.floor((x+r)/this.cs)),mnR=Math.max(0,Math.floor((y-r)/this.cs)),mxR=Math.min(this.rows-1,Math.floor((y+r)/this.cs));for(let ri=mnR;ri<=mxR;ri++)for(let ci=mnC;ci<=mxC;ci++){const idx=ri*this.cols+ci;if(idx>=0&&idx<this.cells.length&&this.cells[idx])for(const o of this.cells[idx])out.push(o)}return out}}

// ── Environment ──
class EnvCell{constructor(){this.temp=20;this.light=1;this.nutrients=0.5;this.oxygen=0.6;this.detritus=0;this.currentU=0;this.currentV=0}}
class EnvSystem{constructor(w,h,cs){this.w=w;this.h=h;this.cs=cs;this.time=0;this.dayPhase=0;this.lightI=1;this.upwellT=0}
init(b){this.cols=Math.max(1,Math.ceil(this.w/this.cs));this.rows=Math.max(1,Math.ceil(this.h/this.cs));this.grid=[];for(let r=0;r<this.rows;r++)for(let c=0;c<this.cols;c++){const cell=new EnvCell(),df=r/Math.max(1,this.rows-1),d=df*b.maxDepth;cell.temp=b.tempProfile(d);cell.light=Math.exp(-b.lightAttenuation*d);cell.nutrients=b.nutrientProfile(d);cell.oxygen=b.oxygenProfile(d);this.grid.push(cell)}}
getAt(wx,wy,b){if(isNaN(wx)||isNaN(wy))return this.getAtD(0.5,b);if(!this.grid.length||this.h<=0)return this.getAtD(clamp(wy/b.maxDepth,0,1),b);const col=Math.max(0,Math.min(this.cols-1,Math.floor(wx/this.cs))),row=Math.max(0,Math.min(this.rows-1,Math.floor(wy/this.cs))),i=row*this.cols+col;if(i>=0&&i<this.grid.length)return this.grid[i];return this.getAtD(clamp(wy/b.maxDepth,0,1),b)}
getAtD(df,b){const d=df*b.maxDepth,c=new EnvCell();c.temp=b.tempProfile(d);c.light=Math.exp(-b.lightAttenuation*d);c.nutrients=b.nutrientProfile(d);c.oxygen=b.oxygenProfile(d);return c}
update(dt,b){this.time+=dt;this.dayPhase=(this.time%CFG.dayLen)/CFG.dayLen;this.lightI=0.5+0.5*Math.sin(this.dayPhase*TAU-PI/2);const wU=0.8*this.lightI;
for(let r=0;r<this.rows;r++){const df=r/Math.max(1,this.rows-1),d=df*b.maxDepth;
for(let c=0;c<this.cols;c++){const i=r*this.cols+c,cell=this.grid[i];
cell.temp=lerp(cell.temp,b.tempProfile(d),0.02);
cell.light=Math.exp(-b.lightAttenuation*d)*this.lightI;
const ekD=50,ekDecay=Math.exp(-d/ekD),wU0=wU*Math.cos(c/this.cols*PI*2)*3,wV0=wU*0.3;
const density=1025-0.15*(cell.temp-10)+0.78*35;
const corV=-wU0*ekDecay*0.2;cell.currentU=wU0*ekDecay+corV;cell.currentV=wV0*ekDecay-wU0*ekDecay*0.2;
cell.nutrients=lerp(cell.nutrients,b.nutrientProfile(d),0.005);
if(cell.detritus>0){const dr=CFG.nutRegen*(1+cell.temp/30),dec=Math.min(cell.detritus,dr*dt);cell.detritus-=dec;cell.nutrients=Math.min(1,cell.nutrients+dec*0.5)}
cell.oxygen=lerp(cell.oxygen,b.oxygenProfile(d),0.01)}}
for(let r=this.rows-1;r>0;r--)for(let c=0;c<this.cols;c++){const f=this.grid[r*this.cols+c],t=this.grid[(r+1)*this.cols+c];if(t&&f.detritus>0){const s=Math.min(f.detritus,CFG.detSink*dt);f.detritus-=s;t.detritus+=s}}
this.upwellT-=dt;if(this.upwellT<=0){this.upwellT=CFG.upwellInt+rand(-10,10);for(let i=0;i<3;i++){const cx=Math.floor(Math.random()*this.cols);for(let r=Math.floor(this.rows*0.6);r<this.rows;r++){const idx=r*this.cols+cx;if(this.grid[idx].nutrients>0.3&&r>this.rows*0.3){const si=Math.floor(this.rows*0.1)*this.cols+cx;this.grid[si].nutrients=Math.min(1,this.grid[si].nutrients+this.grid[idx].nutrients*0.15);this.grid[idx].nutrients*=0.85}}}}}
avgNut(){let s=0;for(const c of this.grid)s+=c.nutrients;return s/this.grid.length}
surfTemp(){if(!this.grid.length)return 20;let s=0;for(let c=0;c<this.cols;c++)s+=this.grid[c].temp;return s/this.cols}}

// ── Species ──
class SDef{constructor(c){Object.assign(this,c)}}
const SPEC={};
const ds=c=>{SPEC[c.id]=new SDef(c)};
ds({id:'phytoplankton',name:'浮游植物',en:'Phytoplankton',tl:1,sz:[2,5],sp:0.8,ecap:30,repr:0.08,life:45,diet:'photo',prey:[],env:{temp:[0,15,30,40],light:[0.05,1],depth:[0,300]},beh:['wander','photosyn'],sch:0,mass:0.1,hue:120,shape:'dot'});
ds({id:'cyanobacteria',name:'蓝细菌',en:'Cyanobacteria',tl:1,sz:[1,3],sp:0.5,ecap:20,repr:0.12,life:30,diet:'photo',prey:[],env:{temp:[5,20,40,55],light:[0.02,1],depth:[0,400]},beh:['wander','photosyn'],sch:0,mass:0.05,hue:190,shape:'dot'});
ds({id:'seaweed',name:'海藻',en:'Seaweed',tl:1,sz:[20,70],sp:0,ecap:150,repr:0.01,life:120,diet:'photo',prey:[],env:{temp:[2,8,20,28],light:[0.1,1],depth:[0,60]},beh:['rooted','sway','photosyn'],sch:0,mass:5,hue:100,shape:'kelp'});
ds({id:'zooplankton',name:'浮游动物',en:'Zooplankton',tl:2,sz:[3,7],sp:2,ecap:40,repr:0.06,life:35,diet:'filter',prey:['phytoplankton','cyanobacteria'],env:{temp:[2,10,28,35],light:[0.01,1],depth:[0,700]},beh:['wander','filter'],sch:30,mass:0.2,hue:350,shape:'oval'});
ds({id:'krill',name:'磷虾',en:'Krill',tl:2,sz:[5,12],sp:4,ecap:50,repr:0.07,life:40,diet:'filter',prey:['phytoplankton','cyanobacteria'],env:{temp:[-2,0,10,18],light:[0.01,0.6],depth:[0,400]},beh:['wander','school','filter'],sch:100,mass:0.3,hue:30,shape:'shrimp'});
ds({id:'smallFish',name:'小型鱼',en:'Small Fish',tl:3,sz:[8,18],sp:7,ecap:65,repr:0.04,life:55,diet:'herbivore',prey:['zooplankton','krill'],env:{temp:[10,18,30,36],light:[0.02,1],depth:[0,300]},beh:['wander','school','flee'],sch:40,mass:0.5,hue:210,shape:'fish'});
ds({id:'jellyfish',name:'水母',en:'Jellyfish',tl:3,sz:[15,45],sp:2,ecap:55,repr:0.03,life:50,diet:'carnivore',prey:['zooplankton','krill','smallFish'],env:{temp:[5,15,30,35],light:[0,1],depth:[0,900]},beh:['wander','hunt'],sch:0,mass:1.5,hue:330,shape:'jelly'});
ds({id:'mediumFish',name:'中型鱼',en:'Medium Fish',tl:4,sz:[18,42],sp:10,ecap:85,repr:0.025,life:65,diet:'carnivore',prey:['smallFish','krill'],env:{temp:[10,18,28,34],light:[0.02,1],depth:[0,500]},beh:['wander','school','hunt'],sch:15,mass:2,hue:45,shape:'fish'});
ds({id:'squid',name:'鱿鱼',en:'Squid',tl:4,sz:[22,55],sp:13,ecap:80,repr:0.02,life:45,diet:'carnivore',prey:['smallFish','krill','mediumFish'],env:{temp:[3,10,25,30],light:[0,0.3],depth:[100,1200]},beh:['wander','hunt'],sch:0,mass:2.5,hue:0,shape:'squid'});
ds({id:'largeFish',name:'大型鱼',en:'Large Fish',tl:5,sz:[45,110],sp:9,ecap:130,repr:0.012,life:90,diet:'carnivore',prey:['mediumFish','squid','smallFish'],env:{temp:[8,15,26,32],light:[0.01,1],depth:[0,900]},beh:['wander','hunt','patrol'],sch:0,mass:8,hue:200,shape:'fish'});
ds({id:'mammal',name:'海洋哺乳动物',en:'Marine Mammal',tl:5,sz:[55,140],sp:11,ecap:180,repr:0.006,life:150,diet:'carnivore',prey:['mediumFish','squid','largeFish','krill'],env:{temp:[-2,8,22,30],light:[0.01,1],depth:[0,600]},beh:['wander','hunt','breach','school'],sch:8,mass:25,hue:220,shape:'whale'});
ds({id:'bacteria',name:'分解菌',en:'Bacteria',tl:0,sz:[1,2],sp:0.3,ecap:15,repr:0.15,life:20,diet:'detritus',prey:[],env:{temp:[-5,5,50,110],light:[0,1],depth:[0,10000]},beh:['wander','decompose'],sch:0,mass:0.02,hue:55,shape:'dot'});
ds({id:'bottomFeeder',name:'底栖生物',en:'Bottom Feeder',tl:0,sz:[10,28],sp:1.5,ecap:45,repr:0.035,life:60,diet:'detritus',prey:[],env:{temp:[-2,2,35,50],light:[0,0.1],depth:[50,6000]},beh:['wander','scavenge'],sch:0,mass:1,hue:25,shape:'crab'});

// ── Biomes ──
class BDef{constructor(c){Object.assign(this,c)}}

// ── Physics ──
const PHYS={steerCoeff:25,desiredSpd:12,dragBase:0.15,moveCost:1e-8};
function steerToward(o,dx,dy,fm,dt){const m=o.species.mass;let fx=(dx-o.vx)*PHYS.steerCoeff*fm,fy=(dy-o.vy)*PHYS.steerCoeff*fm;const mf=o.species.sp*m*50*fm,fmag=Math.sqrt(fx*fx+fy*fy);if(fmag>mf&&fmag>0.001){fx=fx/fmag*mf;fy=fy/fmag*mf}if(isFinite(fx)&&isFinite(fy)&&m>0){o.vx+=fx/m*dt;o.vy+=fy/m*dt}o.energy-=m*(o.vx*o.vx+o.vy*o.vy)*PHYS.moveCost*dt}

// ── Behaviors ──
const BEH={
wander(o,n,env,dt){if(o._flee)return;let forceMul=0.6;if(o.hungerT>8||o.energy<o.species.ecap*0.15)forceMul=0.15;if(o._wa===undefined)o._wa=Math.random()*TAU;o._wa+=(Math.random()-0.5)*2.5*dt;if(o._wa>TAU)o._wa-=TAU;if(o._wa<0)o._wa+=TAU;const ps=o.species.sp*PHYS.desiredSpd;o.vx+=Math.cos(o._wa)*ps*forceMul*0.5*dt;o.vy+=Math.sin(o._wa)*ps*forceMul*0.3*dt;o.x+=env.currentU*1.5*dt;o.y+=env.currentV*1.5*dt;steerToward(o,Math.cos(o._wa)*ps,Math.sin(o._wa)*ps*0.5,forceMul,dt);if(o.species.tl===1&&env.light>0.03&&o.y>30)o.vy-=1.5*dt},
photosyn(o,n,env,dt){if(env.light>0.02&&env.nutrients>0.05){o.energy=Math.min(o.species.ecap,o.energy+env.light*env.nutrients*120*dt)}}
,filter(o,n,env,dt){for(const t of n){if(t===o||!t.alive)continue;if(o.species.prey.includes(t.species.id)){const d=dist(o,t);if(d<o.size+t.size){o.energy=Math.min(o.species.ecap,o.energy+t.energy*CFG.digestEff);t.alive=false;o.hungerT=0}}}if(env.detritus>0.01)o.energy=Math.min(o.species.ecap,o.energy+env.detritus*25*dt)}
,school(o,n,dt){if(!o.schId)return;const same=n.filter(x=>x!==o&&x.alive&&x.schId===o.schId);if(!same.length)return;let sx=0,sy=0,ax=0,ay=0,cx=0,cy=0;const sr=o.species.sz[1]*1.5,cr=o.species.sz[1]*6;for(const x of same){const d=dist(o,x);if(d>0&&d<sr){const s=(sr-d)/sr;sx+=(o.x-x.x)/d*s;sy+=(o.y-x.y)/d*s}ax+=x.vx;ay+=x.vy;if(d<cr&&d>0){cx+=x.x-o.x;cy+=x.y-o.y}}const nn=same.length,f=8*dt;o.vx+=sx*f*.6+ax/nn*f*.3+cx/nn*f*.2;o.vy+=sy*f*.6+ay/nn*f*.3+cy/nn*f*.2}
,hunt(o,n,dt){if(o.hungerT<3&&o.energy>o.species.ecap*0.3)return;if(o.target&&(!o.target.alive||dist(o,o.target)>o.size*10))o.target=null;if(!o.target){let cl=null,cd=o.size*7;for(const t of n){if(t===o||!t.alive)continue;if(!o.species.prey.includes(t.species.id))continue;const d=dist(o,t);if(d<cd){cd=d;cl=t}}o.target=cl}if(o.target){const d=dist(o,o.target),a=angleTo(o,o.target),hb=1+Math.min(o.hungerT/12,1.5),ps=o.species.sp*PHYS.desiredSpd*1.5*hb;steerToward(o,Math.cos(a)*ps,Math.sin(a)*ps,1.5,dt);if(d<o.size*.7+o.target.size*.7){const eg=o.target.energy*CFG.digestEff,ag=eg*Math.pow(CFG.energyEff,Math.max(1,o.species.tl-o.target.species.tl));o.energy=Math.min(o.species.ecap,o.energy+ag);o.target.alive=false;o.hungerT=0;o.target=null}}}
,flee(o,n,dt){o._flee=false;let st=0,fa=0;for(const t of n){if(t===o||!t.alive)continue;if(t.species.tl>o.species.tl){const d=dist(o,t),tr=t.size*5;if(d<tr&&d>0){const th=(tr-d)/tr;if(th>st){st=th;fa=angleTo(t,o)}}}}if(st>0.05){o._flee=true;const fs=o.species.sp*PHYS.desiredSpd*1.8*st,ea=fa+(Math.random()-.5)*PI*.6;steerToward(o,Math.cos(ea)*fs,Math.sin(ea)*fs,2,dt)}}
,rooted(o,n,env,dt){o.vx*=.1;if(!o._ry)o._ry=o.y;o.vy+=(o._ry-o.y)*.5*dt}
,sway(o,n,env,dt){o.vx+=env.currentU*2*dt;o.vx+=Math.sin(performance.now()*.002+(o._ry||o.y)*.1)*5*dt}
,patrol(o,n,dt){if(o.hungerT<4)return;if(!o._pa)o._pa=Math.random()*TAU;o._pa+=(Math.random()-.5)*.8*dt;if(o._pa>TAU)o._pa-=TAU;if(o._pa<0)o._pa+=TAU;const ps=o.species.sp*PHYS.desiredSpd*.7;steerToward(o,Math.cos(o._pa)*ps,Math.sin(o._pa)*ps*.2,.4,dt);if(o.y<10){o.vy+=5*dt;o._pa=Math.abs(o._pa)}}
,breach(o,n,dt){if(!o._bt)o._bt=rand(15,30);o._bt-=dt;if(o._bt<=0&&o.y<100&&o.energy>o.species.ecap*.5){steerToward(o,o.vx*.5,-o.species.sp*PHYS.desiredSpd*1.5,3,dt);if(o.y<=2){o._bt=rand(18,35);o.vy=o.species.sp*20}}}
,decompose(o,n,env,dt){if(env.detritus>.001)o.energy=Math.min(o.species.ecap,o.energy+env.detritus*40*dt);let bd=1/0,ba=0;for(const t of n){if(!t.alive&&t!==o&&!t._cons){const d=dist(o,t);if(d<bd&&d<50){bd=d;ba=angleTo(o,t)}}}if(isFinite(bd))steerToward(o,Math.cos(ba)*o.species.sp*15,Math.sin(ba)*o.species.sp*15,.8,dt)}
,scavenge(o,n,env,dt){if(env.detritus>.005)o.energy=Math.min(o.species.ecap,o.energy+env.detritus*35*dt);let bt=null,bd=1/0;for(const t of n){if(!t.alive&&t!==o&&!t._cons){const d=dist(o,t);if(d<bd&&d<o.size*5){bd=d;bt=t}}}if(bt){const d=dist(o,bt);if(d<o.size+bt.size){o.energy=Math.min(o.species.ecap,o.energy+bt.energy*.3);bt._cons=true;o.hungerT=0}else steerToward(o,Math.cos(angleTo(o,bt))*o.species.sp*25,Math.sin(angleTo(o,bt))*o.species.sp*25,.8,dt)}}
};

// ── Organism ──
class Organism{constructor(sp,x,y){this.species=sp;this.x=x;this.y=y;this.vx=(Math.random()-.5)*sp.sp*20;this.vy=(Math.random()-.5)*sp.sp*15;this.energy=sp.ecap*(.55+Math.random()*.4);this.age=0;this.size=sp.sz[0]+Math.random()*(sp.sz[1]-sp.sz[0]);this.alive=true;this.schId=sp.sch>0?Math.floor(Math.random()*1000):null;this.target=null;this.hungerT=0;this.gen=0;this._ry=y;this._pa=null;this._bt=null;this._cons=false;this._schRef=null;this._wa=undefined;this._flee=false;this._trail=[];this._trailT=0}}

// ── Spawner ──
class Spawner{constructor(){this.st=0}
suit(sp,env,d){const te=sp.env;let tf=0;if(te.temp){const[mn,ol,oh,mx]=te.temp,t=env.temp;tf=t>=ol&&t<=oh?1:t>=mn&&t<ol?(t-mn)/(ol-mn):t>oh&&t<=mx?(mx-t)/(mx-oh):0}let lf=0;if(te.light)lf=env.light>=te.light[0]&&env.light<=te.light[1]?1:0;let df=0;if(te.depth)df=d>=te.depth[0]&&d<=te.depth[1]?1:0;return tf*lf*df}
K(sp,b,es){const bk=(b.baseK&&b.baseK[sp.id])||50;let ts=0;for(let i=0;i<12;i++){const df=i/11,env=es.getAtD(df,b);ts+=this.suit(sp,env,df*b.maxDepth)}const as=ts/12;let k=Math.round(bk*(.2+.8*as));if(sp.tl===1)k=Math.round(k*(.4+.6*es.avgNut()));return Math.max(CFG.minPop+2,k)}
update(dt,orgs,b,es){this.st-=dt;if(this.st>0)return;this.st=CFG.spawnInt;const cnts={};for(const o of orgs){if(!o.alive)continue;cnts[o.species.id]=(cnts[o.species.id]||0)+1}for(const sid of b.species){const sp=SPEC[sid];if(!sp)continue;const cp=cnts[sid]||0,k=this.K(sp,b,es);let sc=0;if(cp<k*.7&&orgs.length<CFG.maxOrg)sc=Math.ceil((k-cp)/k*sp.repr*k*.5);if(cp<CFG.minPop&&cp>0)sc=Math.max(sc,CFG.minPop*3-cp);if(cp===0&&sp.tl===1)sc=Math.max(sc,Math.floor(k*.1));for(let i=0;i<Math.min(sc,25);i++)this.spawnOne(sp,b,es,orgs)}}
spawnOne(sp,b,es,orgs){let x,y,att=0;do{x=rand(20,WW-20);let df;if(sp.beh.includes('rooted'))df=.85+Math.random()*.15;else if(sp.tl===1)df=Math.random()*.25;else if(sp.tl>=4)df=.4+Math.random()*.5;else if(sp.env.depth){const[dMin,dMax]=sp.env.depth;df=(dMin+Math.random()*(dMax-dMin))/b.maxDepth;}else df=Math.random();y=df*es.h;const env=es.getAt(x,y,b);if(this.suit(sp,env,df*b.maxDepth)>.3||att++>12)break}while(true);const o=new Organism(sp,x,y);orgs.push(o);return o}}

// ── Seafloor Sand System ──
let sandParticles=[],rockParticles=[];
function initSeafloor(biome){
  sandParticles=[];rockParticles=[];
  for(let i=0;i<600;i++)sandParticles.push({x:rand(0,WW),y:biome.maxDepth+rand(0,15),r:rand(1,4),vx:0});
  for(let i=0;i<40;i++)rockParticles.push({x:rand(0,WW),y:biome.maxDepth+rand(-2,5),r:rand(5,15),vx:0});
}
function getFloorY(biome,x){
  let h=biome.maxDepth;const r=15;
  for(const s of sandParticles){if(Math.abs(s.x-x)<r)h=Math.min(h,s.y-s.r*0.5)}
  for(const rk of rockParticles){if(Math.abs(rk.x-x)<rk.r)h=Math.min(h,rk.y-rk.r*0.3)}
  return h;
}

// Polyfill roundRect
if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,r){if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};this.beginPath();this.moveTo(x+r.tl,y);this.lineTo(x+w-r.tr,y);this.quadraticCurveTo(x+w,y,x+w,y+r.tr);this.lineTo(x+w,y+h-r.br);this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);this.lineTo(x+r.bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r.bl);this.lineTo(x,y+r.tl);this.quadraticCurveTo(x,y,x+r.tl,y);this.closePath()}}
const soCanvas=document.getElementById('so'),soCtx=soCanvas.getContext('2d');
let camX=WW/2,camY=400,zoom=1;
const ZOOM_MIN=0.4,ZOOM_MAX=5,BASE_VH=900;

function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=window.innerWidth*dpr;canvas.height=window.innerHeight*dpr;canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);soCanvas.width=canvas.width;soCanvas.height=canvas.height;soCanvas.style.width=canvas.style.width;soCanvas.style.height=canvas.style.height}
resize();window.addEventListener('resize',resize);

function worldToScreen(wx,wy){return{x:(wx-camX)*zoom*s()+window.innerWidth/2,y:(wy-camY)*zoom*s()+window.innerHeight/2}}
function screenToWorld(sx,sy){return{x:(sx-window.innerWidth/2)/(zoom*s())+camX,y:(sy-window.innerHeight/2)/(zoom*s())+camY}}
function s(){return Math.min(window.innerWidth/WW,window.innerHeight/BASE_VH)}

function clampCamera(biome){const viewH=BASE_VH/zoom,skyM=100,flM=40;const cyMin=-skyM+viewH/2,cyMax=biome.maxDepth+flM-viewH/2;camY=clamp(camY,Math.min(cyMin,cyMax),Math.max(cyMin,cyMax));camX=clamp(camX,viewH*window.innerWidth/window.innerHeight/2,WW-viewH*window.innerWidth/window.innerHeight/2)}

// ── Drawing ──
const EMOJI={phytoplankton:'🌱',cyanobacteria:'🦠',seaweed:'🌿',zooplankton:'🫧',krill:'🦐',smallFish:'🐟',jellyfish:'🪼',mediumFish:'🐠',squid:'🦑',largeFish:'🦈',mammal:'🐋',bacteria:'•',bottomFeeder:'🦀'};
function drawOrganism(o,biome){
  const{species,x,y,size,energy,vx,vy}=o;
  const emoji=EMOJI[species.id]||'?';
  const ratio=energy/species.ecap;
  ctx.save();ctx.translate(x,y);
  const fs=Math.max(8,size*0.55);
  ctx.font=`${fs}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  // Hunger red glow
  if(ratio<0.2){ctx.fillStyle='rgba(255,0,0,0.2)';ctx.beginPath();ctx.arc(0,0,fs*.7,0,TAU);ctx.fill()}
  // Emoji
  const alpha=ratio<0.1?0.3:0.85;
  ctx.fillStyle=`rgba(0,0,0,${alpha*0.3})`;ctx.fillText(emoji,1,1);
  ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillText(emoji,0,0);
  ctx.restore();
}

function render(sim){
  const{organisms,biome,envSystem,time,_showStreams,_showGrid,_layerMode}=sim;
  const W=window.innerWidth,H=window.innerHeight;
  ctx.clearRect(0,0,W,H);

  // ── Camera Setup ──
  const sc=s()*zoom;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.translate(-camX,-camY);

  // ── Sky ──
  const skyTop=-100;
  const skyGrad=ctx.createLinearGradient(0,skyTop,0,0);
  skyGrad.addColorStop(0,`rgba(${8+envSystem.lightI*30},${12+envSystem.lightI*50},${35+envSystem.lightI*110},1)`);
  skyGrad.addColorStop(0.6,`rgba(${100+envSystem.lightI*80},${160+envSystem.lightI*50},230,1)`);
  skyGrad.addColorStop(1,'rgba(220,240,255,0.95)');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,skyTop,WW,-skyTop+5);

  // ── Sun ──
  const dayP=envSystem.dayPhase;const sunX=WW/2+Math.cos(dayP*TAU)*WW*.35;const sunY=-55+Math.sin(dayP*TAU-PI/2)*30;
  const sunG=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,80);
  sunG.addColorStop(0,'rgba(255,255,240,1)');sunG.addColorStop(0.1,'rgba(255,255,220,0.8)');sunG.addColorStop(0.5,'rgba(255,200,100,0.1)');sunG.addColorStop(1,'transparent');
  ctx.fillStyle=sunG;ctx.fillRect(sunX-100,sunY-100,200,200);
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(sunX,sunY,15,0,TAU);ctx.fill();

  // ── Water surface ──
  ctx.fillStyle='rgba(180,210,255,0.5)';ctx.fillRect(0,-3,WW,7);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);
  for(let x=0;x<=WW;x+=4){const w=Math.sin(x*.025+time*1.2)*3+Math.sin(x*.06+time*2)*2+Math.sin(x*.1+time*.7)*1.2;ctx.lineTo(x,w)}ctx.stroke();

  // ── Water column ──
  const md=biome.maxDepth;
  for(let i=0;i<60;i++){const t=i/60,d=t*md;const light=Math.exp(-biome.lightAttenuation*d)*envSystem.lightI;const r=lerp(biome.wc[0],biome.dc[0],t)*(.25+.75*light);const g=lerp(biome.wc[1],biome.dc[1],t)*(.25+.75*light);const b=lerp(biome.wc[2],biome.dc[2],t)*(.25+.75*light);ctx.fillStyle=`rgba(${r|0},${g|0},${b|0},${0.2+t*.5})`;ctx.fillRect(0,t*md,WW,md/60+1)}

  // ── God rays ──
  ctx.globalAlpha=0.05*envSystem.lightI;
  for(let i=0;i<7;i++){const rx=100+i*(WW-200)/6+Math.sin(time*.25+i*2.1)*80;const rw=20+Math.sin(i*2.7)*12;const rd=md*(.35+Math.abs(Math.sin(i*1.5))*.3);
    const g=ctx.createLinearGradient(rx,0,rx+Math.sin(i)*rd*.3,rd);g.addColorStop(0,'rgba(255,255,240,0.9)');g.addColorStop(0.5,'rgba(200,230,255,0.12)');g.addColorStop(1,'rgba(0,0,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(rx-rw,0);ctx.lineTo(rx+rw,0);ctx.lineTo(rx+rw*1.5+rd*.2,rd);ctx.lineTo(rx-rw*1.5+rd*.2,rd);ctx.fill()}
  ctx.globalAlpha=1;

  // ── Seafloor ──
  ctx.fillStyle=`rgb(${biome.sub[0]},${biome.sub[1]},${biome.sub[2]})`;
  ctx.beginPath();ctx.moveTo(0,md);
  for(let x=0;x<=WW;x+=8){ctx.lineTo(x,getFloorY(biome,x))}
  ctx.lineTo(WW,md+30);ctx.lineTo(0,md+30);ctx.fill();

  // Sand particles
  for(const s of sandParticles){ctx.fillStyle=`rgba(210,180,140,0.7)`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}
  for(const r of rockParticles){ctx.fillStyle=`rgba(120,110,100,0.8)`;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.fill()}

  // ── Biome features ──
  if(biome.feat.includes('coral')){for(let i=0;i<12;i++){const cx=50+i*(WW-100)/11,cy=getFloorY(biome,cx)-2;ctx.fillStyle='rgba(255,140,120,0.5)';ctx.beginPath();ctx.arc(cx,cy,6+Math.sin(i*2)*3,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,180,150,0.4)';ctx.beginPath();ctx.arc(cx-3,cy-3,3,0,TAU);ctx.fill()}}
  if(biome.feat.includes('kelp')){for(let i=0;i<10;i++){const kx=60+i*(WW-120)/9,ky=getFloorY(biome,kx);ctx.strokeStyle='rgba(46,125,50,0.4)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(kx,ky);const t=performance.now()*.001;for(let j=1;j<=10;j++)ctx.lineTo(kx+Math.sin(j*.8+t+kx*.05)*4,ky-j*4);ctx.stroke()}}
  if(biome.feat.includes('vents')){for(let i=0;i<3;i++){const vx=200+i*400,vy=md-2;ctx.fillStyle='rgba(60,40,20,0.7)';ctx.fillRect(vx-3,vy-20,6,22);ctx.fillStyle='rgba(180,100,30,0.1)';for(let j=0;j<6;j++){ctx.beginPath();ctx.arc(vx+Math.sin(time*3+i)*6,vy-20-j*10,5+j*3,0,TAU);ctx.fill()}}}
  if(biome.feat.includes('ice')){for(let i=0;i<5;i++){const ix=80+i*(WW-160)/4;ctx.fillStyle='rgba(200,220,240,0.4)';ctx.fillRect(ix,-3,30+Math.sin(i)*15,5)}}

  // ── Organisms ──
  const sorted=[...organisms].filter(o=>o.alive).sort((a,b)=>a.y-b.y);
  for(const o of sorted)drawOrganism(o,biome);

  // ── Streamlines ──
  if(_showStreams){ctx.globalAlpha=0.25;for(let sx=30;sx<WW-30;sx+=90){for(let sy=10;sy<md-10;sy+=70){ctx.beginPath();ctx.strokeStyle='rgba(120,180,220,0.5)';ctx.lineWidth=0.7;let px=sx,py=sy;ctx.moveTo(px,py);for(let j=0;j<18;j++){const env=envSystem.getAt(px,py,biome);const u=env?env.currentU:0,v=env?env.currentV:0;const mag=Math.sqrt(u*u+v*v)||0.5;px+=u/mag*5;py+=v/mag*5;if(px<0||px>WW||py<0||py>md*.95)break;ctx.lineTo(px,py)}ctx.stroke()}}ctx.globalAlpha=1}

  // ── Grid ──
  if(_showGrid){ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;for(let x=0;x<WW;x+=50){ctx.beginPath();ctx.moveTo(x,skyTop);ctx.lineTo(x,md+30);ctx.stroke()}for(let y=-100;y<md+30;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WW,y);ctx.stroke()}}

  ctx.restore();

  // ── Structure Overlay ──
  if(_layerMode==='structure'){drawStructure(sim);soCanvas.classList.add('on')}else{soCanvas.classList.remove('on');soCtx.clearRect(0,0,W,H)}

  // ── Hover tooltip ──
  if(sim._hoveredOrg){const o=sim._hoveredOrg;const sp=worldToScreen(o.x,o.y);const ratio=o.energy/o.species.ecap;ctx.fillStyle='rgba(8,8,20,0.85)';ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    const tw=Math.max(140,ctx.measureText(o.species.name+' '+o.species.en).width+20);const th=50;const tx=sp.x+16,ty=sp.y-th-10;
    ctx.beginPath();ctx.roundRect(tx,ty,tw,th,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='12px Georgia,serif';ctx.fillText(o.species.name, tx+10, ty+18);
    ctx.fillStyle='rgba(180,200,220,0.7)';ctx.font='italic 9px Georgia,serif';ctx.fillText(o.species.en, tx+10, ty+31);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px Georgia,serif';ctx.fillText(`E:${o.energy.toFixed(0)}/${o.species.ecap}`, tx+10, ty+44);
    // Energy bar
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(tx+10,ty+46,tw-20,3);
    ctx.fillStyle=ratio>0.5?'rgba(100,200,100,0.6)':ratio>0.2?'rgba(200,180,50,0.6)':'rgba(200,80,80,0.6)';ctx.fillRect(tx+10,ty+46,(tw-20)*ratio,3);
  }

  // Highlight ring
  if(sim._hoveredOrg){const o=sim._hoveredOrg;const sp=worldToScreen(o.x,o.y);ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sp.x,sp.y,o.size*sc+4,0,TAU);ctx.stroke()}
}

function drawStructure(sim){const{biome,envSystem,organisms}=sim;const W=window.innerWidth,H=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);soCtx.setTransform(dpr,0,0,dpr,0,0);soCtx.clearRect(0,0,W,H);const sc2=s()*zoom;soCtx.save();soCtx.translate(W/2,H/2);soCtx.scale(sc2,sc2);soCtx.translate(-camX,-camY);const cols=envSystem.cols,rows=envSystem.rows;for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const i=Math.min(r*cols+c,envSystem.grid.length-1);const cell=envSystem.grid[i];if(!cell)continue;const t=clamp((cell.temp-0)/30,0,1);soCtx.fillStyle=`rgba(${Math.floor(255*t)},${Math.floor(100*(1-t))},${Math.floor(255*(1-t))},0.25)`;soCtx.fillRect(c*CFG.envSz,r*CFG.envSz,CFG.envSz+1,CFG.envSz+1)}}for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const i=Math.min(r*cols+c,envSystem.grid.length-1);const cell=envSystem.grid[i];if(!cell||cell.nutrients<0.1)continue;soCtx.fillStyle=`rgba(80,220,80,${cell.nutrients*0.25})`;soCtx.fillRect(c*CFG.envSz,r*CFG.envSz,CFG.envSz+1,CFG.envSz+1)}}soCtx.strokeStyle='rgba(255,255,255,0.2)';soCtx.lineWidth=0.6;for(let r=0;r<rows;r+=3){for(let c=0;c<cols;c+=3){const i=Math.min(r*cols+c,envSystem.grid.length-1);const cell=envSystem.grid[i];if(!cell)continue;const cx2=c*CFG.envSz,cy2=r*CFG.envSz;soCtx.beginPath();soCtx.moveTo(cx2,cy2);soCtx.lineTo(cx2+cell.currentU*2,cy2+cell.currentV*2);soCtx.stroke()}}for(const o of organisms){if(!o.alive)continue;soCtx.strokeStyle='rgba(255,255,255,0.3)';soCtx.lineWidth=0.5;soCtx.beginPath();soCtx.arc(o.x,o.y,o.size,0,TAU);soCtx.stroke();soCtx.fillStyle='rgba(255,255,255,0.4)';soCtx.font='7px monospace';soCtx.fillText(`${o.species.en} E:${o.energy.toFixed(0)}`,o.x+o.size+2,o.y)}soCtx.restore()}

// ═══════════════════════ SIMULATION ═══════════════════════
class Simulation{constructor(){this.envSystem=new EnvSystem(WW,850,CFG.envSz);this.spawner=new Spawner();this.biome=BIOMES['open-ocean'];this.organisms=[];this.paused=false;this.time=0;this._showStreams=false;this._showGrid=false;this._layerMode='manifest';this._pendingO=[];this._hoveredOrg=null;this._inspOrg=null;this._tool='inspect';this._spawnSp=null;this.init()}
init(){this.envSystem.h=this.biome.maxDepth+40;this.envSystem.init(this.biome);this.grid=new SpatialGrid(WW,this.envSystem.h,CFG.cellSz);this.organisms=[];initSeafloor(this.biome);this._seed()}
_seed(){for(const sid of this.biome.species){const sp=SPEC[sid];if(!sp)continue;const bk=(this.biome.baseK&&this.biome.baseK[sid])||50;const n=Math.floor(bk*.4);for(let i=0;i<n;i++)this.spawner.spawnOne(sp,this.biome,this.envSystem,this.organisms)}this._updSchools()}
_updSchools(){const s={};for(const o of this.organisms){if(!o.alive||o.schId===null)continue;const k=o.species.id+'_'+o.schId;if(!s[k])s[k]=[];s[k].push(o)}for(const o of this.organisms)if(o.schId!==null){const k=o.species.id+'_'+o.schId;o._schRef=s[k]||[]}}
transitionTo(bid){const nb=BIOMES[bid];if(!nb||nb===this.biome)return;this.biome=nb;this.envSystem.h=nb.maxDepth+40;this.envSystem.init(nb);initSeafloor(nb);for(const o of this.organisms)if(!nb.species.includes(o.species.id))o.alive=false;document.getElementById('bn').textContent=nb.name;document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('on',b.dataset.b===bid));camY=nb.maxDepth*.4}
spawnOrganism(sid,x,y){const sp=SPEC[sid];if(!sp)return;const o=new Organism(sp,x,y);o.energy=sp.ecap*.8;this.organisms.push(o);return o}
update(dt){if(this.paused)return;dt=Math.min(dt,CFG.maxDt);this.time+=dt;this.envSystem.update(dt,this.biome);const tH=this.biome.maxDepth+40;if(Math.abs(this.envSystem.h-tH)>10){this.envSystem.h=tH;this.envSystem.init(this.biome)}if(!this.grid||this.grid.rows!==Math.ceil(this.envSystem.h/CFG.cellSz))this.grid=new SpatialGrid(WW,this.envSystem.h,CFG.cellSz);else{for(const c of this.grid.cells)c.clear()}for(const o of this.organisms)if(o.alive&&isFinite(o.x)&&isFinite(o.y))this.grid.insert(o);this._pendingO=[];const alive=[];for(const o of this.organisms){if(!o.alive)continue;this._updateOrg(o,dt);if(o.alive)alive.push(o)}for(const c of this._pendingO)if(c.alive)alive.push(c);this._pendingO=null;this._procDeaths();this.spawner.update(dt,alive,this.biome,this.envSystem);if(Math.random()<0.1)this._updSchools();if(alive.length>CFG.maxOrg){alive.sort((a,b)=>a.energy/a.species.ecap-b.energy/b.species.ecap);for(let i=0;i<Math.min(alive.length-CFG.maxOrg,alive.length);i++)alive[i].alive=false}this.organisms=alive.filter(o=>o.alive)}
_updateOrg(o,dt){if(isNaN(o.x)||isNaN(o.y)){o.x=rand(50,WW-50);o.y=rand(10,this.biome.maxDepth-10);o.vx=0;o.vy=0}if(isNaN(o.vx)||isNaN(o.vy)){o.vx=(Math.random()-.5)*2;o.vy=(Math.random()-.5)*2}o.age+=dt;o.hungerT+=dt;o.energy-=CFG.metBase*(1+o.size/50)*dt;const env=this.envSystem.getAt(o.x,o.y,this.biome);if(o.species.env.temp){const[mn,,,mx]=o.species.env.temp;if(env.temp<mn||env.temp>mx)o.energy-=CFG.metBase*(1+o.size/50)*2*dt}const mY=this.envSystem.h;if(o.y<0||isNaN(o.y)){o.y=0;o.vy=Math.abs(o.vy)*.5}if(o.y>mY||isNaN(o.y)){o.y=mY;o.vy=-Math.abs(o.vy)*.5}if(o.x<0||isNaN(o.x))o.x+=WW;if(o.x>WW||isNaN(o.x))o.x-=WW;o.x=clamp(o.x,0,WW);o.y=clamp(o.y,0,mY);const nb=this.grid.nearby(o.x,o.y,Math.max(o.species.sz[1]*6,30));if(o._schRef&&o._schRef.length<30)for(const s of o._schRef)if(s!==o&&s.alive&&!nb.includes(s))nb.push(s);for(const bn of o.species.beh){const bf=BEH[bn];if(bf)bf(o,nb,env,dt)}const dc=PHYS.dragBase+0.8/(o.species.mass+0.08);o.vx-=o.vx*dc*dt;o.vy-=o.vy*dc*dt;if(isNaN(o.vx)||!isFinite(o.vx))o.vx=0;if(isNaN(o.vy)||!isFinite(o.vy))o.vy=0;const ts=o.species.sp*42,spd=Math.sqrt(o.vx*o.vx+o.vy*o.vy);if(spd>ts&&spd>0.001){o.vx=o.vx/spd*ts;o.vy=o.vy/spd*ts}o.x+=isFinite(o.vx)?o.vx*dt:0;o.y+=isFinite(o.vy)?o.vy*dt:0;if(o.energy>o.species.ecap*.6&&o.size<o.species.sz[1])o.size+=0.01*dt;if(o.energy<=0||o.age>o.species.life)o.alive=false;if(o.energy>o.species.ecap*CFG.reproFrac&&Math.random()<o.species.repr*dt*.5)this._repro(o)}
_repro(p){const cost=p.species.ecap*.3;if(p.energy<cost)return;p.energy-=cost;const ox=(Math.random()-.5)*p.size*2,oy=(Math.random()-.5)*p.size*2;const c=new Organism(p.species,p.x+ox,p.y+oy);c.size=p.species.sz[0]*(.7+Math.random()*.3);c.energy=cost*.6;c.gen=p.gen+1;c.schId=p.schId;(this._pendingO||this.organisms).push(c)}
_procDeaths(){for(const o of this.organisms){if(o.alive||o._cons)continue;const env=this.envSystem.getAt(o.x,o.y,this.biome);if(env)env.detritus=Math.min(1,(env.detritus||0)+o.energy*.4/100)}}
handleHover(sx,sy){const w=screenToWorld(sx,sy);const sc2=s()*zoom;let cl=null,cd=20/sc2;for(const o of this.organisms){if(!o.alive)continue;const d=Math.hypot(o.x-w.x,o.y-w.y);if(d<cd&&d<o.size*1.5+4){cd=d;cl=o}}this._hoveredOrg=cl}
handleClick(sx,sy){const w=screenToWorld(sx,sy);
if(this._tool==='inspect'){const sc3=s()*zoom;let cl=null,cd=20/sc3;for(const o of this.organisms){if(!o.alive)continue;const d=Math.hypot(o.x-w.x,o.y-w.y);if(d<cd&&d<o.size*1.5+6){cd=d;cl=o}}this._inspOrg=cl;const insp=document.getElementById('insp');if(cl){const s=cl.species;const r=cl.energy/s.ecap;const st=r<CFG.starveTh?'濒死':r<0.3?'饥饿':r<0.7?'觅食':r>0.9?'饱足':'健康';insp.innerHTML=`<div class="sn">${s.name} <span style="font-size:0.6rem;color:rgba(255,255,255,0.4)">${s.en}</span></div><div class="st">营养级:<b>${s.tl===0?'分解者':'TL'+s.tl}</b> · <b>${{photo:'光合',filter:'滤食',herbivore:'植食',carnivore:'肉食',detritus:'碎屑'}[s.diet]}</b></div><div class="st">能量:<b>${cl.energy.toFixed(0)}/${s.ecap}</b> · 大小:<b>${cl.size.toFixed(0)}</b></div><div class="st">年龄:<b>${cl.age.toFixed(1)}s</b> · 状态:<b>${st}</b></div>`;insp.classList.add('on');let px=sx+20,py=sy-20;if(px+200>window.innerWidth)px=sx-210;if(py+130>window.innerHeight)py=sy-130;insp.style.left=Math.max(10,px)+'px';insp.style.top=Math.max(10,py)+'px'}else{insp.classList.remove('on')}}
else if(this._tool==='sand'){for(let i=0;i<15;i++)sandParticles.push({x:w.x+rand(-15,15),y:getFloorY(this.biome,w.x)+rand(0,10),r:rand(1,4),vx:0});if(sandParticles.length>2000)sandParticles.splice(0,sandParticles.length-2000)}
else if(this._tool==='nutrient'){for(let i=0;i<12;i++){const env=this.envSystem.getAt(w.x+rand(-25,25),w.y+rand(-15,15),this.biome);if(env)env.nutrients=Math.min(1,env.nutrients+0.2)}}
else if(this._tool==='photon'){for(let i=0;i<20;i++){/* photon visual handled by god rays */const env=this.envSystem.getAt(w.x+rand(-20,20),w.y+rand(-5,10),this.biome);if(env)env.light=Math.min(1,env.light+0.3)}}
else if(this._tool==='spawn'&&this._spawnSp){this.spawnOrganism(this._spawnSp,w.x,w.y)}
}}

// ── Setup ──
function setup(){
const sim=new Simulation();window.__sim=sim;

// UI wiring
document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>sim.transitionTo(b.dataset.b));
const tgF=document.getElementById('tgf'),tgG=document.getElementById('tgg');
tgF.onclick=()=>{sim._showStreams=!sim._showStreams;tgF.classList.toggle('on',sim._showStreams)};
tgG.onclick=()=>{sim._showGrid=!sim._showGrid;tgG.classList.toggle('on',sim._showGrid)};

document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb').forEach(bb=>bb.classList.remove('on'));b.classList.add('on');sim._tool=b.dataset.t;const sl=document.getElementById('slist');if(b.dataset.t==='spawn'){buildSpawnList();sl.classList.add('on')}else sl.classList.remove('on')});

const ht=document.getElementById('ht'),hp=document.getElementById('hp');
ht.onclick=()=>{hp.classList.toggle('on');ht.classList.toggle('op',hp.classList.contains('on'))};
window.addEventListener('keydown',e=>{if(e.key==='Escape'){hp.classList.remove('on');ht.classList.remove('op')}});

function buildSpawnList(){const sl=document.getElementById('slist');sl.innerHTML='';for(const [id,sp] of Object.entries(SPEC)){const btn=document.createElement('button');btn.textContent=`${sp.name} (${sp.en}) TL${sp.tl}`;btn.onclick=()=>{sim._spawnSp=id;sl.classList.remove('on');document.getElementById('hint').textContent=`投放:${sp.name} · 点击水域投放`};sl.appendChild(btn)}}

// Interactions
canvas.addEventListener('click',e=>sim.handleClick(e.clientX,e.clientY));
canvas.addEventListener('mousemove',e=>sim.handleHover(e.clientX,e.clientY));

let panning=false,panSX=0,panSY=0;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{if(e.button===2||e.button===1){panning=true;panSX=e.clientX;panSY=e.clientY}});
window.addEventListener('pointermove',e=>{if(!panning)return;const vH=BASE_VH/zoom,vW=vH*(window.innerWidth/window.innerHeight);camX-=(e.clientX-panSX)/window.innerWidth*vW;camY+=(e.clientY-panSY)/window.innerHeight*vH;panSX=e.clientX;panSY=e.clientY;clampCamera(sim.biome)});
window.addEventListener('pointerup',()=>{panning=false});

canvas.addEventListener('wheel',e=>{e.preventDefault();if(e.shiftKey){const vH=BASE_VH/zoom;camX+=e.deltaY*vH*.003;camY+=e.deltaX*vH*.003}else{const w=screenToWorld(e.clientX,e.clientY);const oldZ=zoom;zoom=clamp(zoom-e.deltaY*.005,ZOOM_MIN,ZOOM_MAX);const f=1-oldZ/zoom;camX+=(w.x-camX)*f;camY+=(w.y-camY)*f}clampCamera(sim.biome)},{passive:false});

window.addEventListener('keydown',e=>{const bk={'1':'coral','2':'open-ocean','3':'deep-sea','4':'kelp-forest','5':'hydrothermal','6':'polar'};if(bk[e.key])sim.transitionTo(bk[e.key]);if(e.key===' '){e.preventDefault();sim.paused=!sim.paused}if(e.key==='r'||e.key==='R')sim.init();if(e.key==='f'||e.key==='F'){sim._showStreams=!sim._showStreams;tgF.classList.toggle('on',sim._showStreams)}if(e.key==='g'||e.key==='G'){sim._showGrid=!sim._showGrid;tgG.classList.toggle('on',sim._showGrid)}if(e.key==='l'||e.key==='L'){sim._layerMode=sim._layerMode==='manifest'?'structure':'manifest';document.getElementById('li').classList.toggle('on',sim._layerMode==='structure');document.getElementById('llbl').textContent=sim._layerMode==='structure'?'结构':'表象';document.getElementById('ldot').style.background=sim._layerMode==='structure'?'#ffb464':'#aaccff'}if(e.key==='q'||e.key==='Q'){sim._tool='sand';document.querySelectorAll('.tb').forEach(bb=>bb.classList.remove('on'));document.querySelector('[data-t="sand"]').classList.add('on');document.getElementById('slist').classList.remove('on')}if(e.key==='w'||e.key==='W'){sim._tool='nutrient';document.querySelectorAll('.tb').forEach(bb=>bb.classList.remove('on'));document.querySelector('[data-t="nutrient"]').classList.add('on');document.getElementById('slist').classList.remove('on')}if(e.key==='e'||e.key==='E'){sim._tool='photon';document.querySelectorAll('.tb').forEach(bb=>bb.classList.remove('on'));document.querySelector('[data-t="photon"]').classList.add('on');document.getElementById('slist').classList.remove('on')}if(e.key==='a'||e.key==='A'){sim._tool='spawn';document.querySelectorAll('.tb').forEach(bb=>bb.classList.remove('on'));document.querySelector('[data-t="spawn"]').classList.add('on');buildSpawnList();document.getElementById('slist').classList.add('on')}if(e.key==='?'||e.key==='/'){hp.classList.toggle('on');ht.classList.toggle('op',hp.classList.contains('on'))}});

// Info panel
let fc=0,lt=performance.now();
setInterval(()=>{const n=performance.now(),fps=Math.round(fc/((n-lt)/1000));fc=0;lt=n;let alive=0,totE=0;for(const o of sim.organisms){if(!o.alive)continue;alive++;totE+=o.energy}document.getElementById('info').innerHTML=`FPS ${fps}<br>生物 ${alive}<br>能量 ${Math.round(totE)}<br>表温 ${sim.envSystem.surfTemp().toFixed(1)}°C<br>${sim.envSystem.lightI>0.5?'☀️ 昼':'🌙 夜'} ${(sim.envSystem.avgNut()*100).toFixed(0)}%`},500);

// Loop
let lt2=performance.now();
function loop(now){try{const dt=Math.min((now-lt2)/1000,CFG.maxDt);lt2=now;sim.update(dt);render(sim);fc++}catch(e){console.error(e)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);

console.log('%c🌊 OCEANUS · 大洋之息 %cCanvas 2D','font-size:1.2em;color:#4fc3f7;','color:#aaa;');
console.log('%c13物种 · 6群系 · 几何生物 · 动态海底 · 双层空间','color:#888;');
}
setup();
</script>
