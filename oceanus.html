<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════
//  OCEANUS · 大洋之息 (Three.js 2D)
// ═══════════════════════════════════════

// ── CONFIG ──
const CFG={
  maxOrg:2500, minPop:3, energyEff:0.15, digestEff:0.75,
  cellSz:60, envSz:40, dayLen:90, upwellInt:45, spawnInt:2,
  metBase:0.015, starveTh:0.08, reproFrac:0.7, detSink:8, nutRegen:0.03,
  maxDt:0.1, worldW:2000,
};
const PI=Math.PI,TAU=2*PI;
function clamp(v,l,h){return v<l?l:v>h?h:v}
function lerp(a,b,t){return a+(b-a)*t}
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function angleTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function rgba(r,g,b,a){return`rgba(${r|0},${g|0},${b|0},${a})`}

// Simple noise
function hash2(x,y){let h=(x*374761393+y*668265263+1274126177)|0;h=((h>>16)^h)*0x45d9f3b;h=((h>>16)^h)*0x45d9f3b;return((h>>16)^h)/2147483648}
function noise2D(x,y){const ix=Math.floor(x),iy=Math.floor(y);const fx=x-ix,fy=y-iy;const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),sx),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),sx),sy)}

// ── SPATIAL GRID ──
class SpatialGrid{
  constructor(w,h,cs){this.cs=cs;this.cols=Math.ceil(w/cs);this.rows=Math.ceil(h/cs);this.cells=new Array(this.cols*this.rows);for(let i=0;i<this.cells.length;i++)this.cells[i]=new Set()}
  clear(){for(const c of this.cells)c.clear()}
  idx(x,y){const col=Math.max(0,Math.min(this.cols-1,Math.floor(x/this.cs)));const row=Math.max(0,Math.min(this.rows-1,Math.floor(y/this.cs)));return Math.max(0,Math.min(this.cells.length-1,row*this.cols+col))}
  insert(o){const i=this.idx(o.x,o.y);if(i<this.cells.length&&this.cells[i])this.cells[i].add(o)}
  nearby(x,y,r){const out=[];if(!this.cells.length)return out;const mnC=Math.max(0,Math.floor((x-r)/this.cs)),mxC=Math.min(this.cols-1,Math.floor((x+r)/this.cs));const mnR=Math.max(0,Math.floor((y-r)/this.cs)),mxR=Math.min(this.rows-1,Math.floor((y+r)/this.cs));for(let ri=mnR;ri<=mxR;ri++)for(let ci=mnC;ci<=mxC;ci++){const idx=ri*this.cols+ci;if(idx>=0&&idx<this.cells.length&&this.cells[idx])for(const o of this.cells[idx])out.push(o)}return out}
}

// ── ENVIRONMENT ──
class EnvCell{constructor(){this.temp=20;this.light=1;this.nutrients=0.5;this.oxygen=0.6;this.detritus=0;this.currentU=0;this.currentV=0}}
class EnvSystem{
  constructor(w,h,cs){this.w=w;this.h=h;this.cs=cs;this.cols=Math.ceil(w/cs);this.rows=Math.ceil(h/cs);this.grid=[];this.time=0;this.dayPhase=0;this.lightI=1;this.upwellT=0}
  init(biome){this.cols=Math.max(1,Math.ceil(this.w/this.cs));this.rows=Math.max(1,Math.ceil(this.h/this.cs));this.grid=[];for(let r=0;r<this.rows;r++){for(let c=0;c<this.cols;c++){const cell=new EnvCell();const df=r/Math.max(1,this.rows-1);const d=df*biome.maxDepth;cell.temp=biome.tempProfile(d);cell.light=Math.exp(-biome.lightAttenuation*d);cell.nutrients=biome.nutrientProfile(d);cell.oxygen=biome.oxygenProfile(d);this.grid.push(cell)}}}
  getAt(wx,wy,biome){if(!this.grid.length||this.h<=0)return this.getAtD(clamp(wy/biome.maxDepth,0,1),biome);const col=Math.max(0,Math.min(this.cols-1,Math.floor(wx/this.cs)));const row=Math.max(0,Math.min(this.rows-1,Math.floor(wy/this.cs)));const i=row*this.cols+col;if(i>=0&&i<this.grid.length)return this.grid[i];return this.getAtD(clamp(wy/biome.maxDepth,0,1),biome)}
  getAtD(df,biome){const d=df*biome.maxDepth;const c=new EnvCell();c.temp=biome.tempProfile(d);c.light=Math.exp(-biome.lightAttenuation*d);c.nutrients=biome.nutrientProfile(d);c.oxygen=biome.oxygenProfile(d);return c}
  update(dt,biome){this.time+=dt;this.dayPhase=(this.time%CFG.dayLen)/CFG.dayLen;this.lightI=0.5+0.5*Math.sin(this.dayPhase*TAU-PI/2);
    for(let r=0;r<this.rows;r++){const df=r/Math.max(1,this.rows-1);const d=df*biome.maxDepth;
      for(let c=0;c<this.cols;c++){const i=r*this.cols+c,cell=this.grid[i];
        cell.temp=lerp(cell.temp,biome.tempProfile(d),0.02);
        cell.light=Math.exp(-biome.lightAttenuation*d)*this.lightI;
        cell.currentU=noise2D(c*this.cs/100+r*this.cs/100,this.time*0.3)*25;
        cell.currentV=noise2D(c*this.cs/100+100,r*this.cs/100+this.time*0.2)*8-3;
        cell.nutrients=lerp(cell.nutrients,biome.nutrientProfile(d),0.005);
        if(cell.detritus>0){const dr=CFG.nutRegen*(1+cell.temp/30);const dec=Math.min(cell.detritus,dr*dt);cell.detritus-=dec;cell.nutrients=Math.min(1,cell.nutrients+dec*0.5)}
        cell.oxygen=lerp(cell.oxygen,biome.oxygenProfile(d),0.01);
      }}
    for(let r=this.rows-1;r>0;r--)for(let c=0;c<this.cols;c++){const f=this.grid[r*this.cols+c],t=this.grid[(r+1)*this.cols+c];if(t&&f.detritus>0){const s=Math.min(f.detritus,CFG.detSink*dt);f.detritus-=s;t.detritus+=s}}
    this.upwellT-=dt;if(this.upwellT<=0){this.upwellT=CFG.upwellInt+rand(-10,10);for(let i=0;i<3;i++){const cx=Math.floor(Math.random()*this.cols);for(let r=Math.floor(this.rows*0.6);r<this.rows;r++){const idx=r*this.cols+cx;if(this.grid[idx].nutrients>0.3&&r>this.rows*0.3){const si=Math.floor(this.rows*0.1)*this.cols+cx;this.grid[si].nutrients=Math.min(1,this.grid[si].nutrients+this.grid[idx].nutrients*0.15);this.grid[idx].nutrients*=0.85}}}}}
  avgNut(){let s=0;for(const c of this.grid)s+=c.nutrients;return s/this.grid.length}
  surfTemp(){if(!this.grid.length)return 20;let s=0;for(let c=0;c<this.cols;c++)s+=this.grid[c].temp;return s/this.cols}
}

// ── SPECIES ──
class SpeciesDef{constructor(c){Object.assign(this,c)}}
const SPEC={};
function defSp(c){SPEC[c.id]=new SpeciesDef(c)}
defSp({id:'phytoplankton',name:'浮游植物',nameEn:'Phytoplankton',tl:1,sz:[2,5],sp:1.0,ecap:30,repr:0.08,life:45,diet:'photosynthesis',prey:[],env:{temp:[0,15,30,40],light:[0.05,1],depth:[0,200]},beh:['wander','photosyn'],sch:0,mass:0.1,color:[76,175,80]});

defSp({id:'seaweed',name:'海藻/海带',nameEn:'Seaweed',tl:1,sz:[30,90],sp:0,ecap:200,repr:0.01,life:120,diet:'photosynthesis',prey:[],env:{temp:[2,8,20,28],light:[0.1,1],depth:[0,50]},beh:['rooted','sway','photosyn'],sch:0,mass:5,color:[56,142,60]});
defSp({id:'zooplankton',name:'浮游动物',nameEn:'Zooplankton',tl:2,sz:[3,7],sp:2.5,ecap:40,repr:0.06,life:35,diet:'filter',prey:['phytoplankton','cyanobacteria'],env:{temp:[2,10,28,35],light:[0.01,1],depth:[0,600]},beh:['wander','filter'],sch:30,mass:0.2,color:[255,183,178]});

defSp({id:'smallFish',name:'小型鱼',nameEn:'Small Fish',tl:3,sz:[8,18],sp:8,ecap:65,repr:0.04,life:55,diet:'herbivore',prey:['zooplankton','krill'],env:{temp:[10,18,30,36],light:[0.02,1],depth:[0,200]},beh:['wander','school','flee'],sch:40,mass:0.5,color:[120,160,200]});

// ── BIOMES ──
class BiomeDef{constructor(c){Object.assign(this,c)}}
const BIOMES={};
function defBiome(c){BIOMES[c.id]=new BiomeDef(c)}
defBiome({id:'coral',name:'珊瑚礁',maxDepth:60,lightAttenuation:0.03,tempProfile:d=>24+Math.sin(d/20)*2,nutrientProfile:d=>0.3+d/60*0.2,oxygenProfile:d=>0.8-d/60*0.2,species:['phytoplankton','cyanobacteria','zooplankton','smallFish','mediumFish','jellyfish','largeFish','bottomFeeder','bacteria'],waterColor:[30,140,180],deepColor:[10,40,70],surfaceColor:[100,200,240],substrateColor:[240,210,160],baseCarryingCapacity:{phytoplankton:500,cyanobacteria:200,zooplankton:250,smallFish:120,mediumFish:35,jellyfish:15,largeFish:5,bottomFeeder:15,bacteria:100},features:['coral']});

// ── PHYSICS ──
const PHYS={steerCoeff:20,desiredSpd:8,dragBase:0.45,moveCost:1e-7};
function steerToward(org,dx,dy,fm,dt){
  const m=org.species.mass;let fx=(dx-org.vx)*PHYS.steerCoeff*fm,fy=(dy-org.vy)*PHYS.steerCoeff*fm;
  const mf=org.species.sp*m*50*fm;const fmag=Math.sqrt(fx*fx+fy*fy);if(fmag>mf&&fmag>0.001){fx=fx/fmag*mf;fy=fy/fmag*mf}
  org.vx+=fx/m*dt;org.vy+=fy/m*dt;const s2=org.vx*org.vx+org.vy*org.vy;org.energy-=m*s2*PHYS.moveCost*dt}

const BEH={
  wander(o,n,env,dt){if(o.hungerT>8||o._flee)return;if(o.energy<o.species.ecap*0.1)return;if(o._wa===undefined)o._wa=Math.random()*TAU;o._wa+=(Math.random()-0.5)*1.5*dt;if(o._wa>TAU)o._wa-=TAU;if(o._wa<0)o._wa+=TAU;const ps=o.species.sp*PHYS.desiredSpd;o.x+=env.currentU*1.5*dt;o.y+=env.currentV*1.5*dt;steerToward(o,Math.cos(o._wa)*ps,Math.sin(o._wa)*ps*0.5,0.6,dt);if(o.species.tl===1&&env.light>0.03&&o.y>30)o.vy-=1.5*dt},
  photosyn(o,n,env,dt){if(env.light>0.02&&env.nutrients>0.05){const g=env.light*env.nutrients*60*dt;o.energy=Math.min(o.species.ecap,o.energy+g)}},
  filter(o,n,env,dt){for(const t of n){if(t===o||!t.alive)continue;if(o.species.prey.includes(t.species.id)){const d=dist(o,t);if(d<o.size+t.size){o.energy=Math.min(o.species.ecap,o.energy+t.energy*CFG.digestEff);t.alive=false;o.hungerT=0}}}if(env.detritus>0.01){o.energy=Math.min(o.species.ecap,o.energy+env.detritus*25*dt)}},
  school(o,n,dt){if(!o.schId)return;const same=n.filter(x=>x!==o&&x.alive&&x.schId===o.schId);if(!same.length)return;let sx=0,sy=0,ax=0,ay=0,cx=0,cy=0;const sr=o.species.sz[1]*1.5,cr=o.species.sz[1]*6;for(const x of same){const d=dist(o,x);if(d>0&&d<sr){const s=(sr-d)/sr;sx+=(o.x-x.x)/d*s;sy+=(o.y-x.y)/d*s}ax+=x.vx;ay+=x.vy;if(d<cr&&d>0){cx+=x.x-o.x;cy+=x.y-o.y}}const nn=same.length,f=8*dt;o.vx+=sx*f*.6+ax/nn*f*.3+cx/nn*f*.2;o.vy+=sy*f*.6+ay/nn*f*.3+cy/nn*f*.2},
  hunt(o,n,dt){if(o.hungerT<3&&o.energy>o.species.ecap*0.3)return;if(o.target&&(!o.target.alive||dist(o,o.target)>o.size*10))o.target=null;if(!o.target){let cl=null,cd=o.size*7;for(const t of n){if(t===o||!t.alive)continue;if(!o.species.prey.includes(t.species.id))continue;const d=dist(o,t);if(d<cd){cd=d;cl=t}}o.target=cl}if(o.target){const d=dist(o,o.target),a=angleTo(o,o.target),hb=1+Math.min(o.hungerT/12,1.5),ps=o.species.sp*PHYS.desiredSpd*1.5*hb;steerToward(o,Math.cos(a)*ps,Math.sin(a)*ps,1.5,dt);if(d<o.size*.7+o.target.size*.7){const eg=o.target.energy*CFG.digestEff,ag=eg*Math.pow(CFG.energyEff,Math.max(1,o.species.tl-o.target.species.tl));o.energy=Math.min(o.species.ecap,o.energy+ag);o.target.alive=false;o.hungerT=0;o.target=null}}},
  flee(o,n,dt){o._flee=false;let st=0,fa=0;for(const t of n){if(t===o||!t.alive)continue;if(t.species.tl>o.species.tl){const d=dist(o,t),tr=t.size*5;if(d<tr&&d>0){const th=(tr-d)/tr;if(th>st){st=th;fa=angleTo(t,o)}}}}if(st>0.05){o._flee=true;const fs=o.species.sp*PHYS.desiredSpd*1.8*st,ea=fa+(Math.random()-.5)*PI*.6;steerToward(o,Math.cos(ea)*fs,Math.sin(ea)*fs,2,dt)}},
  rooted(o,n,env,dt){o.vx*=.1;if(!o._ry)o._ry=o.y;o.vy+=(o._ry-o.y)*.5*dt},

};

// ── ORGANISM ──
class Organism{
  constructor(sp,x,y){this.species=sp;this.x=x;this.y=y;this.vx=(Math.random()-.5)*sp.sp*30;this.vy=(Math.random()-.5)*sp.sp*20;this.energy=sp.ecap*(.55+Math.random()*.4);this.age=0;this.size=sp.sz[0]+Math.random()*(sp.sz[1]-sp.sz[0]);this.alive=true;this.schId=sp.sch>0?Math.floor(Math.random()*1000):null;this.target=null;this.hungerT=0;this.gen=0;this._ry=y;this._pa=null;this._bt=null;this._cons=false;this._schRef=null;this._wa=undefined;this._flee=false}
}

// ── SPAWNER ──
class Spawner{
  constructor(){this.st=0}
  suit(sp,env,d){const te=sp.env;let tf=0;if(te.temp){const[mn,ol,oh,mx]=te.temp,t=env.temp;tf=t>=ol&&t<=oh?1:t>=mn&&t<ol?(t-mn)/(ol-mn):t>oh&&t<=mx?(mx-t)/(mx-oh):0}let lf=0;if(te.light)lf=env.light>=te.light[0]&&env.light<=te.light[1]?1:0;let df=0;if(te.depth)df=d>=te.depth[0]&&d<=te.depth[1]?1:0;return tf*lf*df}
  K(sp,biome,es){const bk=(biome.baseCarryingCapacity&&biome.baseCarryingCapacity[sp.id])||50;let ts=0;for(let i=0;i<15;i++){const df=i/14,env=es.getAtD(df,biome);ts+=this.suit(sp,env,df*biome.maxDepth)}const as=ts/15;let k=Math.round(bk*(.2+.8*as));if(sp.tl===1)k=Math.round(k*(.4+.6*es.avgNut()));return Math.max(CFG.minPop+2,k)}
  update(dt,orgs,biome,es){this.st-=dt;if(this.st>0)return;this.st=CFG.spawnInt;const cnts={};for(const o of orgs){if(!o.alive)continue;cnts[o.species.id]=(cnts[o.species.id]||0)+1}for(const sid of biome.species){const sp=SPEC[sid];if(!sp)continue;const cp=cnts[sid]||0,k=this.K(sp,biome,es);let sc=0;if(cp<k*.7&&orgs.length<CFG.maxOrg)sc=Math.ceil((k-cp)/k*sp.repr*k*.5);if(cp<CFG.minPop&&cp>0)sc=Math.max(sc,CFG.minPop*3-cp);if(cp===0&&sp.tl===1)sc=Math.max(sc,Math.floor(k*.1));for(let i=0;i<Math.min(sc,30);i++)this.spawnOne(sp,biome,es,orgs)}}
  spawnOne(sp,biome,es,orgs){let x,y,env,att=0;do{x=rand(20,CFG.worldW-20);let df;if(sp.beh&&sp.beh.includes('rooted'))df=.85+Math.random()*.15;else df=Math.random();y=df*es.h;env=es.getAt(x,y,biome);if(this.suit(sp,env,df*biome.maxDepth)>.3||att++>15)break}while(true);const o=new Organism(sp,x,y);orgs.push(o);return o}
}

  },
  vertexShader:`varying vec2 vUv;varying float vWorldY;void main(){vec4 wp=modelMatrix*vec4(position,1.);vWorldY=wp.y;vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying float vWorldY;uniform float uMaxDepth,uAtt,uLight;uniform vec3 uSurf,uDeep;void main(){float d=-vWorldY;float t=clamp(d/uMaxDepth,0.,1.);float l=exp(-uAtt*d)*uLight;vec3 col=mix(uSurf,uDeep,t);col*=(0.2+0.8*l);float a=0.35+t*0.55;gl_FragColor=vec4(col,a);}`,

  uniforms:{uRayX:{value:0},uRayD:{value:500},uRayW:{value:30},uLight:{value:1},uTime:{value:0}},
  vertexShader:`varying vec2 vUv;varying vec2 vPos;void main(){vec4 wp=modelMatrix*vec4(position,1.);vPos=wp.xy;vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec2 vPos;uniform float uRayX,uRayD,uRayW,uLight,uTime;void main(){float dist=abs(vPos.x-uRayX);float t=clamp(-vPos.y/uRayD,0.,1.);float alpha=(1.-dist/(uRayW*(1.+t*2.)))*exp(-t*2.5)*uLight*0.07;alpha=clamp(alpha,0.,1.);float w=1.-t;gl_FragColor=vec4(vec3(1.,0.98,0.85)*w+vec3(0.5,0.8,1.)*t,alpha);}`,

// Pre-create ray meshes
const rayMeshes=[];
for(let i=0;i<9;i++){
  const geo=new THREE.PlaneGeometry(600,2000);
  const mat=rayMatTemplate.clone();
  const mesh=new THREE.Mesh(geo,mat);
  mesh.visible=false;
  rayGroup.add(mesh);
  rayMeshes.push({mesh,mat});
}

function createGlowTex(size,inner,outer){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d');const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,inner);g.addColorStop(0.2,inner);g.addColorStop(0.5,outer);g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  const tex=new THREE.CanvasTexture(c);tex.needsUpdate=true;return tex;
}

// ── Organism sprites ──
const orgTextures={};
function getOrgTex(color){
  const key=color.join(',');
  if(orgTextures[key])return orgTextures[key];
  const c=document.createElement('canvas');c.width=c.height=32;
  const ctx=c.getContext('2d');const g=ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,`rgba(${color[0]},${color[1]},${color[2]},0.9)`);
  g.addColorStop(0.5,`rgba(${color[0]},${color[1]},${color[2]},0.5)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,32,32);
  const tex=new THREE.CanvasTexture(c);tex.needsUpdate=true;
  orgTextures[key]=tex;return tex;
}
const orgSprites=[];

// ── Photon sprites ──
const photonTex=createGlowTex(64,'#ffffff','#ffff88');
const photonGroup=new THREE.Group();scene.add(photonGroup);

// ── Streamline group ──
const streamlineGroup=new THREE.Group();scene.add(streamlineGroup);

// ── Seafloor line ──
const floorGeo=new THREE.PlaneGeometry(CFG.worldW,30);
const floorMat=new THREE.MeshBasicMaterial({color:0x3a2a1a,transparent:true,opacity:0.8});
const floorPlane=new THREE.Mesh(floorGeo,floorMat);
floorPlane.position.set(CFG.worldW/2,4000,0);
scene.add(floorPlane);

// ── Update rendering from simulation state ──
function updateRender(sim){
  const {organisms,biome,envSystem,time,zoom,camX,camY}=sim;
  const W=window.innerWidth, H=window.innerHeight;
  const viewH=700/zoom;const viewW=viewH*(W/H);
  const cx=camX!==null?camX:CFG.worldW/2;
  const cy=camY!==null?camY:viewH*0.35;

  // Camera
  camera.left=viewW/-2;camera.right=viewW/2;
  camera.top=viewH/2;camera.bottom=viewH/-2;
  camera.position.set(cx,-cy,10);
  camera.lookAt(cx,-cy,0);
  camera.updateProjectionMatrix();

  // Water shader
  waterMat.uniforms.uMaxDepth.value=biome.maxDepth;
  waterMat.uniforms.uSurf.value.setRGB(biome.waterColor[0]/255,biome.waterColor[1]/255,biome.waterColor[2]/255);
  waterMat.uniforms.uDeep.value.setRGB(biome.deepColor[0]/255,biome.deepColor[1]/255,biome.deepColor[2]/255);
  waterMat.uniforms.uAtt.value=biome.lightAttenuation;
  waterMat.uniforms.uLight.value=envSystem.lightI;
  waterMat.uniforms.uTime.value=time;
  waterPlane.position.y=-biome.maxDepth/2;
  waterPlane.scale.y=biome.maxDepth/4000;
  waterPlane.renderOrder=0;
  skyPlane.renderOrder=0;
  floorPlane.renderOrder=1;
  rayGroup.children.forEach(c=>c.renderOrder=2);
  sunSprite.renderOrder=3;

  // Sky
  skyMat.uniforms.uLight.value=envSystem.lightI;
  skyMat.uniforms.uTime.value=time;

  // Sun
  const dayP=envSystem.dayPhase;
  sunSprite.position.x=CFG.worldW/2+Math.cos(dayP*TAU)*CFG.worldW*0.3;
  sunSprite.position.y=-40+Math.sin(dayP*TAU-PI/2)*30;
  sunSprite.material.opacity=0.3+envSystem.lightI*0.6;

  // Seafloor (at negative Y since depth goes downward in Three.js)
  floorPlane.position.y=-biome.maxDepth;
  floorMat.color.setRGB(biome.substrateColor[0]/255,biome.substrateColor[1]/255,biome.substrateColor[2]/255);

  // God rays
  const sunX=sunSprite.position.x;
  for(let i=0;i<rayMeshes.length;i++){
    const {mesh,mat}=rayMeshes[i];
    const spread=(i-rayMeshes.length/2)/(rayMeshes.length/2);
    const rx=sunX+spread*CFG.worldW*0.3;
    const rd=biome.maxDepth*(0.5-Math.abs(spread)*0.2);
    const rw=25+Math.abs(spread)*10;
    mat.uniforms.uRayX.value=rx;
    mat.uniforms.uRayD.value=rd;
    mat.uniforms.uRayW.value=rw;
    mat.uniforms.uLight.value=envSystem.lightI;
    mat.uniforms.uTime.value=time;
    mesh.position.set(rx,-rd/2,0);
    mesh.scale.set(1,rd/2000,1);
    mesh.visible=envSystem.lightI>0.05;
  }

  // ── Organism sprites ──
  // Remove old
  while(orgSprites.length>0){const s=orgSprites.pop();scene.remove(s);s.material.map&&s.material.map!==photonTex&&s.material.map.dispose();s.material.dispose()}
  // Create new sprites for alive organisms
  for(const org of organisms){
    if(!org.alive)continue;
    const tex=getOrgTex(org.species.color);
    const mat=new THREE.SpriteMaterial({map:tex,blending:THREE.NormalBlending,depthWrite:false,transparent:true,opacity:0.8});
    const sprite=new THREE.Sprite(mat);
    const s=org.size*0.8;
    sprite.scale.set(s,s,1);
    sprite.position.set(org.x,-org.y,0);
    sprite.renderOrder=10;
    sprite.userData={org};
    scene.add(sprite);
    orgSprites.push(sprite);
  }

  // ── Photon rendering ──
  while(photonGroup.children.length>0)photonGroup.remove(photonGroup.children[0]);
  if(sim.particles){
    for(const p of sim.particles.photons){
      const mat=new THREE.SpriteMaterial({map:photonTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:p.intensity*p.opacity*0.7});
      const sp=new THREE.Sprite(mat);
      sp.scale.set(p.baseSize*4,p.baseSize*4,1);
      sp.position.set(p.x,-p.y,0);
      sp.renderOrder=20;
      photonGroup.add(sp);
    }
  }

  // ── Streamlines ──
  while(streamlineGroup.children.length>0)streamlineGroup.remove(streamlineGroup.children[0]);
  if(sim._showStreams){
    const mat2=new THREE.LineBasicMaterial({color:0x66aacc,transparent:true,opacity:0.35,depthTest:false,depthWrite:false});
    const spX=90,spY=80;
    for(let sx=10;sx<CFG.worldW-10;sx+=spX){
      for(let sy=5;sy<biome.maxDepth-5;sy+=spY){
        const pts=[];let px=sx,py=sy;
        for(let j=0;j<20;j++){
          const env=envSystem.getAt(px,py,biome);
          const u=env?env.currentU:0,v=env?env.currentV:0;
          const mag=Math.sqrt(u*u+v*v)||0.5;px+=u/mag*6;py+=v/mag*6;
          if(px<0||px>CFG.worldW||py<0||py>biome.maxDepth*0.95)break;
          pts.push(new THREE.Vector3(px,-py,0));
        }
        if(pts.length>2){const geo=new THREE.BufferGeometry().setFromPoints(pts);streamlineGroup.add(new THREE.Line(geo,mat2))}
      }
    }
  }

  renderer.render(scene,camera);
}

// ── Click handling (raycaster on plane at z=0) ──
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const clickPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);

function getWorldFromClick(e){
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const target=new THREE.Vector3();
  raycaster.ray.intersectPlane(clickPlane,target);
  return target?{x:target.x,y:-target.y}:null;
}

// ═══════════════════════════════════════
// SIMULATION
// ═══════════════════════════════════════
class Simulation{
  constructor(){
    this.envSystem=new EnvSystem(CFG.worldW,800,CFG.envSz);
    this.spawner=new Spawner();
    this.biome=BIOMES['open-ocean'];
    this.organisms=[];
    this.particles=new (class{
      constructor(){this.photons=[];this.nutrients=[];this.detritus=[];this.pt=0}
      update(dt,w,h,biome,es,time){
        this.pt-=dt;const li=es.lightI;
        if(this.pt<=0&&li>0.05){this.pt=0.02/Math.max(0.05,li);const n=Math.floor(li*15)+3;for(let i=0;i<n;i++)this.photons.push({x:rand(30,w-30),y:-rand(3,15),intensity:li*(.6+Math.random()*.4),alive:true,baseSize:3+Math.random()*6,vy:18+Math.random()*35,vx:(Math.random()-.5)*20,opacity:.6+Math.random()*.4,age:0})}
        for(const p of this.photons){p.y+=p.vy*dt;p.x+=p.vx*dt;p.intensity*=(1-biome.lightAttenuation*2.5*dt);p.opacity*=(1-biome.lightAttenuation*1.5*dt);p.age+=dt;p.vx+=(Math.random()-.5)*12*dt;if(p.y>h*.9||p.intensity<0.015)p.alive=false}
        this.photons=this.photons.filter(p=>p.alive)
      }
      addDetritus(x,y,e){this.detritus.push({x,y,energy:e,alive:true,size:1.5+Math.random()*3,vy:rand(3,15),vx:(Math.random()-.5)*4,opacity:.4+Math.random()*.3})}
    })();
    this.paused=false;this.time=0;this.zoom=2.0;this.camX=null;this.camY=null;
    this._showStreams=true;this.init();
  }
  init(){
    const aspectH=window.innerHeight/(window.innerWidth/CFG.worldW);
    this.envSystem.h=Math.max(this.biome.maxDepth,isFinite(aspectH)?aspectH:this.biome.maxDepth);
    this.envSystem.init(this.biome);
    this.grid=new SpatialGrid(CFG.worldW,this.envSystem.h,CFG.cellSz);
    this.organisms=[];this._seed();this._pendingO=[];
  }
  _seed(){for(const sid of this.biome.species){const sp=SPEC[sid];if(!sp)continue;const bk=(this.biome.baseCarryingCapacity&&this.biome.baseCarryingCapacity[sid])||50;const n=Math.floor(bk*.5);for(let i=0;i<n;i++)this.spawner.spawnOne(sp,this.biome,this.envSystem,this.organisms)}this._updSchools()}
  _updSchools(){const s={};for(const o of this.organisms){if(!o.alive||o.schId===null)continue;const k=o.species.id+'_'+o.schId;if(!s[k])s[k]=[];s[k].push(o)}for(const o of this.organisms)if(o.schId!==null){const k=o.species.id+'_'+o.schId;o._schRef=s[k]||[]}}
  transitionTo(bid){
    const nb=BIOMES[bid];if(!nb||nb===this.biome)return;
    this.biome=nb;this.zoom={coral:1.2,'open-ocean':2,'deep-sea':1.5,'kelp-forest':1.5,hydrothermal:1.2,polar:1.8}[bid]||1.5;
    const aH=window.innerHeight/(window.innerWidth/CFG.worldW);
    this.envSystem.h=Math.max(nb.maxDepth,isFinite(aH)?aH:nb.maxDepth);
    this.envSystem.init(nb);
    for(const o of this.organisms)if(!nb.species.includes(o.species.id))o.alive=false;
    document.getElementById('bname').textContent=nb.name;
    document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('on',b.dataset.b===bid));
  }
  update(dt){
    if(this.paused)return;dt=Math.min(dt,CFG.maxDt);this.time+=dt;
    this.envSystem.update(dt,this.biome);
    const tH=Math.max(this.biome.maxDepth,window.innerHeight/(window.innerWidth/CFG.worldW));
    if(Math.abs(this.envSystem.h-tH)>10){this.envSystem.h=tH;this.envSystem.init(this.biome)}
    this.grid=new SpatialGrid(CFG.worldW,this.envSystem.h,CFG.cellSz);
    for(const o of this.organisms)if(o.alive&&isFinite(o.x)&&isFinite(o.y))this.grid.insert(o);
    this._pendingO=[];const alive=[];
    for(const o of this.organisms){if(!o.alive)continue;this._updateOrg(o,dt);if(o.alive)alive.push(o)}
    for(const c of this._pendingO)if(c.alive)alive.push(c);this._pendingO=null;
    this._procDeaths();
    this.spawner.update(dt,alive,this.biome,this.envSystem);
    if(Math.random()<0.1)this._updSchools();
    if(alive.length>CFG.maxOrg){alive.sort((a,b)=>a.energy/a.species.ecap-b.energy/b.species.ecap);for(let i=0;i<Math.min(alive.length-CFG.maxOrg,alive.length);i++)alive[i].alive=false}
    this.organisms=alive.filter(o=>o.alive);
    this.particles.update(dt,CFG.worldW,this.envSystem.h,this.biome,this.envSystem,this.time);
  }
  _updateOrg(o,dt){
    o.age+=dt;o.hungerT+=dt;o.energy-=CFG.metBase*(1+o.size/50)*dt;
    const env=this.envSystem.getAt(o.x,o.y,this.biome);
    if(o.species.env.temp){const[mn,,,mx]=o.species.env.temp;if(env.temp<mn||env.temp>mx)o.energy-=CFG.metBase*(1+o.size/50)*2*dt}
    const mY=Math.max(this.envSystem.h,this.biome.maxDepth);
    if(o.y<0||isNaN(o.y)){o.y=0;o.vy=Math.abs(o.vy)*.5}if(o.y>mY||isNaN(o.y)){o.y=mY;o.vy=-Math.abs(o.vy)*.5}
    if(o.x<0||isNaN(o.x))o.x+=CFG.worldW;if(o.x>CFG.worldW||isNaN(o.x))o.x-=CFG.worldW;
    o.x=clamp(o.x,0,CFG.worldW);o.y=clamp(o.y,0,mY);
    const nb=this.grid.nearby(o.x,o.y,Math.max(o.species.sz[1]*6,30));
    if(o._schRef&&o._schRef.length<30)for(const s of o._schRef)if(s!==o&&s.alive&&!nb.includes(s))nb.push(s);
    for(const bn of o.species.beh){const bf=BEH[bn];if(bf)bf(o,nb,env,dt)}
    const dc=PHYS.dragBase+0.8/(o.species.mass+0.08);o.vx-=o.vx*dc*dt;o.vy-=o.vy*dc*dt;
    if(isNaN(o.vx)||!isFinite(o.vx))o.vx=0;if(isNaN(o.vy)||!isFinite(o.vy))o.vy=0;
    const ts=o.species.sp*42,spd=Math.sqrt(o.vx*o.vx+o.vy*o.vy);if(spd>ts){o.vx=o.vx/spd*ts;o.vy=o.vy/spd*ts}
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.energy>o.species.ecap*.6&&o.size<o.species.sz[1])o.size+=0.01*dt;
    if(o.energy<=0||o.age>o.species.life)o.alive=false;
    if(o.energy>o.species.ecap*CFG.reproFrac&&Math.random()<o.species.repr*dt*.5)this._repro(o);
  }
  _repro(p){const cost=p.species.ecap*.3;if(p.energy<cost)return;p.energy-=cost;const ox=(Math.random()-.5)*p.size*2,oy=(Math.random()-.5)*p.size*2;const c=new Organism(p.species,p.x+ox,p.y+oy);c.size=p.species.sz[0]*(.7+Math.random()*.3);c.energy=cost*.6;c.gen=p.gen+1;c.schId=p.schId;(this._pendingO||this.organisms).push(c)}
  _procDeaths(){for(const o of this.organisms){if(o.alive||o._cons)continue;const env=this.envSystem.getAt(o.x,o.y,this.biome);if(env)env.detritus=Math.min(1,(env.detritus||0)+o.energy*.4/100);if(o.size>3)this.particles.addDetritus(o.x,o.y,o.energy*.3)}}
  render(){updateRender(this)}
  handleClick(sx,sy){
    const pos=getWorldFromClick({clientX:sx,clientY:sy});if(!pos)return;
    let cl=null,cd=25;for(const o of this.organisms){if(!o.alive)continue;const d=Math.hypot(o.x-pos.x,o.y-pos.y);if(d<cd&&d<o.size*1.5+10){cd=d;cl=o}}
    const insp=document.getElementById('insp');
    if(cl){const s=cl.species;const r=cl.energy/s.ecap;const st=r<CFG.starveTh?'濒死':r<0.3?'饥饿':r<0.7?'觅食':r>0.9?'饱足':'健康';
      insp.innerHTML=`<div class="sn">${s.name} <span style="font-size:0.6rem;color:rgba(255,255,255,0.4)">${s.nameEn}</span></div><div class="st">营养级: <b>${s.tl===0?'分解者':'TL'+s.tl}</b></div><div class="st">能量: <b>${cl.energy.toFixed(0)}/${s.ecap}</b></div><div class="st">大小: <b>${cl.size.toFixed(0)}px</b></div><div class="st">年龄: <b>${cl.age.toFixed(1)}s</b></div><div class="st">状态: <b>${st}</b></div>`;insp.classList.add('on');
      let px=sx+20,py=sy-20;if(px+180>window.innerWidth)px=sx-190;if(py+180>window.innerHeight)py=sy-180;insp.style.left=Math.max(10,px)+'px';insp.style.top=Math.max(10,py)+'px';
    }else{insp.classList.remove('on');for(let i=0;i<8;i++){const nx=pos.x+rand(-40,40),ny=pos.y+rand(-40,40);const env=this.envSystem.getAt(nx,ny,this.biome);if(env)env.nutrients=Math.min(1,env.nutrients+0.2)}}
  }
}

const layerIndicator=document.getElementById('layer-indicator');

function setLayerMode(mode){
  layerMode=mode;
  if(mode==='structure'){
    layerIndicator.classList.add('on');
    ldot.style.background='rgba(255,180,100,0.85)';
    ldot.style.boxShadow='0 0 10px rgba(255,160,60,0.5)';
    llbl.textContent='结构层 · 生态场';
    llbl.classList.add('s2');
    structureOverlay.classList.add('on');
    document.getElementById('bname').textContent='营养场 + 光强 + 温度';
  }else{
    layerIndicator.classList.remove('on');
    ldot.style.background='rgba(255,255,255,0.3)';
    ldot.style.boxShadow='none';
    llbl.textContent='表象';

// Help toggle

// Structure layer rendering (2D overlay)
function drawStructureOverlay(){
  const W=window.innerWidth, H=window.innerHeight;
  structureOverlay.width=W; structureOverlay.height=H;
  structureOverlay.style.width=W+'px'; structureOverlay.style.height=H+'px';
  sctx.clearRect(0,0,W,H);

  if(!sim.envSystem||!sim.envSystem.grid.length) return;
  const es=sim.envSystem;
  const cols=es.cols, rows=es.rows;
  const cw=W/cols, ch=H/rows;

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const cell=es.grid[r*cols+c];
      // Color: nutrients→green, light→yellow, temp→red, detritus→brown
      const nr=Math.floor(cell.nutrients*120);
      const ng=Math.floor(cell.light*80+40);
      const nb=Math.floor(cell.detritus*60+10);
      const alpha=0.15+cell.nutrients*0.2+cell.light*0.1;
      sctx.fillStyle=`rgba(${nr+60},${ng+30},${nb+20},${alpha})`;
      sctx.fillRect(c*cw,r*ch,cw+1,ch+1);
    }
  }

  // Grid lines
  sctx.strokeStyle='rgba(255,255,255,0.04)';
  sctx.lineWidth=0.5;
  for(let r=0;r<=rows;r++){ sctx.beginPath(); sctx.moveTo(0,r*ch); sctx.lineTo(W,r*ch); sctx.stroke(); }
  for(let c=0;c<=cols;c++){ sctx.beginPath(); sctx.moveTo(c*cw,0); sctx.lineTo(c*cw,H); sctx.stroke(); }

  // Legend
  sctx.fillStyle='rgba(255,255,255,0.3)';
  sctx.font='0.55rem Courier New';
  sctx.textAlign='left';
  sctx.fillText(`表温: ${es.surfTemp().toFixed(1)}°C | 营养: ${(es.avgNut()*100).toFixed(0)}% | ${es.lightI>0.5?'☀️昼':'🌙夜'} | 生物: ${sim.organisms.filter(o=>o.alive).length}`,16,H-16);
}

// Resize structure overlay

  structureOverlay.width=window.innerWidth;
  structureOverlay.height=window.innerHeight;
});

// UI
document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>sim.transitionTo(b.dataset.b));

window.addEventListener('keydown',e=>{const bk={'1':'coral','2':'open-ocean','3':'deep-sea','4':'kelp-forest','5':'hydrothermal','6':'polar'};if(bk[e.key])sim.transitionTo(bk[e.key]);if(e.key===' '){e.preventDefault();sim.paused=!sim.paused;document.getElementById('hint').textContent=sim.paused?'已暂停 · 按空格继续':'点击生物查看 · 空格暂停 · 1-6生境 · 滚轮/Ctrl+滚轮 · R重置 · F流线';}if(e.key==='r'||e.key==='R')sim.init();if(e.key==='f'||e.key==='F'){sim._showStreams=!sim._showStreams}if(e.key==='l'||e.key==='L'){setLayerMode(layerMode==='manifest'?'structure':'manifest')}});

// Right-click pan

window.addEventListener('pointermove',e=>{if(panning){if(sim.camX===null){sim.camX=CFG.worldW/2;sim.camY=350/sim.zoom}const vH=700/sim.zoom;const vW=vH*(window.innerWidth/window.innerHeight);sim.camX-=(e.clientX-panSX)/window.innerWidth*vW;sim.camY+=(e.clientY-panSY)/window.innerHeight*vH;panSX=e.clientX;panSY=e.clientY}});

// Touch
let tStartT=0,tStartP=null,lastPD=0,lastPC=null;
renderer.domElement.addEventListener('touchstart',e=>{e.preventDefault();tStartT=performance.now();if(e.touches.length===1)tStartP={x:e.touches[0].clientX,y:e.touches[0].clientY};else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastPD=Math.sqrt(dx*dx+dy*dy);lastPC={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2}}},{passive:false});
renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dist=Math.sqrt(dx*dx+dy*dy);if(lastPD>0)sim.zoom=clamp(sim.zoom*dist/lastPD,0.3,8);lastPD=dist;if(lastPC){if(sim.camX===null){sim.camX=CFG.worldW/2;sim.camY=350/sim.zoom}const vH=700/sim.zoom,vW=vH*(window.innerWidth/window.innerHeight);sim.camX-=(e.touches[0].clientX+e.touches[1].clientX-2*lastPC.x)/window.innerWidth*vW;sim.camY+=(e.touches[0].clientY+e.touches[1].clientY-2*lastPC.y)/window.innerHeight*vH}lastPC={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2}}},{passive:false});
renderer.domElement.addEventListener('touchend',e=>{const el=performance.now()-tStartT;if(el<300&&tStartP&&e.changedTouches.length===1){const dx=e.changedTouches[0].clientX-tStartP.x,dy=e.changedTouches[0].clientY-tStartP.y;if(Math.abs(dx)<15&&Math.abs(dy)<15)sim.handleClick(e.changedTouches[0].clientX,e.changedTouches[0].clientY)}tStartP=null;lastPD=0;lastPC=null});

// Info panel
let fc2=0,lt2=performance.now();
setInterval(()=>{const n=performance.now();const fps=Math.round(fc2/((n-lt2)/1000));fc2=0;lt2=n;let alive=0,totE=0,cnts={};for(const o of sim.organisms){if(!o.alive)continue;alive++;totE+=o.energy;cnts[o.species.id]=(cnts[o.species.id]||0)+1}document.getElementById('info').innerHTML=`FPS ${fps}<br>生物 ${alive}<br>能量 ${Math.round(totE)}<br>表温 ${sim.envSystem.surfTemp().toFixed(1)}°C<br>营养 ${(sim.envSystem.avgNut()*100).toFixed(0)}%<br>${sim.envSystem.lightI>0.5?'☀️ 昼':'🌙 夜'}`},500);

// Loop
let lt3=performance.now();
function loop(now){const dt=Math.min((now-lt3)/1000,CFG.maxDt);lt3=now;sim.update(dt);sim.render();if(layerMode==='structure')drawStructureOverlay();fc2++;requestAnimationFrame(loop)}
