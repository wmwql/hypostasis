<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大洋之息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;overflow:hidden;font-family:Georgia,serif;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{display:block;position:fixed;top:0;left:0;z-index:1;touch-action:none}
#ui{position:fixed;z-index:10;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#title{color:rgba(255,255,255,.88);font-size:1.5rem;letter-spacing:.15em;text-shadow:0 0 40px rgba(100,180,255,.3)}
#subtitle{color:rgba(255,255,255,.4);font-size:.7rem;letter-spacing:.2em}
#scene-menu{position:fixed;top:190px;left:12px;z-index:15;display:flex;flex-direction:column;gap:3px;pointer-events:all;max-height:calc(100vh - 240px);overflow-y:auto;padding:18px 4px 18px 8px;border-left:1px solid rgba(255,255,255,.06)}
#scene-menu::-webkit-scrollbar{width:0}
.mode-btn{background:none;border:none;color:rgba(255,255,255,.22);padding:2px 0;font-family:Georgia,serif;font-size:.72rem;letter-spacing:.08em;cursor:pointer;transition:color .3s;text-align:left}
.mode-btn:hover{color:rgba(255,255,255,.55)}
.mode-btn.active{color:rgba(255,255,255,.9);text-shadow:0 0 8px rgba(100,180,255,.25)}
#info{position:fixed;top:24px;right:24px;z-index:10;color:rgba(255,255,255,.35);font-size:.72rem;letter-spacing:.06em;text-align:right;line-height:1.7;font-family:Courier New,monospace;pointer-events:none}
#layer-indicator{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .35s}
#layer-indicator.visible{opacity:1}
#layer-indicator .layer-dot{width:8px;height:8px;border-radius:50%;transition:all .4s}
#layer-indicator .layer-label{color:rgba(255,255,255,.55);font-size:.68rem;letter-spacing:.1em;font-family:Georgia,serif}
#layer-indicator .layer-label.structure{color:rgba(255,180,100,.7)}
#help-toggle{position:fixed;top:20px;left:24px;z-index:20;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);font-size:.9rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .35s;pointer-events:all;font-family:Georgia,serif;line-height:1}
#help-toggle:hover,#help-toggle.open{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 0 18px rgba(100,180,255,.1)}
#help-panel{position:fixed;top:54px;left:24px;z-index:19;background:rgba(12,12,30,.92);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:200px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .3s;pointer-events:none;backdrop-filter:blur(12px)}
#help-panel.visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:all}
#help-title{color:rgba(255,255,255,.75);font-size:.8rem;letter-spacing:.12em;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.help-section{display:flex;flex-direction:column;gap:5px}
.help-label{color:rgba(255,255,255,.35);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase}
.help-row{color:rgba(255,255,255,.5);font-size:.68rem;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:1px 6px;font-family:Courier New,monospace;font-size:.65rem;color:rgba(255,255,255,.65)}
.ctrl-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);padding:5px 12px;border-radius:12px;font-family:inherit;font-size:.68rem;letter-spacing:.06em;cursor:pointer;transition:all .3s}
.ctrl-btn.on{background:rgba(100,150,255,.18);color:rgba(255,255,255,.8);border-color:rgba(100,150,255,.4);box-shadow:0 0 12px rgba(100,150,255,.1)}
#toggle-bar{position:fixed;top:24px;right:24px;z-index:15;display:flex;gap:6px;pointer-events:all}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="title">大洋之息</div><div id="subtitle">开阔大洋 · 850m</div></div>
<div id="layer-indicator"><div class="layer-dot" id="layer-dot"></div><span class="layer-label" id="layer-label">表象</span><span style="color:rgba(255,255,255,.3);font-size:.6rem;margin-left:6px;display:none" id="mode-ind">速度场</span></div>
<div id="info"><div id="fps">FPS: --</div><div id="surf-temp">表层水温: --°C</div><div id="day-info">--</div><div id="vel-info">表层流速: --</div></div>
<div id="toggle-bar"><button class="ctrl-btn" id="btn-flowlines">F 流线</button></div>
<div id="scene-menu">
<button class="mode-btn active" data-biome="open-ocean">开阔大洋 850m</button>
<button class="mode-btn" data-biome="coral-reef">珊瑚礁 60m</button>
<button class="mode-btn" data-biome="kelp-forest">海藻林 60m</button>
<button class="mode-btn" data-biome="deep-sea">深海 900m</button>
<button class="mode-btn" data-biome="hydrothermal">热液喷口 900m</button>
<button class="mode-btn" data-biome="polar">极地海洋 300m</button>
</div>
<div id="help-toggle">?</div>
<div id="help-panel">
<div id="help-title">大洋之息 · 操作</div>
<div class="help-section"><div class="help-label">键盘</div>
<div class="help-row"><kbd>1-6</kbd> 切换群系</div>
<div class="help-row"><kbd>L</kbd> 表象/结构层 <kbd>V</kbd> 切换场量</div>
<div class="help-row"><kbd>F</kbd> 流线 <kbd>Space</kbd> 暂停 <kbd>R</kbd> 重置</div>
</div>
<div class="help-section"><div class="help-label">鼠标</div>
<div class="help-row">滚轮放大 · 右键拖拽平移 · 双击复位</div>
<div class="help-row">左键拖拽 推动流场+注入染料</div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════════
// 大洋之息 · Phase 1: 热力学与流体
// ═══════════════════════════════════════════════════
var C = document.getElementById('c'),
    X = C.getContext('2d'),
    LW = 1600, LH = 900, SKY = 80, CELL = 20,
    GW = LW / CELL, GH = (LH - SKY) / CELL,
    WT = SKY;

var BIOMES = {
  'open-ocean':  { n:'开阔大洋',  d:850, k:.04, bt:22, la:'mid' },
  'coral-reef':  { n:'珊瑚礁',   d:60,  k:.08, bt:26, la:'trop' },
  'kelp-forest': { n:'海藻林',   d:60,  k:.06, bt:18, la:'temp' },
  'deep-sea':    { n:'深海',     d:900, k:.03, bt:4,  la:'mid' },
  'hydrothermal':{ n:'热液喷口', d:900, k:.05, bt:6,  la:'mid' },
  'polar':       { n:'极地海洋', d:300, k:.04, bt:-1, la:'polar' }
};
var CB = 'open-ocean', BM = BIOMES[CB];

// Physics arrays
var T = new Float32Array(GW*GH), T2 = new Float32Array(GW*GH);
var N = new Float32Array(GW*GH), N2 = new Float32Array(GW*GH);
var U = new Float32Array((GW+1)*GH);
var V = new Float32Array(GW*(GH+1));

// Dye (passive tracer)
var DR=new Float32Array(GW*GH), DG=new Float32Array(GW*GH), DB=new Float32Array(GW*GH);
var DR2=new Float32Array(GW*GH), DG2=new Float32Array(GW*GH), DB2=new Float32Array(GW*GH);

// ═══ Simple Ecosystem (Phase 2) ═══
// Species: {x,y,vx,vy,energy,species,targetX,targetY}
// species: 'p'=phytoplankton 'z'=zooplankton 'f'=smallFish
// TL1 → TL2 → TL3
var CRS=[];
var CRS_CFG={p:{n:100,tl:1,spd:.3,size:1.2,color:'rgba(140,220,160,ALPHA)'},
              z:{n:30,tl:2,spd:.6,size:1.8,color:'rgba(200,180,220,ALPHA)'},
              f:{n:8,tl:3,spd:1.2,size:2.5,color:'rgba(220,200,160,ALPHA)'}};

// State
var sT=0, paused=false, sFL=false, sS=false, sV=0, DL=90; // sV: 0=speed 1=temp 2=nutrients

// Camera
function fZ(){return Math.min(window.innerWidth/LW, window.innerHeight/LH);}
var Z=fZ(), pX=0, pY=0, tZ=Z, tpX=0, tpY=0;

// Jet colormap LUT
var JR=new Uint8Array(256),JG=new Uint8Array(256),JB=new Uint8Array(256);
for(var i=0;i<256;i++){var v=i/255,r,g,b;
  if(v<.125){r=0;g=0;b=Math.round(255*(v+.125)/.25)}
  else if(v<.375){r=0;g=Math.round(255*(v-.125)/.25);b=255}
  else if(v<.625){r=Math.round(255*(v-.375)/.25);g=255;b=255-r}
  else if(v<.875){r=255;g=Math.round(255*(.875-v)/.25);b=0}
  else{r=Math.round(255*(1.125-v)/.25);g=0;b=0}
  JR[i]=r;JG[i]=g;JB[i]=b;}

function RS(){
  var D=window.devicePixelRatio||1;
  C.width=window.innerWidth*D;C.height=window.innerHeight*D;
  C.style.width=window.innerWidth+'px';C.style.height=window.innerHeight+'px';
  X.setTransform(1,0,0,1,0,0);X.scale(D,D);
  var f=fZ();tZ=Math.max(f,tZ);Z=tZ;}
window.addEventListener('resize',RS);RS();

function TS(wx,wy){return{x:(wx-LW/2)*Z+window.innerWidth/2+pX,y:(wy-LH/2)*Z+window.innerHeight/2+pY};}
function TW(sx,sy){return{x:(sx-window.innerWidth/2-pX)/Z+LW/2,y:(sy-window.innerHeight/2-pY)/Z+LH/2};}

function HSV(h,s,v){var i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:return{r:v,g:t,b:p};case 1:return{r:q,g:v,b:p};case 2:return{r:p,g:v,b:t};
  case 3:return{r:p,g:q,b:v};case 4:return{r:t,g:p,b:v};default:return{r:v,g:p,b:q};}}

// Init
function INI(){
  BM=BIOMES[CB];var wh=BM.d;
  // Start from neutral state: uniform cool water, no currents
  for(var gy=0;gy<GH;gy++){for(var gx=0;gx<GW;gx++){
      var idx=gy*GW+gx;
      T[idx]=(BM.bt>0?BM.bt:2); // uniform base temperature
      N[idx]=.1; // uniform low nutrients
      DR[idx]=DG[idx]=DB[idx]=.02;}}
  for(var i=0;i<U.length;i++)U[i]=0;
  for(var i=0;i<V.length;i++)V[i]=0;
  // Spawn creatures in euphotic zone
  CRS=[];
  for(var s in CRS_CFG){var cfg=CRS_CFG[s];
    for(var i=0;i<cfg.n;i++){
      var cx=Math.random()*LW,cy=WT+Math.random()*(LH-WT)*.25;
      CRS.push({x:cx,y:cy,vx:(Math.random()-.5)*cfg.spd,vy:(Math.random()-.5)*cfg.spd*.3,
        energy:.5+Math.random()*.3,sp:s,targetX:cx,targetY:cy,age:0});}}
  sT=0;}

// Physics update
function UP(dt){
  if(dt>.05)dt=.05;if(dt<=0)return;
  var wh=BM.d,ppm=(LH-SKY)/wh,cm=CELL/ppm;
  var dp=(sT%DL)/DL,sr=.5+.5*Math.sin(dp*Math.PI*2-Math.PI/2);

  // Temperature
  for(var gy=0;gy<GH;gy++){var dm=gy*cm;
    for(var gx=0;gx<GW;gx++){var i=gy*GW+gx;
      // Solar heating: stronger near sun's horizontal position
      var sunDist=Math.abs(gx/(GW-1)-(.3+.4*dp)); // distance from sun projection
      var sunFocus=Math.exp(-sunDist*sunDist*8); // Gaussian hotspot
      var h=sr*.8*Math.exp(-dm*.4)*(.05+.95*sunFocus); // 95% solar heat concentrated at sun position
      var c=0;if(sr<.4)c=-.02*(1-sr/.4)*Math.exp(-dm*.08); // gradual cooling at night
      var lx=0,ly=0;if(gx>0)lx+=T[i-1]-T[i];if(gx<GW-1)lx+=T[i+1]-T[i];
      if(gy>0)ly+=T[i-GW]-T[i];if(gy<GH-1)ly+=T[i+GW]-T[i];
      var nt=T[i]+(h+c+(lx+ly)*.1)*dt;if(nt<2)nt=2;if(!isFinite(nt))nt=T[i];T2[i]=nt;}}
  var tmp=T;T=T2;T2=tmp;

  // Nutrients
  for(var gy=0;gy<GH;gy++){var df=(gy*cm)/wh;
    for(var gx=0;gx<GW;gx++){var i=gy*GW+gx;
      var tn=df>.7?.3+.7*((df-.7)/.3):.05+.25*df;
      var lx=0,ly=0;if(gx>0)lx+=N[i-1]-N[i];if(gx<GW-1)lx+=N[i+1]-N[i];
      if(gy>0)ly+=N[i-GW]-N[i];if(gy<GH-1)ly+=N[i+GW]-N[i];
      var nn=N[i]+((lx+ly)*.02+(tn-N[i])*.01)*dt;if(nn<0)nn=0;if(nn>1)nn=1;N2[i]=nn;}}
  var tmp2=N;N=N2;N2=tmp2;

  // ── Velocity field: thermal wind + buoyancy convection ──
  // Surface temp gradient drives thermal wind
  var dTdx=new Float32Array(GW);
  for(var gx=1;gx<GW-1;gx++)dTdx[gx]=(T[gx+1]-T[gx-1])/(2*cm);
  dTdx[0]=dTdx[1];dTdx[GW-1]=dTdx[GW-2];

  // Horizontal velocity (U): thermal wind + return flow → circulation cell
  for(var gy=0;gy<GH;gy++){
    var df=gy/GH; // depth fraction 0=surface, 1=bottom
    var ek=Math.exp(-gy*cm/50); // Ekman decay
    // Return flow: below Ekman layer, flow reverses to close circulation
    var retF=df>.2?-(df-.2)*.6:0; // weak return at depth
    for(var gx=0;gx<=GW;gx++){var gxT=Math.min(GW-1,gx);
      var thermWind=dTdx[gxT]*40;
      var wu=thermWind*(ek+retF); // surface forward + deep return
      var nu=wu;
      var ui=gy*(GW+1)+gx;U[ui]+=(nu-U[ui])*.1;if(!isFinite(U[ui]))U[ui]=0;}}

  // Vertical velocity (V): continuity-enforced circulation
  // Step 1: Compute horizontal divergence at each cell
  var divH=new Float32Array(GW*GH); // divergence per cell
  for(var gy=0;gy<GH;gy++){for(var gx=0;gx<GW;gx++){
      var uL=U[gy*(GW+1)+gx],uR=U[gy*(GW+1)+gx+1];
      divH[gy*GW+gx]=(uR-uL)/cm;}} // du/dx, positive = divergence

  // Step 2: Integrate continuity + buoyancy (bottom-up)
  for(var gx=0;gx<GW;gx++){var cumV=0;
    V[GH*GW+gx]=0; // seabed no-flow
    for(var gy=GH-1;gy>=0;gy--){
      cumV-=divH[gy*GW+gx]*cm*.3; // continuity: divergence→upwelling
      // Buoyancy: warm above cold → rise
      if(gy>0&&gy<GH-1){
        var ta=T[(gy-1)*GW+gx],tb=T[Math.min(GH-1,gy+1)*GW+gx];
        cumV+=(ta-tb)*.01;}
      cumV*=0.9; // damp to prevent runaway accumulation
      V[gy*GW+gx]=cumV;if(!isFinite(cumV))cumV=0;}}
  for(var gx=0;gx<GW;gx++)V[0*GW+gx]=0; // surface constraint

  // Vertical transport: buoyancy-driven convection + Ekman pumping
  for(var gx=1;gx<GW-1;gx++){
    // Ekman pumping from surface divergence
    var div=(U[gx+1]-U[gx])/cm;
    var ekUp=Math.abs(div)>.001?Math.abs(div)*1.2:0;
    // Combined with buoyancy V-field advection
    for(var gy=GH-1;gy>=1;gy--){
      var viMid=gy*GW+gx;
      var vv=V[viMid]; // vertical velocity at this cell interface
      // Advect scalars by vertical velocity (up if vv<0, down if vv>0)
      if(gy/GH>.3||ekUp>0){var si=gy*GW+gx,di=(gy-1)*GW+gx;
        var vertFlux=(ekUp+Math.abs(vv)*3)*dt;
        if(vertFlux>0){N[di]+=N[si]*vertFlux*.15;if(N[di]>1)N[di]=1;
        T[di]+=(T[si]-T[di])*vertFlux*.03;}}}}

  // Dye advection + injection
  if(sS){
    for(var gy=1;gy<GH-1;gy++){for(var gx=1;gx<GW-1;gx++){
        var i=gy*GW+gx,ui=gy*(GW+1)+gx,vi=gy*GW+gx;
        var uu=(U[ui]+U[ui+1])/2,vv=(V[vi]+V[(gy+1)*GW+gx])/2;
        var sx=gx-uu*dt*15,sy=gy-vv*dt*15;
        var sx0=Math.max(0,Math.min(GW-1,Math.floor(sx))),sy0=Math.max(0,Math.min(GH-1,Math.floor(sy)));
        var sx1=Math.min(GW-1,sx0+1),sy1=Math.min(GH-1,sy0+1);
        var fx=sx-sx0,fy=sy-sy0,dc=.999;
        var s00=sy0*GW+sx0,s10=sy0*GW+sx1,s01=sy1*GW+sx0,s11=sy1*GW+sx1;
        DR2[i]=dc*((1-fx)*(1-fy)*DR[s00]+fx*(1-fy)*DR[s10]+(1-fx)*fy*DR[s01]+fx*fy*DR[s11]);
        DG2[i]=dc*((1-fx)*(1-fy)*DG[s00]+fx*(1-fy)*DG[s10]+(1-fx)*fy*DG[s01]+fx*fy*DG[s11]);
        DB2[i]=dc*((1-fx)*(1-fy)*DB[s00]+fx*(1-fy)*DB[s10]+(1-fx)*fy*DB[s01]+fx*fy*DB[s11]);}}
    var tmpR=DR;DR=DR2;DR2=tmpR;var tmpG=DG;DG=DG2;DG2=tmpG;var tmpB=DB;DB=DB2;DB2=tmpB;

    // Inject dye at divergence zones + surface
    for(var gx=2;gx<GW-2;gx++){var div2=(U[gx+1]-U[gx-1])/(2*cm);
      if(Math.abs(div2)>.0008){var hue=(sT*.008+gx*.02)%1,rgb=HSV(hue,.8,.5);
        for(var gy=Math.floor(GH*.3);gy<GH-3;gy+=3){
          var i=gy*GW+gx;DR[i]=Math.min(1,DR[i]+rgb.r*dt*1.5);DG[i]=Math.min(1,DG[i]+rgb.g*dt*1.5);DB[i]=Math.min(1,DB[i]+rgb.b*dt*1.5);}}
      var i=0*GW+gx,hue2=.58+.05*(gx/GW),rgb2=HSV(hue2,.4,.35);
      DR[i]=Math.min(1,DR[i]+rgb2.r*dt*.3);DG[i]=Math.min(1,DG[i]+rgb2.g*dt*.3);DB[i]=Math.min(1,DB[i]+rgb2.b*dt*.3);}}

  // ═══ Ecosystem update ═══
  var wh2=BM.d,ppm2=(LH-SKY)/wh2;
  for(var ci=0;ci<CRS.length;ci++){var cr=CRS[ci],cfg=CRS_CFG[cr.sp];
    // Sample flow
    var gx2=Math.min(GW-1,Math.max(0,Math.floor(cr.x/CELL)));
    var gy2=Math.min(GH-1,Math.max(0,Math.floor((cr.y-WT)/CELL)));
    var ui2=gy2*(GW+1)+gx2,vi2=gy2*GW+gx2;
    var fu=(U[ui2]+U[ui2+1])/2,fv=(V[vi2]+V[(gy2+1)*GW+gx2])/2;
    var depthM=gy2*CELL/ppm2,dpf=depthM/wh2;

    // ── Energy ──
    var light=sr*Math.exp(-BM.k*depthM);
    if(cr.sp==='p')cr.energy+=light*N[gy2*GW+gx2]*80*dt; // photosynthesis
    cr.energy-=.003*dt; // basal metabolism
    cr.energy-=cfg.spd*cfg.spd*(cr.vx*cr.vx+cr.vy*cr.vy)*1e-6*dt; // movement cost
    cr.age+=dt;

    // ── Behavior ──
    var desiredX=cr.x,desiredY=cr.y,desiredSpd=cfg.spd*.5;
    // Wander: slowly changing random direction
    cr.targetX+=(Math.random()-.5)*cfg.spd*4;cr.targetY+=(Math.random()-.5)*cfg.spd*2;
    cr.targetX=Math.max(0,Math.min(LW,cr.targetX));
    cr.targetY=Math.max(WT+1,Math.min(LH-2,cr.targetY));

    if(cr.sp==='z'||cr.sp==='f'){
      // Hunt: scan for prey within range
      var huntRange=cr.sp==='z'?60:120,preySp=cr.sp==='z'?'p':'z',closest=null,cd=1e9;
      for(var cj=0;cj<CRS.length;cj++){if(cj===ci)continue;var pr=CRS[cj];
        if(pr.sp!==preySp)continue;
        var dx=pr.x-cr.x,dy=pr.y-cr.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<huntRange&&d<cd){cd=d;closest=pr;}}
      if(closest){desiredX=closest.x;desiredY=closest.y;desiredSpd=cfg.spd;}}
    // Flee: avoid predators (small fish and zooplankton flee from fish)
    if(cr.sp==='p'||cr.sp==='z'){var fleeRange=80,sumFX=0,sumFY=0;
      for(var cj2=0;cj2<CRS.length;cj2++){if(cj2===ci)continue;var pr2=CRS[cj2];
        if(cr.sp==='p'&&pr2.sp!=='f'&&pr2.sp!=='z')continue;
        if(cr.sp==='z'&&pr2.sp!=='f')continue;
        var dx2=cr.x-pr2.x,dy2=cr.y-pr2.y,d2=Math.sqrt(dx2*dx2+dy2*dy2);
        if(d2<fleeRange&&d2>1){sumFX+=dx2/d2;sumFY+=dy2/d2;}}
      var fm=Math.sqrt(sumFX*sumFX+sumFY*sumFY);
      if(fm>.001){desiredX=cr.x+sumFX/fm*60;desiredY=cr.y+sumFY/fm*30;desiredSpd=cfg.spd;}}

    // ── Steer toward desired ──
