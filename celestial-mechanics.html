// 双层空间: 结构层渲染 (Layer 2 — Gravity Field)
// ═══════════════════════════════════════════════════
function drawStructureLayer(ctx, bodies) {
  // Dark background
  ctx.fillStyle = '#030308';
  ctx.fillRect(0, 0, W, H);

  // Draw background starfield (very dim)
  starfield.draw(ctx, performance.now(), bodies);

  applyCamera();

  if (bodies.length === 0) {
    resetCameraTransform();
    // Empty state message
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '0.9rem Georgia';
    ctx.textAlign = 'center';
    ctx.fillText('放置天体以查看引力场结构', W / 2, H / 2);
    return;
  }

  // ── Gravity potential heatmap (full, enhanced) ──
  if (fieldGrid.vertices && fieldGrid.potentials) {
    const cols = fieldGrid.cols;
    const rows = fieldGrid.rows;
    const worldCellW = (W / (PX_PER_AU * zoom)) / (cols - 1);
    const worldCellH = (H / (PX_PER_AU * zoom)) / (rows - 1);

    const pots = fieldGrid.potentials;
    let maxP = -Infinity, minP = Infinity;
    for (let i = 0; i < pots.length; i++) {
      if (pots[i] < minP) minP = pots[i];
      if (pots[i] > maxP) maxP = pots[i];
    }
    const range = maxP - minP || 1;

    // Render heatmap cells
    for (let j = 0; j < rows - 1; j++) {
      for (let i = 0; i < cols - 1; i++) {
        const p = pots[j * cols + i];
        const t = (p - minP) / range; // 0=deepest well, 1=flat space
        // Deep potential: warm (orange/red), shallow: cool (blue/purple)
        const r = Math.floor(40 + t * 100);
        const g = Math.floor(20 + t * 60);
        const b = Math.floor(120 + (1 - t) * 135);
        const alpha = 0.25 + (1 - t) * 0.55;

        const x = (fieldGrid.vertices[(j * cols + i) * 2] + fieldGrid.vertices[((j+1) * cols + i+1) * 2]) / 2;
        const y = (fieldGrid.vertices[(j * cols + i) * 2 + 1] + fieldGrid.vertices[((j+1) * cols + i+1) * 2 + 1]) / 2;

        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.fillRect(x - worldCellW / 2, y - worldCellH / 2, worldCellW, worldCellH);
      }
    }

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.006 / zoom;

    for (let j = 0; j < rows; j++) {
      ctx.beginPath();
      const idx0 = j * cols * 2;
      ctx.moveTo(fieldGrid.vertices[idx0], fieldGrid.vertices[idx0 + 1]);
      for (let i = 1; i < cols; i++) {
        const idx = (j * cols + i) * 2;
        ctx.lineTo(fieldGrid.vertices[idx], fieldGrid.vertices[idx + 1]);
      }
      ctx.stroke();
    }
    for (let i = 0; i < cols; i++) {
      ctx.beginPath();
      const idx0 = i * 2;
      ctx.moveTo(fieldGrid.vertices[idx0], fieldGrid.vertices[idx0 + 1]);
      for (let j = 1; j < rows; j++) {
        const idx = (j * cols + i) * 2;
        ctx.lineTo(fieldGrid.vertices[idx], fieldGrid.vertices[idx + 1]);
      }
      ctx.stroke();
    }
  }

  // ── Velocity vectors ──
  for (const b of bodies) {
    const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (speed < 0.001) continue;

    const vxNorm = b.vx / speed;
    const vyNorm = b.vy / speed;
    const arrowLen = speed * 0.15 + 0.08;
    const headLen = arrowLen * 0.3;
    const ex = b.x + vxNorm * arrowLen;
    const ey = b.y + vyNorm * arrowLen;

    // Arrow body
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 0.015 / zoom;
    ctx.stroke();

    // Arrow head
    const angle = Math.atan2(vyNorm, vxNorm);
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - headLen * Math.cos(angle - 0.6), ey - headLen * Math.sin(angle - 0.6));
    ctx.lineTo(ex - headLen * Math.cos(angle + 0.6), ey - headLen * Math.sin(angle + 0.6));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fill();

    // Speed label near arrow
    const labelX = b.x + vxNorm * (arrowLen + 0.12);
    const labelY = b.y + vyNorm * (arrowLen + 0.12);
    const speedAU = speed; // AU/year
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = `${0.06 / zoom}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`${speedAU.toFixed(2)} AU/yr`, labelX, labelY);
  }

  // ── Body outlines (ghost style) ──
  for (const b of bodies) {
    if (b.isBlackHole) {
      // BH: dark circle with accretion ring outline
      const sch = Math.max(0.03, b.mass * 0.003);
      ctx.beginPath();
      ctx.arc(b.x, b.y, sch * 3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,180,60,0.4)';
      ctx.lineWidth = 0.02 / zoom;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b.x, b.y, sch * 1.5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,200,100,0.6)';
      ctx.lineWidth = 0.025 / zoom;
      ctx.stroke();
    } else {
      // Normal body: outline circle
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * 1.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 0.015 / zoom;
      ctx.stroke();

      // Mass label
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = `${0.05 / zoom}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`${b.mass.toFixed(1)} M☉`, b.x, b.y - b.radius * 1.5);
    }
  }

  // ── Potential contour labels ──
  if (fieldGrid.potentials && fieldGrid.potentials.length > 0) {
    const midCol = Math.floor(fieldGrid.cols / 2);
    const midRow = Math.floor(fieldGrid.rows / 2);
    const midP = fieldGrid.potentials[midRow * fieldGrid.cols + midCol];
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = `${0.055 / zoom}px 'Courier New', monospace`;
    ctx.textAlign = 'right';
    ctx.fillText(`中心势: ${midP.toFixed(1)}`, -camX + (W / 2) / (PX_PER_AU * zoom) * 0.8, -camY + (H / 2) / (PX_PER_AU * zoom) * 0.8);
  }

  resetCameraTransform();

  // Legend (screen space)
  const lx = 16, ly = H - 70;
  const lw = 120, lh = 12;
  const legendGrad = ctx.createLinearGradient(lx, 0, lx + lw, 0);
  legendGrad.addColorStop(0, 'rgba(40,20,120,0.8)');
  legendGrad.addColorStop(0.5, 'rgba(40,60,40,0.8)');
  legendGrad.addColorStop(1, 'rgba(180,100,20,0.8)');
  ctx.fillStyle = legendGrad;
  ctx.fillRect(lx, ly, lw, lh);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.strokeRect(lx, ly, lw, lh);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '0.5rem Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('浅势阱', lx, ly - 4);
  ctx.fillText('深势阱', lx + lw, ly - 4);
}

function loop(timestamp) {
  requestAnimationFrame(loop);

  // FPS
  frameCount++;
  if (timestamp - lastFpsUpdate > 1000) {
    fps = Math.round(frameCount / ((timestamp - lastFpsUpdate) / 1000));
    frameCount = 0;
    lastFpsUpdate = timestamp;
  }

  // ── Scene event checker (BEFORE physics — prevents merge eating events) ──
  const scene = sceneDefs[currentMode];
  if (scene && scene.events) {
    for (let ei = 0; ei < scene.events.length; ei++) {
      const ev = scene.events[ei];
      const evId = `${currentMode}_${ei}`;
      if (ev.once && firedEvents[evId]) continue;
      // afterEvent: only fire if referenced event index has already fired
      if (ev.afterEvent !== undefined && !firedEvents[`${currentMode}_${ev.afterEvent}`]) continue;
      if (ev.type === 'proximity') {
        const bodyA = bodies.find(b2 => b2.name === ev.a);
        const bodyB = bodies.find(b2 => b2.name === ev.b);
        if (bodyA && bodyB) {
          const dx = bodyA.x - bodyB.x, dy = bodyA.y - bodyB.y;
          const curDist = Math.sqrt(dx*dx + dy*dy);
          if (curDist < ev.dist) {
            if (ev.once) firedEvents[evId] = true;
            // Auto-shield: prevent merge for 3 seconds after any proximity event
            bodyA._shieldUntil = performance.now() + 3000;
            bodyB._shieldUntil = performance.now() + 3000;
            if (ev.spawn) {
              const sx = bodyA.x, sy = bodyA.y;
              if (ev.spawn.from) {
                // Directional: bias particles away from the specified body
                const ref = ev.spawn.from === 'b' ? bodyB : bodyA;
                const bdx = sx - ref.x, bdy = sy - ref.y;
                const bdist = Math.sqrt(bdx*bdx+bdy*bdy)+0.001;
                const bnx = bdx/bdist, bny = bdy/bdist;
                spawnParticlesDir(sx, sy, ev.spawn.count, ev.spawn.speed, ev.spawn.life, ev.spawn.color, ev.spawn.size, bnx, bny, 0.6);
              } else {
                spawnParticles(sx, sy, ev.spawn.count, ev.spawn.speed, ev.spawn.life, ev.spawn.color, ev.spawn.size);
              }
            }
            if (ev.spawn2) {
              const sx = bodyA.x, sy = bodyA.y;
              if (ev.spawn2.from) {
                const ref = ev.spawn2.from === 'b' ? bodyB : bodyA;
                const bdx = sx - ref.x, bdy = sy - ref.y;
                const bdist = Math.sqrt(bdx*bdx+bdy*bdy)+0.001;
                const bnx = bdx/bdist, bny = bdy/bdist;
                spawnParticlesDir(sx, sy, ev.spawn2.count, ev.spawn2.speed, ev.spawn2.life, ev.spawn2.color, ev.spawn2.size, bnx, bny, 0.6);
              } else {
                spawnParticles(sx, sy, ev.spawn2.count, ev.spawn2.speed, ev.spawn2.life, ev.spawn2.color, ev.spawn2.size);
              }
            }
            if (ev.kick) {
              const target = ev.kick.target === 'a' ? bodyA : bodyB;
              const from = ev.kick.target === 'a' ? bodyB : bodyA;
              if (ev.kick.prograde) {
                // Kick along target's current velocity (engine thrust)
                const vMag = Math.sqrt(target.vx*target.vx + target.vy*target.vy) + 0.001;
                target.vx += (target.vx/vMag) * ev.kick.speed;
                target.vy += (target.vy/vMag) * ev.kick.speed;
              } else {
                const kdx = target.x - from.x, kdy = target.y - from.y;
                const kdist = Math.sqrt(kdx*kdx + kdy*kdy) + 0.001;
                const rnx = kdx/kdist, rny = kdy/kdist;
                const tx = -rny, ty = rnx; // tangential CCW
                target.vx += rnx * ev.kick.speed * 0.3 + tx * ev.kick.speed * 0.7;
                target.vy += rny * ev.kick.speed * 0.3 + ty * ev.kick.speed * 0.7;
              }
              target._shieldUntil = performance.now() + 2000;
              if (from._shieldUntil === undefined || from._shieldUntil < target._shieldUntil) from._shieldUntil = target._shieldUntil;
            }
            if (ev.msg) emitEvent(ev.msg);
          }
        }
      }
      if (ev.type === 'time' && simYears >= ev.at && !firedEvents[evId]) {
        if (ev.once !== false) firedEvents[evId] = true;
        if (ev.msg) emitEvent(ev.msg);
        if (ev.spawn && ev.atBody) {
          const target = bodies.find(b2 => b2.name === ev.atBody);
          if (target) spawnParticles(target.x, target.y, ev.spawn.count, ev.spawn.speed, ev.spawn.life, ev.spawn.color, ev.spawn.size);
        }
      }
    }
  }

  // Physics
  if (bodies.length > 0) {
    solveGravity(bodies);
  }

  // Compute field grid — always compute in structure mode, or when grid shown
  if ((showGrid || layerMode === 'structure') && bodies.length > 0) {
    fieldGrid.compute(bodies);
  }

  // ── Render ──────────────────────────────────
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = layerMode === 'structure' ? '#030308' : '#050510';
  ctx.fillRect(0, 0, W, H);

  if (layerMode === 'structure') {
    // ═══════════ LAYER 2: 结构层 ═══════════
    drawStructureLayer(ctx, bodies);
  } else {
    // ═══════════ LAYER 1: 表象层 ═══════════
    // Screen-space background
    starfield.draw(ctx, timestamp, bodies);

    // World-space rendering
    applyCamera();

    if (showGrid && bodies.length > 0) {
      fieldGrid.draw(ctx);
    }

    if (showForceLines && bodies.length > 1) {
      drawForceLines(ctx, bodies);
    }

    for (const b of bodies) {
      b.draw(ctx);
    }

    // Particles (world space)
    for (const p of particles) p.draw(ctx);

    // ── Gravitational wave chirp visualization ──
    if (gwChirp && gwChirp.active) {
      const elapsed = performance.now()*0.001 - gwChirp.t0;
      if (elapsed > 3.5) { gwChirp.active = false; }
      else {
        // Chirp frequency: f(t) = f0 * (t_c - t)^(-3/8) → rises rapidly before merger
        const tRemain = Math.max(0.01, 0.8 - elapsed);
        const chirpFreq = 3 * Math.pow(tRemain, -0.375); // Hz (visual)
        const chirpAmp = Math.min(1, elapsed < 0.6 ? elapsed/0.6 : Math.max(0, (1.5-elapsed)/0.9));
        const rippleR = elapsed * 2.5; // expanding shell at "light speed"

        // Expanding gravitational wave ripple
        if (rippleR < 8) {
          ctx.beginPath();
          ctx.arc(gwChirp.x, gwChirp.y, rippleR, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(180,200,255,${0.35*chirpAmp*(1-rippleR/8)})`;
          ctx.lineWidth = 0.015;
          ctx.stroke();
        }
        // Second ripple (ring-down)
        const rippleR2 = (elapsed - 0.3) * 2.5;
        if (rippleR2 > 0.2 && rippleR2 < 6) {
          ctx.beginPath();
          ctx.arc(gwChirp.x, gwChirp.y, rippleR2, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(160,190,240,${0.2*chirpAmp*(1-rippleR2/6)})`;
          ctx.lineWidth = 0.01;
          ctx.stroke();
        }

        // Frequency indicator (tiny waveform near merger point)
        const wx = gwChirp.x, wy = gwChirp.y - rippleR - 0.15;
        ctx.strokeStyle = `rgba(200,220,255,${0.7*chirpAmp})`;
        ctx.lineWidth = 0.005;
        ctx.beginPath();
        const nCycles = Math.round(chirpFreq * 0.5);
        for (let i = 0; i <= nCycles; i++) {
          const frac = i / Math.max(1, nCycles);
          const sx = wx - 0.25 + frac * 0.5;
          const sy = wy + Math.sin(frac * nCycles * Math.PI*2) * 0.04 * chirpAmp;
          i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }
    }

    // Ghost placement preview (only with selected type)
    if (mouseDown && selectedStarType !== null) {
      const sw = screenToWorld(mouseStartX, mouseStartY);
      const ew = screenToWorld(mouseX, mouseY);
      const ldx = sw.x - ew.x;
      const ldy = sw.y - ew.y;
      const lx = sw.x + ldx;
      const ly = sw.y + ldy;

      ctx.beginPath();
      ctx.moveTo(sw.x, sw.y);
      ctx.lineTo(ew.x, ew.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 0.024 / zoom;
      ctx.setLineDash([0.04 / zoom, 0.08 / zoom]);
      ctx.stroke();
      ctx.setLineDash([]);

      const mag = Math.sqrt(ldx * ldx + ldy * ldy);
      if (mag > 0.03 / zoom) {
        const angle = Math.atan2(ldy, ldx);
        ctx.beginPath();
        ctx.moveTo(sw.x, sw.y);
        ctx.lineTo(lx, ly);
        ctx.strokeStyle = 'rgba(255,210,80,0.55)';
        ctx.lineWidth = 0.036 / zoom;
        ctx.stroke();

        const arrowLen = 0.2 / zoom;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx - arrowLen * Math.cos(angle - 0.5), ly - arrowLen * Math.sin(angle - 0.5));
        ctx.lineTo(lx - arrowLen * Math.cos(angle + 0.5), ly - arrowLen * Math.sin(angle + 0.5));
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,210,80,0.55)';
        ctx.fill();
      }

      if (selectedStarType !== null) {
        const bt = bodyTypes[selectedStarType];
        const ghost = new Body(sw.x, sw.y, 0, 0, bt.mass, bt.color, bt.name, bt.isBH);
        ctx.globalAlpha = 0.55;
        ghost.draw(ctx);
        ctx.globalAlpha = 1;
      } else {
        const grad = ctx.createRadialGradient(sw.x, sw.y, 0.01, sw.x, sw.y, 0.12);
        grad.addColorStop(0, 'rgba(255,255,255,0.35)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, 0.12, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }
    }

    resetCameraTransform();
  }

  // ── Hover detection ──────────────────────────
  hoveredBody = null;
  if (!mouseDown && !isPanning) {
    const wp = screenToWorld(mouseX, mouseY);
    let bestDist = 30 / zoom;
    for (const b of bodies) {
      const dx = b.x - wp.x;
      const dy = b.y - wp.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const hoverRadius = Math.max(b.radius * 2.5, 12 / zoom);
      if (dist < hoverRadius && dist < bestDist) {
        bestDist = dist;
        hoveredBody = b;
      }
    }
  }

  // Long-press delete indicator (red pulsing ring)
  if (longPressTarget && longPressIndicator > 0) {
    longPressIndicator = Math.max(0, longPressIndicator - 0.03);
    const lp = worldToScreen(longPressTarget.x, longPressTarget.y);
    const lr = longPressTarget.radius * PX_PER_AU * zoom * 1.8;
    ctx.beginPath();
    ctx.arc(lp.x, lp.y, lr, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,60,30,${longPressIndicator * 0.7})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // Inner warning circle
    ctx.beginPath();
    ctx.arc(lp.x, lp.y, lr * 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,100,80,${longPressIndicator * 0.9})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Hover tooltip (screen space) — with real physical properties
  if (hoveredBody) {
    const sp = worldToScreen(hoveredBody.x, hoveredBody.y);
    const speed = Math.sqrt(hoveredBody.vx ** 2 + hoveredBody.vy ** 2);

    // All values already in real units: M☉, AU, year
    const M_JUP = 9.55e-4, M_EAR = 3.00e-6;
    const R_SUN_AU = 0.00465, R_JUP_AU = 4.67e-4, R_EAR_AU = 4.26e-5;

    let typeLine, massLine, sizeLine, speedLine;
    const m = hoveredBody.mass;
    const r = hoveredBody.radius;

    if (hoveredBody.isBlackHole) {
      typeLine = '超大质量黑洞';
      massLine = `质量 ${m.toFixed(1)} M☉`;
      const rsReal = 2 * G * m / (C_SIM * C_SIM); // Schwarzschild radius in AU (with sim c)
      sizeLine = `阴影半径 ${(Math.max(0.04,m*0.004)*2.6).toFixed(3)} AU (视觉)`;
    } else if (m >= 0.5) {
      const spectral = m >= 8 ? 'O' : m >= 3 ? 'B' : m >= 1.5 ? 'A' : m >= 1.0 ? 'F' : 'G';
      typeLine = `恒星 · 光谱${spectral}型`;
      massLine = `质量 ${m.toFixed(2)} M☉`;
      sizeLine = `半径 ${r.toFixed(3)} AU (visual)`;
    } else if (m >= M_JUP) {
      typeLine = '气态巨行星';
      massLine = `质量 ${(m/M_JUP).toFixed(1)} M♃ · ${(m*M_SUN_KG/1e24).toFixed(1)}×10²⁴ kg`;
      sizeLine = `轨道 ${r.toFixed(3)} AU (visual)`;
    } else if (m >= M_EAR) {
      typeLine = '岩石行星';
      massLine = `质量 ${(m/M_EAR).toFixed(2)} M🜨 · ${(m*M_SUN_KG/1e24).toFixed(2)}×10²⁴ kg`;
      sizeLine = `轨道 ${r.toFixed(3)} AU (visual)`;
    } else {
      typeLine = '小行星/彗星';
      massLine = `质量 ${(m*M_SUN_KG).toExponential(1)} kg`;
      sizeLine = `半径 ${r.toFixed(3)} AU (visual)`;
    }
    // Speed: convert AU/year → km/s (1 AU/year = 4.74 km/s)
    speedLine = `速度 ${speed.toFixed(2)} AU/yr · ${(speed*4.74).toFixed(1)} km/s`;

    const lines = [hoveredBody.name, typeLine, massLine, sizeLine, speedLine];
    const fontSize = 13, lineH = 17, padX = 12, padY = 9;
    ctx.font = `${fontSize}px Georgia, serif`;
    const tw = Math.max(...lines.map(l => ctx.measureText(l).width)) + padX * 2;
    const th = lines.length * lineH + padY * 2;
    const tx = sp.x + 18;
    const ty = sp.y - th - 14;

    ctx.fillStyle = 'rgba(8,8,20,0.85)';
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(tx, ty, tw, th, 6);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    // Name
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = `bold ${fontSize+1}px Georgia, serif`;
    ctx.fillText(lines[0], tx + padX, ty + padY + 0.7 * lineH);
    // Type
    ctx.fillStyle = 'rgba(180,200,220,0.7)';
    ctx.font = `italic ${fontSize-2}px Georgia, serif`;
    ctx.fillText(lines[1], tx + padX, ty + padY + 1.7 * lineH);
    // Properties
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `${fontSize-2}px Georgia, serif`;
    ctx.fillText(lines[2], tx + padX, ty + padY + 2.7 * lineH);
    ctx.fillText(lines[3], tx + padX, ty + padY + 3.7 * lineH);
    ctx.fillText(lines[4], tx + padX, ty + padY + 4.7 * lineH);

    // Highlight ring
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, hoveredBody.radius * zoom + 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Screen-space cursor halo
  if (!mouseDown) {
    const grad = ctx.createRadialGradient(mouseX, mouseY, 2, mouseX, mouseY, 40);
    grad.addColorStop(0, 'rgba(255,255,255,0.06)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // ── Particle update ──────────────────────────
  const pdt = DT_BASE * simSpeed;
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(pdt);
    if (!particles[i].alive) particles.splice(i, 1);
  }

  // ── UI Update ───────────────────────────────
  simYears += DT_BASE * simSpeed;
  const energy = computeEnergy(bodies);
  document.getElementById('fps').textContent = `FPS ${fps}`;
  document.getElementById('body-count').textContent = `天体 ${bodies.length}`;
  document.getElementById('energy').textContent =
    `${simYears.toFixed(2)} 年 · 动能 ${energy.kinetic.toFixed(1)} · 势能 ${Math.abs(energy.potential).toFixed(1)}`;

  // ── Milestone panel update ────────────────────
  const mScene = sceneDefs[currentMode];
  const mList = document.getElementById('milestone-list');
  if (mScene && mScene.events && mScene.events.length > 0) {
    document.getElementById('milestone-panel').style.display = '';
    let html = '';
    for (let ei = 0; ei < mScene.events.length; ei++) {
      const ev = mScene.events[ei];
      const evId = `${currentMode}_${ei}`;
      const done = !!firedEvents[evId];
      let progress = '';
      if (!done && ev.type === 'time') {
        progress = ` <span class="milestone-progress">${(simYears/ev.at*100).toFixed(0)}%</span>`;
      }
      if (!done && ev.type === 'proximity') {
        const a = bodies.find(b2 => b2.name === ev.a);
        const b = bodies.find(b2 => b2.name === ev.b);
        if (a && b) {
          const curDist = Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
          const pct = Math.max(0, Math.min(100, ((ev.dist*3 - curDist)/(ev.dist*2)*100)));
          progress = ` <span class="milestone-progress">${curDist.toFixed(1)}/${ev.dist} AU</span>`;
        }
      }
      const cls = done ? 'milestone-line done' : 'milestone-line';
      const prefix = done ? '✓ ' : '○ ';
      html += `<div class="${cls}">${prefix}${ev.msg || ev.type}${progress}</div>`;
    }
    mList.innerHTML = html;
  } else {
    document.getElementById('milestone-panel').style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════
// 输入处理
// ═══════════════════════════════════════════════════
// Double-click: reset camera
canvas.addEventListener('dblclick', (e) => {
  resetCamera();
  fieldGrid.vertices = null;
});

// Right-click: delete nearest body
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (bodies.length <= 1) return;
  const wp = screenToWorld(e.clientX, e.clientY);
  let nearest = null;
  let minDist = 50 / zoom;
  for (const b of bodies) {
    const dx = b.x - wp.x;
    const dy = b.y - wp.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < minDist && dist < b.radius * 4) {
      minDist = dist;
      nearest = b;
    }
  }
  if (nearest) {
    const idx = bodies.indexOf(nearest);
    if (idx >= 0) bodies.splice(idx, 1);
    fieldGrid.vertices = null;
  }
});

canvas.addEventListener('mousedown', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;

  // Middle mouse or Shift+left → pan
  if (e.button === 1 || (e.button === 0 && e.shiftKey)) {
    isPanning = true;
    panStartCamX = camX;
    panStartCamY = camY;
    panStartMX = e.clientX;
    panStartMY = e.clientY;
    canvas.style.cursor = 'grab';
    return;
  }

  if (e.button !== 0) return;
  mouseDown = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
  mouseStartTime = performance.now();
});

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  if (isPanning) {
    camX = panStartCamX - (e.clientX - panStartMX) / zoom;
    camY = panStartCamY - (e.clientY - panStartMY) / zoom;
    fieldGrid.vertices = null;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (isPanning) {
    isPanning = false;
    canvas.style.cursor = 'crosshair';
    return;
  }
  if (!mouseDown) return;
  mouseDown = false;
  const dx = mouseX - mouseStartX;
  const dy = mouseY - mouseStartY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const dt = Math.max(performance.now() - mouseStartTime, 1);

  // Require a star type to be selected
  if (selectedStarType === null) {
    mouseDown = false;
    return;
  }

  const wp = screenToWorld(mouseStartX, mouseStartY);
  const cat = bodyTypes[selectedStarType];
  const mass = cat.mass, colorHint = cat.color, bodyName = cat.name, isBH = cat.isBH;

  if (dist < 8) {
    // Click: create body in world space with orbital velocity
    let dominantBody = null;
    let maxForce = 0;
    for (const b of bodies) {
      const ddx = wp.x - b.x;
      const ddy = wp.y - b.y;
      const dSq = ddx*ddx + ddy*ddy + 0.01;
      const force = G * b.mass / dSq;
      if (force > maxForce) { maxForce = force; dominantBody = b; }
    }

    let vx = 0, vy = 0;
    if (dominantBody && maxForce > 0.001) {
      const ddx = wp.x - dominantBody.x;
      const ddy = wp.y - dominantBody.y;
      const distTo = Math.sqrt(ddx*ddx + ddy*ddy);
      const vCirc = Math.sqrt(G * dominantBody.mass / Math.max(distTo, 0.1));
      const angle = Math.atan2(ddy, ddx);
      vx = -Math.sin(angle)*vCirc + (Math.random()-0.5)*0.2;
      vy = Math.cos(angle)*vCirc + (Math.random()-0.5)*0.2;
    }

    bodies.push(new Body(wp.x, wp.y, vx, vy, mass, colorHint, bodyName, isBH));
  } else {
    // Drag: slingshot — drag backward to launch forward
    const vScale = 0.08 / zoom;
    bodies.push(new Body(wp.x, wp.y, -dx*vScale, -dy*vScale, mass, colorHint, bodyName, isBH));
  }
});

// Touch support (with pinch-zoom and two-finger pan)
canvas.addEventListener('touchstart', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  e.preventDefault();

  if (e.touches.length === 2) {
    // Two-finger: pinch or pan
    mouseDown = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist0 = Math.sqrt(dx * dx + dy * dy);
    pinchZoom0 = zoom;
    pinchCamX0 = camX;
    pinchCamY0 = camY;
    pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  } else if (e.touches.length === 1) {
    mouseDown = true;
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    mouseStartX = mouseX;
    mouseStartY = mouseY;
    mouseStartTime = performance.now();
    // Start long-press timer
    clearTimeout(longPressTimer);
    longPressTarget = null;
    longPressTimer = setTimeout(() => {
      // Long press detected: find nearest body
      const wp = screenToWorld(mouseStartX, mouseStartY);
      let nearest = null, bestDist = Infinity;
      for (const b of bodies) {
        const d = Math.hypot(b.x - wp.x, b.y - wp.y);
        if (d < b.radius * 3 && d < bestDist) { nearest = b; bestDist = d; }
      }
      if (nearest) {
        longPressTarget = nearest;
        longPressIndicator = 1;
      }
    }, 600);
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();

  if (e.touches.length === 2) {
    mouseDown = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const newDist = Math.sqrt(dx * dx + dy * dy);
    const newMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const newMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

    // Pan
    const panDx = (newMidX - pinchMidX) / pinchZoom0;
    const panDy = (newMidY - pinchMidY) / pinchZoom0;
    camX = pinchCamX0 - panDx;
    camY = pinchCamY0 - panDy;

    // Pinch zoom
    if (pinchDist0 > 0) {
      const newZoom = pinchZoom0 * (newDist / pinchDist0);
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    }

    fieldGrid.vertices = null;
  } else if (e.touches.length === 1) {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    // Cancel long-press if moved too much
    const md = Math.hypot(mouseX - mouseStartX, mouseY - mouseStartY);
    if (md > 12 && longPressTarget === null) {
      clearTimeout(longPressTimer);
      longPressIndicator = 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (e.touches.length > 0) {
    // Transitioning from 2→1 finger: update single-touch state
    if (e.touches.length === 1) {
      mouseDown = true;
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
      mouseStartX = mouseX;
      mouseStartY = mouseY;
      mouseStartTime = performance.now();
    }
    return;
  }
  if (!mouseDown) return;
  mouseDown = false;
  clearTimeout(longPressTimer);

  // Long-press delete
  if (longPressTarget) {
    const idx = bodies.indexOf(longPressTarget);
    if (idx >= 0) { bodies.splice(idx, 1); fieldGrid.vertices = null; }
    longPressTarget = null;
    longPressIndicator = 0;
    return;
  }
  longPressTarget = null;
  longPressIndicator = 0;

  const dx = mouseX - mouseStartX;
  const dy = mouseY - mouseStartY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (selectedStarType === null) return;

  const wp = screenToWorld(mouseStartX, mouseStartY);
  const cat = bodyTypes[selectedStarType];
  const mass = cat.mass, colorHint = cat.color, bodyName = cat.name, isBH = cat.isBH;

  if (dist < 8) {
    let dominantBody = null, maxForce = 0;
    for (const b of bodies) {
      const ddx = wp.x - b.x, ddy = wp.y - b.y;
      const force = G*b.mass/(ddx*ddx + ddy*ddy + 0.01);
      if (force > maxForce) { maxForce = force; dominantBody = b; }
    }
    let vx = 0, vy = 0;
    if (dominantBody && maxForce > 0.001) {
      const ddx = wp.x - dominantBody.x, ddy = wp.y - dominantBody.y;
      const distTo = Math.sqrt(ddx*ddx + ddy*ddy);
      const vCirc = Math.sqrt(G*dominantBody.mass/Math.max(distTo,0.1));
      const angle = Math.atan2(ddy, ddx);
      vx = -Math.sin(angle)*vCirc; vy = Math.cos(angle)*vCirc;
    }
    bodies.push(new Body(wp.x, wp.y, vx, vy, mass, colorHint, bodyName, isBH));
  } else {
    bodies.push(new Body(wp.x, wp.y, -dx*0.016/zoom, -dy*0.016/zoom, mass, colorHint, bodyName, isBH));
  }
});

// Scroll: zoom at cursor
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = -e.deltaY * 0.005;
  zoomAt(e.clientX, e.clientY, zoom * (1 + delta));
}, { passive: false });

});

// Mode buttons
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    resetCamera();
    simYears = 0;
    particles = [];
    firedEvents = {};
    bodies = buildScene(currentMode);
    fieldGrid.vertices = null;
    // Show scene description
    const desc = sceneDefs[currentMode]?.desc;
    if (desc) {
      const subEl = document.getElementById('subtitle');
      subEl.textContent = desc;
      subEl.style.color = 'rgba(255,255,255,0.55)';
      subEl.style.opacity = '1';
      // Fade back to default after delay
      clearTimeout(subEl._fadeTimer);
      subEl._fadeTimer = setTimeout(() => {
        subEl.style.opacity = '';
        subEl.style.color = '';
        subEl.textContent = '牛顿引力下的 N 体宇宙';
      }, 6000);
    }
  });
});

// G slider
document.getElementById('g-slider').addEventListener('input', (e) => {
  G = parseFloat(e.target.value);
});

// Speed slider
document.getElementById('speed-slider').addEventListener('input', (e) => {
  simSpeed = parseFloat(e.target.value);
});

// Toggle buttons
document.getElementById('toggle-grid').addEventListener('click', function() {
  showGrid = !showGrid;
  this.classList.toggle('on', showGrid);
  if (!showGrid) fieldGrid.vertices = null;
});

document.getElementById('toggle-trails').addEventListener('click', function() {
  showTrails = !showTrails;
  this.classList.toggle('on', showTrails);
});

document.getElementById('toggle-lines').addEventListener('click', function() {
  showForceLines = !showForceLines;
  this.classList.toggle('on', showForceLines);
});

document.getElementById('toggle-relativity').addEventListener('click', function() {
  showRelativity = !showRelativity;
  this.classList.toggle('on', showRelativity);
});

const gridQualityBtn = document.getElementById('toggle-grid-quality');
gridQualityBtn.textContent = gridLabels[gridQuality];
gridQualityBtn.addEventListener('click', function() {
  gridQuality = (gridQuality + 1) % 4;
  this.textContent = gridLabels[gridQuality];
  fieldGrid.vertices = null;
});

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  switch (e.key.toLowerCase()) {
    case 'g':
      showGrid = !showGrid;
      document.getElementById('toggle-grid').classList.toggle('on', showGrid);
      if (!showGrid) fieldGrid.vertices = null;
      break;
    case 't':
      showTrails = !showTrails;
      document.getElementById('toggle-trails').classList.toggle('on', showTrails);
      break;
    case 'f':
      showForceLines = !showForceLines;
      document.getElementById('toggle-lines').classList.toggle('on', showForceLines);
      break;
    case 'e':
      showRelativity = !showRelativity;
      document.getElementById('toggle-relativity').classList.toggle('on', showRelativity);
      break;
    case 'q':
      gridQuality = (gridQuality + 1) % 4;
      gridQualityBtn.textContent = gridLabels[gridQuality];
      fieldGrid.vertices = null;
      break;
    case '0':
      resetCamera();
      fieldGrid.vertices = null;
      break;
    case 'c':
      bodies = [];
      particles = [];
      fieldGrid.vertices = null;
      break;
    case 'r':
      bodies = buildScene(currentMode);
      fieldGrid.vertices = null;
      break;
    case '1': document.querySelector('[data-mode="solar"]').click(); break;
    case '2': document.querySelector('[data-mode="binary"]').click(); break;
    case '3': document.querySelector('[data-mode="cluster"]').click(); break;
    case '4': document.querySelector('[data-mode="spiral"]').click(); break;
    case '5': document.querySelector('[data-mode="chaos"]').click(); break;
    case '6': document.querySelector('[data-mode="threebody"]').click(); break;
    case '7': document.querySelector('[data-mode="blackhole"]').click(); break;
    case '8': document.querySelector('[data-mode="collision"]').click(); break;
    case '9': document.querySelector('[data-mode="tatooine"]').click(); break;
    case '0': document.querySelector('[data-mode="jupiter-ignite"]').click(); break;
    case 'l':
      setLayerMode(layerMode === 'manifest' ? 'structure' : 'manifest');
      break;
  }
});

// ═══════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════
resetCamera();
bodies = buildScene('solar');
// Show initial scene description
const initDesc = sceneDefs.solar?.desc;
if (initDesc) {
  const subEl = document.getElementById('subtitle');
  subEl.textContent = initDesc;
  subEl.style.color = 'rgba(255,255,255,0.55)';
  subEl.style.opacity = '1';
  setTimeout(() => {
    subEl.style.opacity = '';
    subEl.style.color = '';
    subEl.textContent = '牛顿引力下的 N 体宇宙';
  }, 6000);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
