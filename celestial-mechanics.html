<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>万象引力 · 星体模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; touch-action: none; }

  #ui {
    position: fixed; z-index: 10;
    bottom: 36px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
  }
  #title {
    color: rgba(255,255,255,0.88);
    font-size: 1.5rem; letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(180,200,255,0.3);
  }
  #subtitle {
    color: rgba(255,255,255,0.4);
    font-size: 0.7rem; letter-spacing: 0.2em;
    transition: opacity 1.5s;
  }
  /* Scene menu — minimal text labels */
  #scene-menu {
    position: fixed; top: 200px; left: 12px; z-index: 15;
    display: flex; flex-direction: column; gap: 5px;
    pointer-events: all;
    max-height: calc(100vh - 240px);
    overflow-y: auto;
    padding: 18px 4px 18px 8px;
    border-left: 1px solid rgba(255,255,255,0.06);
  }
  #scene-menu::-webkit-scrollbar { width: 0; }
  #scene-menu::before, #scene-menu::after {
    content: '';
    position: sticky;
    left: 0; right: 0;
    display: block;
    height: 22px;
    flex-shrink: 0;
    pointer-events: none;
    z-index: 2;
  }
  #scene-menu::before {
    top: 0;
    background: linear-gradient(to bottom, rgba(5,5,16,0.95), transparent);
    margin-bottom: -22px;
  }
  #scene-menu::after {
    bottom: 0;
    background: linear-gradient(to top, rgba(5,5,16,0.95), transparent);
    margin-top: -22px;
  }
  .mode-btn {
    background: none; border: none;
    color: rgba(255,255,255,0.25);
    padding: 2px 0;
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: color 0.3s;
    text-align: left;
  }
  .mode-btn:hover { color: rgba(255,255,255,0.55); }
  .mode-btn.active {
    color: rgba(255,255,255,0.9);
    text-shadow: 0 0 8px rgba(180,200,255,0.25);
  }

  #info {
    position: fixed; top: 24px; right: 24px; z-index: 10;
    color: rgba(255,255,255,0.4); font-size: 0.95rem;
    letter-spacing: 0.06em; text-align: right; line-height: 1.7;
    font-family: 'Courier New', monospace;
    pointer-events: none;
  }

  /* Milestone panel */
  #milestone-panel {
    position: fixed; top: 620px; right: 8px; z-index: 12;
    pointer-events: none;
    display: flex; flex-direction: column; gap: 4px;
  }
  #milestone-title {
    color: rgba(255,255,255,0.35);
    font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .milestone-line {
    color: rgba(255,255,255,0.25);
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    transition: color 0.5s;
    white-space: nowrap;
  }
  .milestone-line.done {
    color: rgba(255,220,140,0.55);
    text-decoration: line-through;
    text-decoration-color: rgba(255,220,140,0.2);
  }
  .milestone-line.active {
    color: rgba(255,255,255,0.65);
  }
  .milestone-progress {
    color: rgba(255,255,255,0.3);
    font-size: 0.6rem;
    margin-left: 4px;
  }

  #event-log {
    position: fixed; top: 115px; right: 24px; z-index: 10;
    display: flex; flex-direction: column; gap: 5px;
    pointer-events: none;
    max-width: 320px;
  }

  /* Star placement grid — collapsible */
  #star-panel {
    position: fixed; top: 210px; right: 8px; z-index: 15;
    pointer-events: all;
    background: rgba(10,10,25,0.88);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: width 0.25s ease;
  }
  #star-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 5px; margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 6px;
  }
  #star-panel-title {
    color: rgba(255,255,255,0.5);
    font-size: 0.68rem; letter-spacing: 0.1em;
  }
  #star-panel-toggle {
    width: 18px; height: 18px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.4);
    font-size: 0.6rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    line-height: 1;
    padding: 0;
  }
  #star-panel-toggle:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #star-panel-toggle.expanded { transform: rotate(180deg); }

  #star-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    max-height: 340px;
    overflow-y: auto;
    padding-right: 2px;
    transition: grid-template-columns 0.25s ease;
  }
  #star-list.expanded {
    grid-template-columns: repeat(4, 1fr);
    max-height: 420px;
  }
  #star-list::-webkit-scrollbar { width: 3px; }
  #star-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .star-entry {
    width: 68px; height: 68px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    color: rgba(255,255,255,0.45);
    font-size: 0.6rem;
    letter-spacing: 0.03em;
    text-align: center;
    line-height: 1.1;
  }
  .star-entry:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.8);
    border-color: rgba(255,255,255,0.2);
    transform: scale(1.06);
  }
  .star-entry.selected {
    background: rgba(255,255,255,0.14);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 16px rgba(180,200,255,0.15);
  }
  .star-entry-orb {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .event-line {
    color: rgba(255,220,140,0.85);
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-align: right;
    line-height: 1.4;
    transition: opacity 0.6s ease, transform 0.3s ease;
    transform: translateY(0);
    text-shadow: 0 0 6px rgba(255,200,100,0.2);
  }
  .event-line.enter {
    animation: eventIn 0.4s ease-out;
  }
  @keyframes eventIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #hint {
    color: rgba(255,255,255,0.25);
    font-size: 0.85rem; letter-spacing: 0.08em;
    transition: opacity 2s;
  }

  /* Layer indicator */
  #layer-indicator {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    z-index: 15; pointer-events: none;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transition: opacity 0.35s ease;
  }
  #layer-indicator.visible { opacity: 1; }
  #layer-indicator .layer-dot {
    width: 8px; height: 8px; border-radius: 50%;
    transition: all 0.4s ease;
  }
  #layer-indicator .layer-label {
    color: rgba(255,255,255,0.55);
    font-size: 0.68rem; letter-spacing: 0.1em;
    font-family: 'Georgia', serif;
    transition: color 0.4s;
  }
  #layer-indicator .layer-label.structure { color: rgba(255,180,100,0.7); }

  /* Help icon */
  #help-toggle {
    position: fixed; top: 20px; left: 24px; z-index: 20;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.45);
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.35s;
    pointer-events: all;
    font-family: 'Georgia', serif;
    line-height: 1;
  }
  #help-toggle:hover, #help-toggle.open {
    background: rgba(255,255,255,0.14);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 18px rgba(180,200,255,0.1);
  }

  /* Help dropdown */
  #help-panel {
    position: fixed; top: 60px; left: 24px; z-index: 19;
    background: rgba(12,12,30,0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 14px;
    min-width: 190px;
    max-width: calc(100vw - 48px);
    opacity: 0; visibility: hidden;
    transform: translateY(-8px);
    transition: all 0.3s ease;
    pointer-events: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  #help-panel.visible {
    opacity: 1; visibility: visible;
    transform: translateY(0);
    pointer-events: all;
  }

  #help-title {
    color: rgba(255,255,255,0.75);
    font-size: 0.85rem; letter-spacing: 0.12em;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .help-section { display: flex; flex-direction: column; gap: 5px; }
  .help-label {
    color: rgba(255,255,255,0.35);
    font-size: 0.65rem; letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .help-row {
    color: rgba(255,255,255,0.5); font-size: 0.72rem;
    letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 6px;
  }
  kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 3px;
    padding: 1px 6px;
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.65);
    white-space: nowrap;
  }

  .ctrl-group {
    display: flex; align-items: center; gap: 8px;
    color: rgba(255,255,255,0.45); font-size: 0.72rem;
    letter-spacing: 0.06em;
  }
  .ctrl-group input[type="range"] {
    width: 80px; height: 3px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.2);
    border-radius: 2px; outline: none;
  }
  .ctrl-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    cursor: pointer;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
    padding: 5px 12px; border-radius: 12px;
    font-family: inherit; font-size: 0.72rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.3s;
  }
  .ctrl-btn.on {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.75);
    border-color: rgba(255,255,255,0.3);
  }

  /* ── Mobile zoom slider ──────────────────── */
  #mobile-zoom {
    display: none;
    position: fixed; bottom: 8px; right: 54px; z-index: 20;
    width: 100px; height: 32px;
    pointer-events: all;
  }
  #mobile-zoom input { width: 100%; accent-color: rgba(140,200,255,0.5); }
  #mobile-reset {
    display: none;
    position: fixed; bottom: 10px; right: 8px; z-index: 20;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(10,10,30,0.85);
    color: rgba(255,255,255,0.5);
    font-size: 0.9rem; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    pointer-events: all; transition: all 0.2s;
  }
  #mobile-reset:active { background: rgba(255,255,255,0.15); color: #fff; }

  /* ── Landscape orientation tweak ──────── */
  @media (max-height: 500px) {
    #ui { bottom: 8px; gap: 2px; }
    #title { font-size: 1rem; }
    #subtitle { display: none; }
    #hint { font-size: 0.5rem; }
    #star-panel { bottom: 44px; }
  }

  /* ── Mobile ──────────────────────────── */
  @media (max-width: 768px) {
    #title { font-size: 1.15rem; letter-spacing: 0.1em; }
    #subtitle { font-size: 0.62rem; }

    #ui { bottom: 48px; gap: 4px; }
    #hint { font-size: 0.55rem; text-align: center; max-width: 88vw; line-height: 1.4; }
    #scene-menu { top: 140px; left: 4px; gap: 2px; padding: 14px 3px 14px 6px; }
    .mode-btn { padding: 0; font-size: 0.6rem; }

    #info { top: 12px; right: 12px; font-size: 0.6rem; line-height: 1.5; }
    #event-log { top: 82px; right: 12px; max-width: 220px; }
    #milestone-panel { top: 220px; left: 6px; }
    .milestone-line { font-size: 0.45rem; }
    .event-line { font-size: 0.6rem; }

    #help-toggle { top: 12px; right: 12px; left: auto; width: 28px; height: 28px; font-size: 0.8rem; }
    #help-panel { top: 46px; right: 8px; left: auto; min-width: 180px; padding: 12px 14px; }

    #star-panel { top: auto; bottom: 50px; right: 8px; left: 8px; padding: 6px; width: auto; }
    #star-panel-title { font-size: 0.5rem; }
    #star-panel-header { padding-bottom: 4px; margin-bottom: 3px; }
    #star-list { grid-template-columns: repeat(9, 1fr); gap: 4px; max-height: none; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; flex-wrap: nowrap; }
    .star-entry { width: 56px; height: 56px; flex-shrink: 0; font-size: 0.45rem; }
    .star-entry-orb { width: 24px; height: 24px; }
    #star-panel-toggle { display: none; }
    .ctrl-group input[type="range"] { width: 50px; }

    #mobile-zoom { display: block; }
    #mobile-reset { display: flex; }
  }

  @media (max-width: 400px) {
    #title { font-size: 1rem; }
    #subtitle { font-size: 0.55rem; }
    #scene-menu { top: 120px; left: 2px; gap: 1px; padding: 12px 2px 12px 4px; }
    .mode-btn { padding: 0; font-size: 0.5rem; }
    #hint { font-size: 0.48rem; }
    #help-toggle { top: 8px; right: 6px; left: auto; width: 26px; height: 26px; font-size: 0.75rem; }
    #help-panel { top: 40px; right: 4px; left: auto; min-width: 155px; padding: 10px 12px; gap: 10px; }
    #info { top: 8px; right: 8px; font-size: 0.5rem; }
    #event-log { top: 62px; right: 8px; max-width: 170px; }
    .event-line { font-size: 0.5rem; }
    #star-list { grid-template-columns: repeat(9, 1fr); gap: 3px; }
    .star-entry { width: 44px; height: 44px; font-size: 0.4rem; }
    .star-entry-orb { width: 20px; height: 20px; }
    #ui { bottom: 44px; }
    #star-panel { bottom: 46px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="mobile-zoom"><input type="range" id="zoom-slider" min="12" max="800" value="100" title="缩放"></div>
<button id="mobile-reset" title="重置视角">⊙</button>

<div id="ui">
  <div id="title">万象引力 · 星体</div>
  <div id="subtitle">牛顿引力下的 N 体宇宙</div>
  <div id="hint">先选天体 · 点击放置 · 拖拽弹射 · 长按消除</div>
</div>

<div id="layer-indicator">
  <div class="layer-dot" id="layer-dot"></div>
  <span class="layer-label" id="layer-label">表象</span>
</div>

<div id="info">
  <div id="fps"></div>
  <div id="body-count"></div>
  <div id="energy"></div>
</div>

<!-- Event log ─────────────────────────────── -->
<div id="event-log"></div>

<!-- Milestone timeline ────────────────────── -->
<div id="milestone-panel">
  <div id="milestone-title">里程碑</div>
  <div id="milestone-list"></div>
</div>

<!-- Star placement panel ──────────────────── -->
<div id="star-panel">
  <div id="star-panel-header">
    <span id="star-panel-title">天体</span>
    <button id="star-panel-toggle" title="展开">▸</button>
  </div>
  <div id="star-list"></div>
</div>

<!-- Scene menu ────────────────────────────── -->
<div id="scene-menu">
  <button class="mode-btn active" data-mode="solar">太阳系</button>
  <button class="mode-btn" data-mode="binary">双星共舞</button>
  <button class="mode-btn" data-mode="cluster">星团引力</button>
  <button class="mode-btn" data-mode="spiral">旋涡星系</button>
  <button class="mode-btn" data-mode="collision">星系对撞</button>
  <button class="mode-btn" data-mode="chaos">自由混沌</button>
  <button class="mode-btn" data-mode="threebody">三体问题</button>
  <button class="mode-btn" data-mode="blackhole">银心黑洞</button>
  <button class="mode-btn" data-mode="tatooine">塔图因双星</button>
  <button class="mode-btn" data-mode="roche">潮汐撕裂</button>
  <button class="mode-btn" data-mode="impact">天地撞击</button>
  <button class="mode-btn" data-mode="wanderer">流浪地球</button>
</div>

<!-- Help / Controls ──────────────────────────── -->
<div id="help-toggle" title="操作说明">?</div>

<div id="help-panel">
  <div id="help-title">操作</div>
  <div class="help-section">
    <div class="help-label">快捷操作</div>
    <div class="help-row"><kbd>滚轮</kbd> 缩放</div>
    <div class="help-row"><kbd>Shift</kbd>+拖拽 平移</div>
    <div class="help-row"><kbd>双击</kbd> 重置视角</div>
    <div class="help-row"><kbd>点击</kbd> 放置星体</div>
    <div class="help-row"><kbd>拖拽</kbd> 给初速度</div>
    <div class="help-row"><kbd>右键</kbd> 消除星体</div>
  </div>
  <div class="help-section">
    <div class="help-label">键盘</div>
    <div class="help-row"><kbd>1</kbd>-<kbd>9</kbd> 切换场景</div>
    <div class="help-row"><kbd>G</kbd> 力场网格</div>
    <div class="help-row"><kbd>T</kbd> 轨道痕迹</div>
    <div class="help-row"><kbd>F</kbd> 引力线</div>
    <div class="help-row"><kbd>E</kbd> 相对论效应</div>
    <div class="help-row"><kbd>R</kbd> 重置场景</div>
    <div class="help-row"><kbd>C</kbd> 清空天体</div>
    <div class="help-row"><kbd>L</kbd> 结构层/表象层</div>
  </div>
  <div class="help-section">
    <div class="help-label">参数</div>
    <div class="ctrl-group">
      <span>引力 G</span>
      <input type="range" id="g-slider" min="10" max="100" step="1" value="39">
    </div>
    <div class="ctrl-group">
      <span>速度</span>
      <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1.5">
    </div>
  </div>
  <div class="help-section">
    <button class="ctrl-btn on" id="toggle-grid">力场网格</button>
    <button class="ctrl-btn on" id="toggle-trails">轨道痕迹</button>
    <button class="ctrl-btn" id="toggle-lines">引力线</button>
    <button class="ctrl-btn on" id="toggle-relativity">相对论</button>
    <button class="ctrl-btn" id="toggle-grid-quality">网格精度</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 宏观力学星空模拟器 — Real-Unit Physics Engine
// Units: M☉ (solar mass), AU (astronomical unit), year
// G = 4π² AU³/(M☉·year²) — exact from Kepler's 3rd law
// 1 AU = 50 screen pixels at zoom=1
// ═══════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Physical constants (real units) ─────────────
const G0 = 4 * Math.PI * Math.PI; // ≈ 39.478 AU³/(M☉·year²)
const PX_PER_AU = 50;             // display: 1 AU = 50px at zoom=1
const DT_BASE = 1 / 1500;         // 1500 steps ≈ 1 Earth orbit ≈ 25 sec @60fps
// Real reference values for display
const M_SUN_KG = 1.989e30;        // kg
const AU_KM = 1.496e8;            // km
const R_SUN_KM = 6.963e5;         // km
const R_EARTH_KM = 6371;          // km
const V_EARTH_KM_S = 29.8;        // km/s

// roundRect polyfill (standard: no internal beginPath)
if (!ctx.roundRect) {
  ctx.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
    ctx.moveTo(x + r.tl, y);
    ctx.lineTo(x + w - r.tr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
    ctx.lineTo(x + w, y + h - r.br);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
    ctx.lineTo(x + r.bl, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
    ctx.lineTo(x, y + r.tl);
    ctx.quadraticCurveTo(x, y, x + r.tl, y);
    ctx.closePath();
  };
}

let W, H;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

// ── Camera (AU → pixels) ────────────────────────
let camX = 0, camY = 0;   // AU position at screen center
let zoom = 1;
const ZOOM_MIN = 0.12;
const ZOOM_MAX = 8;

function worldToScreen(wx, wy) {
  return { x: (wx - camX) * PX_PER_AU * zoom + W/2, y: (wy - camY) * PX_PER_AU * zoom + H/2 };
}
function screenToWorld(sx, sy) {
  return { x: (sx - W/2) / (PX_PER_AU * zoom) + camX, y: (sy - H/2) / (PX_PER_AU * zoom) + camY };
}

function applyCamera() {
  ctx.save();
  ctx.translate(W/2, H/2);
  const s = PX_PER_AU * zoom;
  ctx.scale(s, s);
  ctx.translate(-camX, -camY);
}
function resetCameraTransform() { ctx.restore(); }

function zoomAt(sx, sy, newZoom) {
  const w = screenToWorld(sx, sy);
  const z0 = zoom;
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
  const factor = 1 - z0 / zoom;
  camX += (w.x - camX) * factor;
  camY += (w.y - camY) * factor;
}

function resetCamera() { camX = 0; camY = 0; zoom = 1; }

// ── Simulation Parameters ────────────────────────

let simSpeed = 1.5;

const gridLabels = ['网格 低','网格 中','网格 高','网格 极致'];
let gridQuality = 1;

// ═══════════════════════════════════════════════════
// 背景星空 (Static twinkling background stars)
// ═══════════════════════════════════════════════════
class Starfield {
  constructor(n) {
    this.stars = [];
    for (let i = 0; i < n; i++) {
      this.stars.push({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.3 + 0.3,
        phase: Math.random() * Math.PI * 2,
        period: Math.random() * 300 + 200,
        baseAlpha: Math.random() * 0.35 + 0.1
      });
    }
  }

  draw(ctx, t, bodies) {
    // Find black holes and massive bodies for lensing (screen-space positions)
    const lensers = [];
    if (showRelativity && bodies && bodies.length > 0) {
      for (const b of bodies) {
        if (b.mass > 30) {
          const sp = worldToScreen(b.x, b.y);
          lensers.push({ sx: sp.x, sy: sp.y, mass: b.mass, isBH: b.isBlackHole, radius: b.radius });
        }
      }
    }

    for (const s of this.stars) {
      const alpha = s.baseAlpha + Math.sin(t * 0.015 + s.phase) * 0.12;
      if (alpha < 0.03) continue;
      let sx = s.x * W;
      let sy = s.y * H;

      // Gravitational lensing
      if (lensers.length > 0) {
        for (const L of lensers) {
          const dx = sx - L.sx;
          const dy = sy - L.sy;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 1) continue; // avoid singularity at center
          const shadowR = L.isBH ? L.radius * PX_PER_AU * zoom * 3 : 0;
          if (L.isBH && dist < shadowR) {
            // Stars behind the shadow get pulled to the photon ring
            const ringR = shadowR * 1.3;
            const nx = dx/dist, ny = dy/dist;
            sx = L.sx + nx * ringR;
            sy = L.sy + ny * ringR;
          } else if (dist < 300) {
            // Deflection: stronger for black holes, falls as 1/dist
            const strength = L.isBH
              ? L.mass * 15 / dist
              : L.mass * 2 / (dist * dist / 100);
            const nx = dx/dist, ny = dy/dist;
            sx += nx * strength;
            sy += ny * strength;
          }
        }
      }

      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(190,210,255,${Math.max(0, alpha)})`;
      ctx.fill();
    }
  }
}

// ═══════════════════════════════════════════════════
// 力场网格 (Gravitational Field Grid)
// 可视化空间各点的引力场强度与方向
// ═══════════════════════════════════════════════════
class FieldGrid {
  constructor() {
    this.cols = 50; this.rows = 35;
    this.vertices = null;
  }

  updateResolution() {
    const [c, r] = GRID_LEVELS[gridQuality] || GRID_LEVELS[1];
    if (this.cols !== c || this.rows !== r) {
      this.cols = c; this.rows = r; this.vertices = null;
    }
  }

  compute(bodies) {
    this.updateResolution();
    const cols = this.cols;
    const rows = this.rows;
    // Visible world region in AU
    const halfW = W / (2 * PX_PER_AU * zoom);
    const halfH = H / (2 * PX_PER_AU * zoom);
    const left = camX - halfW;
    const top = camY - halfH;
    const cellW = (halfW * 2) / (cols - 1);
    const cellH = (halfH * 2) / (rows - 1);

    if (!this.vertices) {
      this.vertices = new Float32Array(cols * rows * 2);
      this.potentials = new Float32Array(cols * rows);
    }

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const idx = (j * cols + i) * 2;
        const wx = left + i * cellW;
        const wy = top + j * cellH;

        let fx = 0, fy = 0;
        let potential = 0;

        for (const b of bodies) {
          const dx = wx - b.x;
          const dy = wy - b.y;
          const rawDist = Math.sqrt(dx*dx + dy*dy);
          // Skip displacement inside body's visual radius (avoids "hole" effect)
          const innerRadius = b.radius * 0.7;
          const weight = rawDist < innerRadius ? rawDist / innerRadius : 1;
          // Softening in AU²
          const distSq = dx*dx + dy*dy + 0.005;
          const dist = Math.sqrt(distSq);
          const distClamped = Math.max(dist, 0.07);

          const accel = G * b.mass / distSq * weight;
          fx += accel * (dx / distClamped);
          fy += accel * (dy / distClamped);
          potential -= G * b.mass / distClamped * weight;
        }

        // Displacement: scale gravitational acceleration to visible AU warping
        const FIELD_SCALE = 0.0045 / zoom;
        const mag = Math.sqrt(fx * fx + fy * fy);
        const maxDisp = Math.min(cellW, cellH) * 2.2;
        const rawDisp = mag * FIELD_SCALE;
        const disp = rawDisp > maxDisp ? maxDisp + Math.log(1 + rawDisp - maxDisp) * 0.5 : rawDisp;
        const factor = mag > 0.0001 ? disp / mag : 0;

        this.vertices[idx] = wx + fx * factor;
        this.vertices[idx + 1] = wy + fy * factor;
        this.potentials[j * cols + i] = potential;
      }
    }
  }

  draw(ctx) {
    if (!this.vertices) return;
    const cols = this.cols;
    const rows = this.rows;
    const worldCellW = (W / (PX_PER_AU * zoom)) / (cols - 1);
    const worldCellH = (H / (PX_PER_AU * zoom)) / (rows - 1);

    ctx.save();
    ctx.strokeStyle = 'rgba(100,160,220,0.12)';
    ctx.lineWidth = 0.008 / zoom; // thin line in AU units

    // Horizontal lines
    for (let j = 0; j < rows; j++) {
      ctx.beginPath();
      const idx0 = j * cols * 2;
      ctx.moveTo(this.vertices[idx0], this.vertices[idx0 + 1]);
      for (let i = 1; i < cols; i++) {
        const idx = (j * cols + i) * 2;
        ctx.lineTo(this.vertices[idx], this.vertices[idx + 1]);
      }
      ctx.stroke();
    }

    // Vertical lines
    for (let i = 0; i < cols; i++) {
      ctx.beginPath();
      const idx0 = i * 2;
      ctx.moveTo(this.vertices[idx0], this.vertices[idx0 + 1]);
      for (let j = 1; j < rows; j++) {
        const idx = (j * cols + i) * 2;
        ctx.lineTo(this.vertices[idx], this.vertices[idx + 1]);
      }
      ctx.stroke();
    }

    // Potential heat map (subtle)
    if (this.potentials) {
      const maxP = -Math.min(...this.potentials);
      const minP = -Math.max(...this.potentials);
      const range = maxP - minP || 1;

      for (let j = 0; j < rows - 1; j++) {
        for (let i = 0; i < cols - 1; i++) {
          const p = -(this.potentials[j * cols + i]);
          const t = (p - minP) / range;
          if (t < 0.15) continue;
          const alpha = t * 0.06;
          const x = (this.vertices[(j * cols + i) * 2] + this.vertices[((j+1) * cols + i+1) * 2]) / 2;
          const y = (this.vertices[(j * cols + i) * 2 + 1] + this.vertices[((j+1) * cols + i+1) * 2 + 1]) / 2;

          ctx.fillStyle = `rgba(255,180,100,${alpha})`;
          ctx.fillRect(x - worldCellW/2, y - worldCellH/2, worldCellW, worldCellH);
        }
      }
    }

    ctx.restore();
  }
}

const TRAIL_MAX = 180;

// ── Star name generator ────────────────────────
const namePool = {
  greek:  ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ'],
  chinese: ['天枢','天璇','天玑','天权','玉衡','开阳','摇光','参宿','商宿','紫微','天市','太微','少微','星宿'],
  star:   ['天鹰','天琴','天鹅','猎户','天蝎','金牛','双子','巨蟹','狮子','飞马','天龙','仙王','麒麟','凤凰'],

};
function randomStarName() {

// ═══════════════════════════════════════════════════
// 粒子系统 (纯视觉 — 不参与引力计算)
// ═══════════════════════════════════════════════════
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size || 0.006;
  }
  update(dt) { this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt; }
  draw(ctx) {
    const alpha = Math.max(0, this.life / this.maxLife);
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `rgba(${this.color},${alpha})`);
    grad.addColorStop(0.4, `rgba(${this.color},${alpha*0.6})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
  }
  get alive() { return this.life > 0; }
}

function spawnParticles(x, y, count, speed, life, color, size) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.3 + Math.random() * 1.0);
    particles.push(new Particle(x, y, Math.cos(angle)*spd, Math.sin(angle)*spd, life*(0.5+Math.random()*0.5), color, size));
  }
}
function spawnParticlesDir(x, y, count, speed, life, color, size, nx, ny, bias) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.3 + Math.random() * 1.0);
    // Blend random direction with bias direction
    const bx = Math.cos(angle)*(1-bias) + nx*bias;
    const by = Math.sin(angle)*(1-bias) + ny*bias;
    const bmag = Math.sqrt(bx*bx+by*by);
    particles.push(new Particle(x, y, bx/bmag*spd, by/bmag*spd, life*(0.5+Math.random()*0.5), color, size));
  }
}

class Body {
  constructor(x, y, vx, vy, mass, colorHint, name, isBlackHole) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.ax = 0;
    this.ay = 0;
    this.mass = mass;
    // Visual radius in AU — enhanced ~100× over real for visibility
    // Real Sun radius = 0.00465 AU; our visual ≈ 0.11 AU (24× enhancement)
    this.radius = Math.cbrt(mass) * 0.10 + 0.025;
    this.name = name || randomStarName();
    this.isBlackHole = !!isBlackHole;

    this.color = colorHint || this._massColor(mass);
    this.trail = [];
    this.alive = true;
  }

  _massColor(mass) {
    if (mass > 200) return { r: 100, g: 140, b: 255 }; // supermassive
    if (mass > 80) return { r: 180, g: 200, b: 255 };
    if (mass > 40) return { r: 220, g: 230, b: 255 };
    if (mass > 15) return { r: 255, g: 245, b: 230 };
    if (mass > 5)  return { r: 255, g: 240, b: 180 };
    if (mass > 2)  return { r: 255, g: 200, b: 100 };
    if (mass > 0.8) return { r: 255, g: 160, b: 60 };
    return { r: 255, g: 100, b: 40 };
  }

  draw(ctx) {
    const { r, g, b } = this.color;
    const rad = this.radius;

    // Black hole — bloom ring + photon particles + dark shadow
    if (this.isBlackHole) {
      const Rg = Math.max(0.04, this.mass * 0.004);
      const shadowR = Rg * 2.6;
      const ringR = Rg * 4.2;
      const t = performance.now() * 0.001; // seconds for animation

      // ── Gravitational lensing halo (subtle blue-white) ──
      const haloGrad = ctx.createRadialGradient(this.x, this.y, ringR*0.9, this.x, this.y, ringR*3);
      haloGrad.addColorStop(0, 'rgba(160,190,240,0.07)');
      haloGrad.addColorStop(0.3, 'rgba(130,160,220,0.04)');
      haloGrad.addColorStop(0.7, 'rgba(80,100,180,0.01)');
      haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(this.x, this.y, ringR*3, 0, Math.PI*2);
      ctx.fillStyle = haloGrad; ctx.fill();

      // ── Multi-layer bloom ring (simulates photon sphere glow) ──
      const layers = [
        { r: ringR,      w: 0.018, a: 0.22, hue: '255,240,200' },
        { r: ringR,      w: 0.035, a: 0.10, hue: '255,220,160' },
        { r: ringR,      w: 0.06,  a: 0.04, hue: '255,180,100' },
        { r: ringR*0.78, w: 0.010, a: 0.30, hue: '255,245,220' },
        { r: ringR*0.78, w: 0.025, a: 0.12, hue: '255,200,140' },
      ];
      for (const l of layers) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, l.r, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(${l.hue},${l.a})`;
        ctx.lineWidth = l.w;
        ctx.stroke();
      }

      // ── Dark shadow ──
      const shGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, shadowR);
      shGrad.addColorStop(0, 'rgba(0,0,0,1)');
      shGrad.addColorStop(0.8, 'rgba(0,0,0,0.98)');
      shGrad.addColorStop(0.95, 'rgba(15,10,25,0.6)');
      shGrad.addColorStop(1, 'rgba(25,20,45,0.1)');
      ctx.beginPath(); ctx.arc(this.x, this.y, shadowR, 0, Math.PI*2);
      ctx.fillStyle = shGrad; ctx.fill();

      return;
    }

    // Relativistic Doppler shift: velocity toward/away from observer
    const dxCam = this.x - camX, dyCam = this.y - camY;
    const distCam = Math.sqrt(dxCam*dxCam + dyCam*dyCam) + 0.001;
    const vRadial = (this.vx*dxCam + this.vy*dyCam) / distCam; // + = receding, - = approaching
    const z = vRadial / C_SIM; // relativistic redshift parameter
    const doppler = showRelativity ? Math.max(0.3, Math.min(3, 1/(1 + z))) : 1;
    const dr = Math.min(255, Math.max(0, Math.round(r * doppler + (z<0?(-z*120):0))));
    const dg = Math.min(255, Math.max(0, Math.round(g * doppler)));
    const db = Math.min(255, Math.max(0, Math.round(b * doppler + (z>0?(-z*80):(z<0?(-z*60):0)))));

    // Trail
    if (showTrails && this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      const gradient = ctx.createLinearGradient(this.trail[0].x, this.trail[0].y, this.x, this.y);
      gradient.addColorStop(0, `rgba(${dr},${dg},${db},0)`);
      gradient.addColorStop(0.7, `rgba(${dr},${dg},${db},0.08)`);
      gradient.addColorStop(1, `rgba(${dr},${dg},${db},0.25)`);
      ctx.strokeStyle = gradient;
      ctx.lineWidth = this.radius * 0.4;
      ctx.stroke();
    }

    // Outer glow
    const glowGrad = ctx.createRadialGradient(this.x, this.y, rad*0.3, this.x, this.y, rad*4);
    glowGrad.addColorStop(0, `rgba(${dr},${dg},${db},0.5)`);
    glowGrad.addColorStop(0.3, `rgba(${dr},${dg},${db},0.2)`);
    glowGrad.addColorStop(0.6, `rgba(${dr},${dg},${db},0.04)`);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(this.x, this.y, rad*4, 0, Math.PI*2);
    ctx.fillStyle = glowGrad; ctx.fill();

    // Inner bright core
    const coreGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, rad);
    coreGrad.addColorStop(0, `rgba(255,255,255,0.95)`);
    coreGrad.addColorStop(0.15, `rgba(${dr},${dg},${db},0.9)`);
    coreGrad.addColorStop(0.5, `rgba(${dr},${dg},${db},0.5)`);
    coreGrad.addColorStop(1, `rgba(${dr},${Math.max(0,dg-40)},${Math.max(0,db-80)},0)`);
    ctx.beginPath(); ctx.arc(this.x, this.y, rad, 0, Math.PI*2);
    ctx.fillStyle = coreGrad; ctx.fill();
  }
}

// ═══════════════════════════════════════════════════
// N 体引力求解器 — Velocity Verlet + 自适应软化
// ═══════════════════════════════════════════════════
function solveGravity(bodies) {
  const n = bodies.length;
  if (n === 0) return;
  const dt = DT_BASE * simSpeed;

  // ── Phase 1: first half-kick + drift ──────
  for (let i = 0; i < n; i++) {
    const b = bodies[i];
    b.vx += 0.5 * b.ax * dt;
    b.vy += 0.5 * b.ay * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  }

  // ── Phase 2: merge overlapping bodies ─────
  for (let i = 0; i < n; i++) {
    const b = bodies[i];
    if (!b.alive) continue;
    for (let j = i + 1; j < n; j++) {
      const other = bodies[j];
      if (!other.alive) continue;
      const dx = other.x - b.x;
      const dy = other.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const mergeDist = (b.radius + other.radius) * 0.85;
      // Merge shield: don't merge event-protected bodies
      const now = performance.now();
      if ((b._shieldUntil && b._shieldUntil > now) || (other._shieldUntil && other._shieldUntil > now)) continue;
      if (dist < mergeDist) {
        // Save pre-merge values BEFORE modifying b
        const bMass0 = b.mass, oMass0 = other.mass;
        const bVx0 = b.vx, bVy0 = b.vy, oVx0 = other.vx, oVy0 = other.vy;
        const relSpeed = Math.sqrt((oVx0-bVx0)**2 + (oVy0-bVy0)**2);
        const tm = bMass0 + oMass0;
        const biggerIsB = bMass0 >= oMass0;

        // Merge: conserve momentum, position at center of mass
        b.x = (b.x * bMass0 + other.x * oMass0) / tm;
        b.y = (b.y * bMass0 + other.y * oMass0) / tm;
        b.vx = (bVx0 * bMass0 + oVx0 * oMass0) / tm;
        b.vy = (bVy0 * bMass0 + oVy0 * oMass0) / tm;
        b.mass = tm;
        b.radius = Math.cbrt(tm) * 0.10 + 0.025;
        b.ax = 0; b.ay = 0;
        other.alive = false;

        // Keep identity of the more massive body
        if (!biggerIsB) {
          b.name = other.name;
          b.color = other.color;
        }
        // If near-equal mass, blend colors
        if (Math.min(bMass0, oMass0) / Math.max(bMass0, oMass0) > 0.3) {
          const bc = b.color, oc = other.color;
          b.color = {
            r: Math.round((bc.r + oc.r) / 2),
            g: Math.round((bc.g + oc.g) / 2),
            b: Math.round((bc.b + oc.b) / 2)
          };
        }
        // Only clear trail if it was a disruptive merger
        if (relSpeed > 2 || Math.min(bMass0, oMass0) < tm * 0.1) {
          b.trail = [];
        }

        // Particle effects
        const massRatio = Math.max(bMass0, oMass0) / Math.max(Math.min(bMass0, oMass0), 1e-10);
        const debrisColor = biggerIsB ? (other.color || b.color) : (b.color || other.color);

        if (massRatio > 10) {
          spawnParticles(b.x, b.y, 25, relSpeed*0.4 + 1.5, 2.5, `${debrisColor.r},${debrisColor.g},${debrisColor.b}`, 0.008);
          emitEvent(`${biggerIsB ? b.name : other.name} 撕碎了 ${biggerIsB ? other.name : b.name} · 潮汐瓦解`);
        } else if (relSpeed > 3) {
          spawnParticles(b.x, b.y, 20, relSpeed*0.5, 1.8, '255,200,100', 0.01);
          emitEvent(`${b.name} 与 ${other.name} 高速撞击 · 质量 ${tm.toFixed(2)} M☉`);
        } else {
          emitEvent(`${b.name} 与 ${other.name} 融合 · 质量 ${tm.toFixed(2)} M☉`);
        }

        if (tm > 3 && showRelativity) {
          gwChirp = { x: b.x, y: b.y, t0: performance.now()*0.001, mass: tm, active: true };
        }
      }
    }
  }

  // Remove merged bodies
  for (let i = n - 1; i >= 0; i--) {
    if (!bodies[i].alive) bodies.splice(i, 1);
  }

  // ── Phase 3: compute accelerations ─────────
  const m = bodies.length;
  const accel = new Array(m);
  for (let i = 0; i < m; i++) accel[i] = { ax: 0, ay: 0 };

  for (let i = 0; i < m; i++) {
    const a = bodies[i];
    for (let j = i + 1; j < m; j++) {
      const b = bodies[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      // Softening in AU — based on smaller body's visual radius
      const effSoft = Math.max(0.015, Math.min(a.radius, b.radius) * 1.5);
      const distSq = dx * dx + dy * dy + effSoft * effSoft;
      const dist = Math.sqrt(distSq);
      const distClamped = Math.max(dist, effSoft);

      const forceMag = G / distSq;
      let relCorr = 1;
      if (showRelativity) {
        // Post-Newtonian 1/r³ correction: F → F·(1 + 3GM/(c²r))
        const rTrue = Math.sqrt(dx*dx + dy*dy);
        if (rTrue > 0.5) relCorr = 1 + 3 * G * (a.mass + b.mass) / (C_SIM * C_SIM * rTrue);
      }
      const fx = forceMag * relCorr * (dx / distClamped);
      const fy = forceMag * relCorr * (dy / distClamped);

      accel[i].ax += fx * b.mass;
      accel[i].ay += fy * b.mass;
      accel[j].ax -= fx * a.mass;
      accel[j].ay -= fy * a.mass;
    }
  }

  // ── Phase 4: second half-kick + trail ─────
  for (let i = 0; i < m; i++) {
    const b = bodies[i];
    b.vx += 0.5 * accel[i].ax * dt;
    b.vy += 0.5 * accel[i].ay * dt;

    // Progressive velocity damping (AU/year)
    const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    const maxSpd = 30; // ≈ 5× Earth orbital speed
    if (speed > maxSpd) {
      const extra = speed - maxSpd;
      const damped = maxSpd + extra / (1 + extra * 0.05);
      b.vx *= damped / speed;
      b.vy *= damped / speed;
    }

    // Store acceleration for next step's first half-kick
    b.ax = accel[i].ax;
    b.ay = accel[i].ay;

    // Trail
    b.trail.push({ x: b.x, y: b.y, age: 0 });
    if (b.trail.length > TRAIL_MAX) b.trail.shift();
    for (const p of b.trail) p.age += dt;
  }

  // ── Phase 5: remove runaway bodies ─────────
  for (let i = m - 1; i >= 0; i--) {
    const b = bodies[i];
    // Remove bodies beyond ~20 AU from origin
    if ((Math.abs(b.x) > 20 || Math.abs(b.y) > 20) && bodies.length > 1) {
      emitEvent(`${b.name} 被引力弹弓弹出系统 · 质量 ${b.mass.toFixed(1)}`);
      bodies.splice(i, 1);
    }
  }
}

// ═══════════════════════════════════════════════════
// 引力线绘制 (Force lines between bodies)
// ═══════════════════════════════════════════════════
function drawForceLines(ctx, bodies) {
  if (bodies.length < 2) return;

  const sorted = [...bodies].sort((a, b) => b.mass - a.mass);
  const topN = Math.min(sorted.length, 6);

  for (let i = 0; i < topN; i++) {
    const a = sorted[i];
    for (let j = i + 1; j < topN; j++) {
      const b = sorted[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 0.05) continue;
      const nx = dx/dist, ny = dy/dist;

      // Force magnitude (in AU units)
      const forceMag = G * a.mass * b.mass / (dist * dist + 0.01);
      const alpha = Math.min(0.3, forceMag * 0.8);

      // Subtle glow line — thickness ∝ force
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `rgba(160,200,255,${alpha})`;
      ctx.lineWidth = Math.min(0.03, forceMag * 0.06);
      ctx.stroke();

      // Small particle dots along the line (flow visualization)
      const steps = Math.round(dist / 0.5);
      for (let s = 1; s < steps; s++) {
        const frac = s / steps;
        const px = a.x + dx * frac;
        const py = a.y + dy * frac;
        const dotAlpha = alpha * (0.3 + 0.3 * Math.sin(frac * 10 + performance.now()*0.001));
        ctx.beginPath();
        ctx.arc(px, py, 0.008, 0, Math.PI*2);
        ctx.fillStyle = `rgba(180,220,255,${dotAlpha})`;
        ctx.fill();
      }
    }
  }
}

// ═══════════════════════════════════════════════════
// 总能量计算
// ═══════════════════════════════════════════════════
function computeEnergy(bodies) {
  let kinetic = 0;
  let potential = 0;
  const n = bodies.length;

  for (let i = 0; i < n; i++) {
    const b = bodies[i];
    const speedSq = b.vx * b.vx + b.vy * b.vy;
    kinetic += 0.5 * b.mass * speedSq;

    for (let j = i + 1; j < n; j++) {
      const dx = bodies[j].x - b.x;
      const dy = bodies[j].y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy + 100);
      potential -= G * b.mass * bodies[j].mass / dist;
    }
  }

  return { kinetic, potential, total: kinetic + potential };
}

// ═══════════════════════════════════════════════════
// 场景解释器
// ═══════════════════════════════════════════════════
const CX = 0, CY = 0;
const R = (a,b) => a + Math.random()*(b-a); // random in range

function buildScene(scene) {
  const bodies = [];
  const def = sceneDefs[scene];
  if (!def) return bodies;

  G = G0 * (def.g || 1);
  document.getElementById('g-slider').value = G;
  if (def.event) emitEvent(def.event);

  let parentBodies = []; // track binary centers and parent bodies

  for (const spec of def.bodies) {
    const idx = bodies.length; // index of next body (used as parent ref)

    if (spec.use === 'catalog') {
      const catBodies = bodyTypes.filter(b => b.cat === (spec.filter||'ss') && b.orbit !== undefined);
      for (const bt of catBodies) {
        const angle = Math.random()*Math.PI*2;
        const dist = bt.orbit, vCirc = dist>0 ? Math.sqrt(G*1.0/dist) : 0;
        bodies.push(new Body(Math.cos(angle)*dist, Math.sin(angle)*dist,
          -Math.sin(angle)*vCirc, Math.cos(angle)*vCirc, bt.mass, bt.color, bt.name, bt.isBH));
      }
      continue;
    }

    if (spec.type === 'body') {
      const bx = spec.x !== undefined ? spec.x : CX;
      const by = spec.y !== undefined ? spec.y : CY;
      const bvx = spec.vx || 0, bvy = spec.vy || 0;
      bodies.push(new Body(bx, by, bvx, bvy, spec.m, spec.c||null, spec.n||undefined, spec.bh||false));
      continue;
    }

    if (spec.type === 'binary') {
      const {m1,m2,sep,c1,c2,n1,n2} = spec;
      const tm = m1+m2, r1=sep*m2/tm, r2=sep*m1/tm;
      const v1=Math.sqrt(G*m2*m2/(sep*tm)), v2=Math.sqrt(G*m1*m1/(sep*tm));
      bodies.push(new Body(CX-r1, CY, 0, v1, m1, c1, n1));
      bodies.push(new Body(CX+r2, CY, 0, -v2, m2, c2, n2));
      parentBodies.push({ idx, type:'binary', totalMass:tm, cx:CX, cy:CY });
      continue;
    }

    if (spec.type === 'orbital') {
      const parent = spec.parent;
      let pMass, pCX=CX, pCY=CY;
      if (parent === 'binary') {
        const pb = parentBodies[parentBodies.length-1];
        pMass = pb.totalMass; pCX = pb.cx; pCY = pb.cy;
      } else if (typeof parent === 'number') {
        pMass = bodies[parent].mass; pCX = bodies[parent].x; pCY = bodies[parent].y;
      } else { pMass = 1.0; }

      for (let i=0; i<(spec.count||1); i++) {
        const angle = spec.fixedAngle !== undefined ? spec.fixedAngle : Math.random()*Math.PI*2;
        const dist = R(spec.dist[0], spec.dist[1]);
        const vCirc = Math.sqrt(G*pMass/dist);
        const vScale = spec.vScale ? R(spec.vScale[0], spec.vScale[1]) : 1;
        const vScatter = spec.vScatter || 0;
        const vAngle = angle + Math.PI/2 + (Math.random()-0.5)*vScatter;
        const vMag = vCirc * vScale;
        const mass = spec.mass ? R(spec.mass[0], spec.mass[1]) : 0.1;
        const name = spec.name || (spec.names ? spec.names[i] : undefined);
        const color = spec.color || undefined;
        bodies.push(new Body(pCX+Math.cos(angle)*dist, pCY+Math.sin(angle)*dist,
          Math.cos(vAngle)*vMag, Math.sin(vAngle)*vMag, mass, color, name));
      }
      continue;
    }

    if (spec.type === 'aimed') {
      const off = (Math.random()-0.5)*spec.scatter*2;
      const dist = spec.dist, speed = spec.speed;
      const px = CX + dist, py = CY + off;
      const aim = Math.atan2(CY-py, CX-px) + (Math.random()-0.5)*spec.scatter;
      bodies.push(new Body(px, py, Math.cos(aim)*speed, Math.sin(aim)*speed, spec.mass, spec.c, spec.n));
      continue;
    }

    if (spec.type === 'scatter') {
      for (let i=0; i<spec.count; i++) {
        const px = R(spec.pos[0], spec.pos[1]), py = R(spec.pos[0], spec.pos[1]);
        const vx = R(spec.vel[0], spec.vel[1]), vy = R(spec.vel[0], spec.vel[1]);
        const mass = R(spec.mass[0], spec.mass[1]);
        bodies.push(new Body(px, py, vx, vy, mass));
      }
      continue;
    }

    if (spec.type === 'spiral') {
      const pMass = bodies[spec.parent].mass;
      for (let arm=0; arm<spec.arms; arm++) {
        const armAngle = (arm/spec.arms)*Math.PI*2;
        for (let i=0; i<spec.perArm; i++) {
          const dist = spec.dist[0] + (i/spec.perArm)*(spec.dist[1]-spec.dist[0]);
          const angle = armAngle + (i/spec.perArm)*Math.PI*1.6 + (Math.random()-0.5)*0.3;
          const vCirc = Math.sqrt(G*pMass/dist) * (spec.vScale||1);
          const mass = R(spec.mass[0], spec.mass[1]);
          bodies.push(new Body(CX+Math.cos(angle)*dist, CY+Math.sin(angle)*dist,
            -Math.sin(angle)*vCirc, Math.cos(angle)*vCirc, mass));
        }
      }
      continue;
    }

    if (spec.type === 'colliding-cluster') {
      const {cx, vx, n, mass, count, c} = spec;
      bodies.push(new Body(cx, CY, vx, 0, mass, c, n));
      for (let i=0; i<count; i++) {
        const angle = Math.random()*Math.PI*2;
        const dist = 0.8 + Math.random()*4;
        const vCirc = Math.sqrt(G*mass/dist);
        bodies.push(new Body(cx+Math.cos(angle)*dist, CY+Math.sin(angle)*dist,
          vx - Math.sin(angle)*vCirc, Math.cos(angle)*vCirc, 0.03+Math.random()*0.1, c));
      }
      continue;
    }

    if (spec.type === 'elliptical') {
      const parent = bodies[spec.parent];
      const angle = Math.random()*Math.PI*2;
      const r = spec.a*(1-spec.e*spec.e)/(1+spec.e*Math.cos(angle));
      const speed = Math.sqrt(G*parent.mass*(2/r - 1/spec.a));
      const vAngle = angle + Math.PI/2;
      bodies.push(new Body(parent.x+Math.cos(angle)*r, parent.y+Math.sin(angle)*r,
        -Math.sin(vAngle)*speed, Math.cos(vAngle)*speed, spec.mass, spec.color, spec.name));
      continue;
    }

    if (spec.type === 'threebody') {
      const S = R(spec.radius[0], spec.radius[1]);
      const mass = R(spec.mass[0], spec.mass[1]);
      const vOrb = Math.sqrt(G*mass/(1.732*S));
      const rot0 = Math.random()*Math.PI*2;
      const variant = Math.random();

      if (variant < 0.5) {
        for (let i=0; i<3; i++) {
          const angle = rot0 + (i/3)*Math.PI*2 + (Math.random()-0.5)*0.015;
          bodies.push(new Body(CX+Math.cos(angle)*S, CY+Math.sin(angle)*S,
            -Math.sin(angle)*vOrb, Math.cos(angle)*vOrb, mass, spec.colors[i], spec.names[i]));
        }
        emitEvent('三体 · 拉格朗日等边三角形 — 混沌边缘');
      } else {
        for (let i=0; i<3; i++) {
          const angle = rot0 + (i/3)*Math.PI*2 + (Math.random()-0.5)*0.6;
          const dist = S*(0.7+Math.random()*0.6);
          const vx = (Math.random()-0.5)*vOrb*2;
          const vy = (Math.random()-0.5)*vOrb*2;
          bodies.push(new Body(CX+Math.cos(angle)*dist, CY+Math.sin(angle)*dist, vx, vy, mass, spec.colors[i], spec.names[i]));
        }
        emitEvent('三体 · 混沌初值 — 不可预测的舞蹈');
      }
      continue;
    }
  }

  return bodies;
}
